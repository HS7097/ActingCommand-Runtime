[[tools]]
id = "maatouch"
name = "MaaTouch"
source_project = "MaaAssistantArknights/MaaTouch"
source_url = "https://github.com/MaaAssistantArknights/MaaTouch"
source_path = "the built maatouch binary; the same file (git blob e164cdb89963d21fb08defb35f9759760eeb1944, 13775 bytes) as bin/MaaTouch/maatouch in LmeSzinc/AzurLaneAutoScript and in wess09/AzurPilot"
local_hint = "external-tools/maatouch/maatouch"
included_in_repository = true
license_review = "Apache-2.0; the licence text is external-tools/maatouch/LICENSE. Included after licence review by the project owner's instruction: see NOTICE.md, 'Included external tool binaries'."
notes = "Used by the Runtime's MaaTouch input backend through the actingd configuration (device_paths.maatouch_path, or an instance's maatouch_local_path) or the committed external-tools copy. This entry was corrected on 2026-11-12: it had named wess09/AzurPilot as the source and said the binary was not committed."

