# SPDX-License-Identifier: AGPL-3.0-only

# #402 step 1 (C2, plan v2.1 §3.1-§3.11): the capture experiment carrier `ac-capture-bench`.
# It lives on the experiment branch only (draft pull request, never merged), is no release
# binary and is in no release package. It links the device crate with the default-off timing
# points, the host metrics and the artifact store; it never connects to the production Runtime.

[package]
name = "actingcommand-capture-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ac-capture-bench"
path = "src/main.rs"

[features]
# §3.3.1: the lock-order check of the bench's same-shape locks; on in D1, D2 and on the device.
default = ["bench-lockcheck"]
bench-lockcheck = []

[dependencies]
actingcommand-artifact-store = { workspace = true }
actingcommand-contract = { workspace = true }
actingcommand-device = { workspace = true, features = ["bench-timing"] }
actingcommand-host-metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }
