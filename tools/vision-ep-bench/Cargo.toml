# SPDX-License-Identifier: AGPL-3.0-only

# Workflow #407 GPU-0a: the vision execution-provider bench `ac-vision-ep-bench`. It lives on the
# experiment branch `exp/407-gpu0-bench` only (draft pull request, never merged), is no release
# binary and is in no release package. One process measures one ONNX Runtime execution provider
# (CPU, CUDA or DirectML) on the production OCR model with the production engine; it never
# touches a device, the production install or a ledger, and writes only its `--out` file.

[package]
name = "actingcommand-vision-ep-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ac-vision-ep-bench"
path = "src/main.rs"

[dependencies]
actingcommand-host-metrics = { workspace = true }
actingcommand-ppocr-onnx-json-provider = { workspace = true }
# Workflow #407 GPU-0b: the template mode's exact score map and direct enumeration.
actingcommand-recognition = { workspace = true }
actingcommand-vision-ffi = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "api-24",
    "load-dynamic",
    "std",
] }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_LibraryLoader",
] }
