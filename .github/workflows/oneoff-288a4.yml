name: one-off 288 A4 (to be reverted)

# One-off evidence for Workflow #288 A4 (retire the Git source-tree loader). The control group is
# the PR's exact merge-base 3b15f86f, built and run in the same job as the PR head over the same
# inputs. Reverted right after its run; the PR's final diff contains neither this file nor
# one-off-288a4/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a4:
    name: A4 (a)-(d) control 3b15f86f and head
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CONTROL_SHA: 3b15f86f5de417150a640d865f096b4bb980a60c
      UMBRELLA_SHA: 536f048a3cac26ddbb0391895391f98967704cb0
    steps:
      - name: Check out the control commit (merge-base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3b15f86f5de417150a640d865f096b4bb980a60c
          path: control
          persist-credentials: false
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the public umbrella 536f048a
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HS7097/ActingCommand
          ref: 536f048a3cac26ddbb0391895391f98967704cb0
          path: umbrella
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Merge-base and scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mergeBase = (& git -C head merge-base origin/main HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "git merge-base failed with exit code $LASTEXITCODE" }
          Write-Host "SCOPE head $((& git -C head rev-parse HEAD).Trim()) merge-base $mergeBase control $env:CONTROL_SHA umbrella $((& git -C umbrella rev-parse HEAD).Trim())"
          if ($mergeBase -ne $env:CONTROL_SHA) { throw "merge-base moved: $mergeBase" }
          $contract = & git -C head diff --stat $env:CONTROL_SHA HEAD -- crates/actingcommand-contract
          Write-Host "SCOPE actingcommand-contract diff lines against the merge-base: $(@($contract | Where-Object { $_ }).Count)"
          & git -C head diff --stat $env:CONTROL_SHA HEAD -- . ':(exclude)one-off-288a4' ':(exclude).github/workflows/oneoff-288a4.yml' | ForEach-Object { Write-Host "SCOPE product $_" }
      - name: Inputs (umbrella BA bundle, content directories, Git source repository)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python head/one-off-288a4/prepare.py umbrella (Join-Path $env:RUNNER_TEMP 'a4')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Head harness (a)-(c)
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path 'head/crates/pack-containment/examples' | Out-Null
          Copy-Item -LiteralPath 'head/one-off-288a4/harness.rs' -Destination 'head/crates/pack-containment/examples/oneoff_288a4.rs'
          Push-Location head
          & cargo run --locked -p actingcommand-pack-containment --example oneoff_288a4 -- (Join-Path $env:RUNNER_TEMP 'a4') head | Tee-Object -FilePath ../head.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "head harness failed with exit code $code" }
      - name: Control harness (a)-(c)
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host "control at $((& git -C control rev-parse HEAD).Trim())"
          New-Item -ItemType Directory -Force -Path 'control/crates/pack-containment/examples' | Out-Null
          Copy-Item -LiteralPath 'head/one-off-288a4/harness.rs' -Destination 'control/crates/pack-containment/examples/oneoff_288a4.rs'
          Push-Location control
          & cargo run --locked -p actingcommand-pack-containment --example oneoff_288a4 -- (Join-Path $env:RUNNER_TEMP 'a4') control | Tee-Object -FilePath ../control.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "control harness failed with exit code $code" }
      - name: actinglab CLI (b) observe and (d) capabilities on both builds
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($label in @('control', 'head')) {
            Push-Location $label
            & cargo build --locked -p actingcommand-actinglab --bin actinglab
            $build = $LASTEXITCODE
            Pop-Location
            if ($build -ne 0) { throw "actinglab build on $label failed with exit code $build" }
            $exe = (Resolve-Path -LiteralPath (Join-Path $label 'target/debug/actinglab.exe')).Path
            & python head/one-off-288a4/cli.py $label $exe (Join-Path $env:RUNNER_TEMP 'a4') | Tee-Object -FilePath "$label-cli.log"
            if ($LASTEXITCODE -ne 0) { throw "cli evidence on $label failed with exit code $LASTEXITCODE" }
          }
      - name: Compare control and head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python head/one-off-288a4/compare.py control.log head.log control-cli.log head-cli.log
          if ($LASTEXITCODE -ne 0) { throw "comparison failed with exit code $LASTEXITCODE" }
