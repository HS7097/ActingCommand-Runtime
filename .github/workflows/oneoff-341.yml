name: one-off 341 dry-run (to be reverted)

# One-off evidence for Workflow #341 (frozen model, board comment 5962396625, section 6, E1-E6).
# The new binaries are the Windows exact-SHA build artifacts of the product commit; the old
# binaries are the v0.9.1 Release assets of this repository, verified against SHA256SUMS. The
# fixture actingd uses the fixture backend only. Reverted right after its run; the PR's final diff
# contains neither this file nor one-off-341/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  dryrun:
    name: 341 dry-run evidence
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: 43992398bb372c7c60c030a7f94d0afb713fc2dc
      OLD_TAG: v0.9.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "DRY|SCOPE|head $head product $env:PRODUCT_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-341' ':(exclude).github/workflows/oneoff-341.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          Write-Host "DRY|SCOPE|the head tree equals the product commit outside the one-off files"
      - name: Inputs (product exact-SHA artifacts, v0.9.1 Release assets)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "DRY|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified against BUILD-MANIFEST.json"
          }
          $root = $env:RUNNER_TEMP
          $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $env:PRODUCT_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $env:PRODUCT_SHA" }
          Write-Host "DRY|INPUT|exact-SHA build run $runId for $env:PRODUCT_SHA"
          foreach ($kind in @('runtime', 'tools')) {
            & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$env:PRODUCT_SHA" -D (Join-Path $root "new/$kind")
            if ($LASTEXITCODE -ne 0) { throw "$kind artifact download failed with exit code $LASTEXITCODE" }
            Test-Manifest (Join-Path $root "new/$kind") $env:PRODUCT_SHA
          }
          $release = Join-Path $root 'old-release'
          & gh release download $env:OLD_TAG -R $env:GITHUB_REPOSITORY -D $release -p 'actingcommand-runtime-*.zip' -p 'actingcommand-tools-*.zip' -p 'SHA256SUMS'
          if ($LASTEXITCODE -ne 0) { throw "release download failed with exit code $LASTEXITCODE" }
          $sums = Get-Content -LiteralPath (Join-Path $release 'SHA256SUMS')
          foreach ($zip in Get-ChildItem -LiteralPath $release -Filter '*.zip') {
            $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($zip.Name))$" })
            $actual = Get-Sha $zip.FullName
            if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$($zip.Name) does not match SHA256SUMS" }
            Write-Host "DRY|INPUT|$env:OLD_TAG $($zip.Name) sha256 $actual matches SHA256SUMS"
            $kind = if ($zip.Name -like 'actingcommand-runtime-*') { 'runtime' } else { 'tools' }
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath (Join-Path $root "old-expanded/$kind")
          }
          $oldLab = Get-ChildItem -LiteralPath (Join-Path $root 'old-expanded/tools') -Recurse -Filter 'actinglab.exe' | Select-Object -First 1
          $oldActingd = Get-ChildItem -LiteralPath (Join-Path $root 'old-expanded/runtime') -Recurse -Filter 'actingcommand-actingd.exe' | Select-Object -First 1
          if (-not $oldLab -or -not $oldActingd) { throw "v0.9.1 assets lack actinglab.exe or actingcommand-actingd.exe" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "OLD_TOOLS=$($oldLab.DirectoryName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "OLD_RUNTIME=$($oldActingd.DirectoryName)"
          Write-Host "DRY|INPUT|v0.9.1 tools $($oldLab.DirectoryName) runtime $($oldActingd.DirectoryName)"
      - name: Evidence (E1-E6)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-341/evidence.py (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') $env:OLD_RUNTIME $env:OLD_TOOLS (Resolve-Path head).Path $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
