name: one-off 336 L2c (to be reverted)

# One-off evidence for Workflow #336 L2c (R16 amendment 5955585460 "L2c" items 1-10 and the R24
# amendment 5958084341 "L2c additions" items 1-2). The new binaries are the Windows exact-SHA
# build artifacts of the product commit, the base ones those of the L2b tip it is stacked on
# (3c009797, PR #597), and the old ones the Runtime v0.9.0 release assets (885947c9). Fixture runs
# use small hand-written 64x36 packages on the fixture backend (scheduled dispatches); the direct
# path and its replay run in process on the runtime-host fake physical provider. Reverted right
# after its run; the PR's final diff contains neither this file nor one-off-336l2c/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l2c:
    name: L2c return-home fallback evidence
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PRODUCT_SHA: d2166170934b465660be96aa5dbef0a2c50778b8
      BASE_SHA: 3c009797cd35881245d18844769ac02139b5c022
      OLD_SHA: 885947c90dd6561d6e5c9b7bae3fe736ec36f7c8
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L2C|SCOPE|head $head product $env:PRODUCT_SHA base $env:BASE_SHA old $env:OLD_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l2c' ':(exclude).github/workflows/oneoff-336l2c.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the base $env:BASE_SHA is not an ancestor of $env:PRODUCT_SHA" }
          & git -C head diff --stat $env:BASE_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L2C|SCOPE|product $_" }
      - name: Inputs (v0.9.0 release, base and product exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Repository, [string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$Repository/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Repository $Tag $name does not match SHA256SUMS" }
              Write-Host "L2C|INPUT|$Repository $Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L2C|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          function Get-Build([string] $Sha, [string] $Dir, [string[]] $Kinds) {
            $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $Sha --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $Sha" }
            Write-Host "L2C|INPUT|exact-SHA build run $runId for $Sha"
            foreach ($kind in $Kinds) {
              & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$Sha" -D (Join-Path $Dir $kind)
              if ($LASTEXITCODE -ne 0) { throw "$kind artifact download for $Sha failed with exit code $LASTEXITCODE" }
              Test-Manifest (Join-Path $Dir $kind) $Sha
            }
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'HS7097/ActingCommand-Runtime' 'v0.9.0' @("actingcommand-runtime-$env:OLD_SHA.zip", "actingcommand-tools-$env:OLD_SHA.zip") (Join-Path $root 'old-release')
          Expand-Archive -LiteralPath (Join-Path $root "old-release/actingcommand-runtime-$env:OLD_SHA.zip") -DestinationPath (Join-Path $root 'old/runtime')
          Expand-Archive -LiteralPath (Join-Path $root "old-release/actingcommand-tools-$env:OLD_SHA.zip") -DestinationPath (Join-Path $root 'old/tools')
          Test-Manifest (Join-Path $root 'old/runtime') $env:OLD_SHA
          Test-Manifest (Join-Path $root 'old/tools') $env:OLD_SHA
          Get-Build $env:BASE_SHA (Join-Path $root 'base') @('runtime')
          Get-Build $env:PRODUCT_SHA (Join-Path $root 'new') @('runtime', 'tools')
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Static (zero change outside the slice)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l2c/evidence.py static head $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "static failed with exit code $LASTEXITCODE" }
      - name: Prepare packages and frames
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l2c/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Direct path on the fake physical provider, and the existing home entry (product)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'head/one-off-336l2c/host_l2c.rs' -Destination 'head/crates/runtime-host/src/tests/oneoff_336l2c.rs'
          Get-Content -Raw -LiteralPath 'head/one-off-336l2c/host_same.rs', 'head/one-off-336l2c/same_config_product.rs' | Set-Content -NoNewline -LiteralPath 'head/crates/runtime-host/src/tests/oneoff_336l2c_same.rs'
          Add-Content -LiteralPath 'head/crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_336l2c;`nmod oneoff_336l2c_same;"
          Push-Location head
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_336l2c -- --nocapture --test-threads=1 > (Join-Path $env:RUNNER_TEMP 'host-product.log')
          $code = $LASTEXITCODE
          Pop-Location
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'host-product.log') | ForEach-Object {
            $line = $_
            if ($line.Length -gt 1500) { $line = $line.Substring(0, 1500) + '...' }
            if ($line -match 'HOST\|' -or $line -match '^test |test result|panicked|SAME\|.*\|counts\|') { Write-Host $line }
          }
          if ($code -ne 0) { throw "product in-process runs failed with exit code $code" }
      - name: The existing home entry on the L2b tip 3c009797
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $source = Join-Path $env:RUNNER_TEMP 'base-source'
          & git -C head worktree add --detach $source $env:BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "worktree add failed with exit code $LASTEXITCODE" }
          Write-Host "L2C|BASE|source $((& git -C $source rev-parse HEAD).Trim())"
          Get-Content -Raw -LiteralPath 'head/one-off-336l2c/host_same.rs', 'head/one-off-336l2c/same_config_base.rs' | Set-Content -NoNewline -LiteralPath (Join-Path $source 'crates/runtime-host/src/tests/oneoff_336l2c_same.rs')
          Add-Content -LiteralPath (Join-Path $source 'crates/runtime-host/src/tests.rs') -Value "`nmod oneoff_336l2c_same;"
          $env:CARGO_TARGET_DIR = (Join-Path (Resolve-Path head).Path 'target')
          Push-Location $source
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_336l2c_same -- --nocapture --test-threads=1 > (Join-Path $env:RUNNER_TEMP 'host-base.log')
          $code = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'host-base.log') | Where-Object { $_ -match '^test |test result|panicked|\|counts\|' } | ForEach-Object { Write-Host $_.Substring(0, [Math]::Min($_.Length, 600)) }
          Pop-Location
          if ($code -ne 0) { throw "3c009797 in-process runs failed with exit code $code" }
          & python head/one-off-336l2c/evidence.py same (Join-Path $env:RUNNER_TEMP 'host-product.log') (Join-Path $env:RUNNER_TEMP 'host-base.log')
          if ($LASTEXITCODE -ne 0) { throw "same-facts comparison failed with exit code $LASTEXITCODE" }
      - name: Fixture runs and ledgers
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-336l2c/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'base/runtime') (Join-Path $root 'old/runtime') (Join-Path $root 'old/tools') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
