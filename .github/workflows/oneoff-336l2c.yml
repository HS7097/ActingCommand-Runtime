name: one-off 336 L2c fix round (to be reverted)

# One-off evidence for the Workflow #336 L2c fix round (coordinator, PR #600): a scheduled
# linear_steps failure with a kernel detail on the fixture backend; the runtime.failed lifecycle
# record that carries the detail has the severity of the task terminal it names. The binaries are
# the Windows exact-SHA build artifacts of the product commit. Reverted right after its run; the
# PR's final diff contains neither this file nor one-off-336l2c/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l2c-fix:
    name: L2c fix round evidence
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRODUCT_SHA: 4e9baee76578b25470235b2dd4e926221b9193b0
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L2C|SCOPE|head $head product $env:PRODUCT_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l2c' ':(exclude).github/workflows/oneoff-336l2c.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head diff --stat 3aed70d7 $env:PRODUCT_SHA | ForEach-Object { Write-Host "L2C|SCOPE|fix round $_" }
      - name: Inputs (product exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L2C|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $env:PRODUCT_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $env:PRODUCT_SHA" }
          Write-Host "L2C|INPUT|exact-SHA build run $runId for $env:PRODUCT_SHA"
          foreach ($kind in @('runtime', 'tools')) {
            $dir = Join-Path $env:RUNNER_TEMP "new/$kind"
            & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$env:PRODUCT_SHA" -D $dir
            if ($LASTEXITCODE -ne 0) { throw "$kind artifact download failed with exit code $LASTEXITCODE" }
            Test-Manifest $dir $env:PRODUCT_SHA
          }
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Prepare packages and frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l2c/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Scheduled linear failure with a detail
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-336l2c/evidence.py fix (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "fix evidence failed with exit code $LASTEXITCODE" }
