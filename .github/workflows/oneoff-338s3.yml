name: one-off 338 S3 fix round evidence (to be reverted)

# One-off evidence for the Workflow #338 S3 review fix round on the product commit, with the
# actingctl.exe, actinglab.exe and actingcommand-actingd.exe of its Windows exact-SHA build: the
# overflow rule (an observe answer and an error over the budget, a record stop keeping its
# binding parts inline), ac_binding_draft from record_stop_export with the sha256 and place
# checks, check_config with report_export, an already_generated stop without binding_requires,
# and the S3 evidence again; then the S1 scripted client, the S2 runs and the S2 host fixture
# catalog as regressions. Sources live in one-off-338s3/ and are put in place only inside this
# job. Reverted right after its run; the PR's final diff contains neither this file nor
# one-off-338s3/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  s3:
    name: S3 fix round evidence on the exact-SHA build
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PRODUCT_SHA: 24b752b7dee1dd6b7b832a89703f260e21239fcc
      BUILD_RUN_ID: "37260586003"
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope (product files equal the product commit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          Write-Host "S3|SCOPE|head $head product $env:PRODUCT_SHA"
          $diff = @(& git diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-338s3' ':(exclude).github/workflows/oneoff-338s3.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
      - name: Download the exact-SHA build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($kind in @('runtime', 'tools')) {
            $dir = Join-Path $env:RUNNER_TEMP "s3-$kind"
            & gh run download $env:BUILD_RUN_ID -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$env:PRODUCT_SHA" -D $dir
            if ($LASTEXITCODE -ne 0) { throw "$kind artifact download failed with exit code $LASTEXITCODE" }
            $manifest = Get-Content -LiteralPath (Join-Path $dir 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json
            if ($manifest.commit_sha -ne $env:PRODUCT_SHA) { throw "$kind build is of $($manifest.commit_sha)" }
            $names = if ($kind -eq 'runtime') { @('actingctl.exe', 'actingcommand-actingd.exe', 'actingd.config.example.json') } else { @('actinglab.exe') }
            foreach ($name in $names) {
              $listed = $manifest.files | Where-Object { $_.path -eq $name }
              $hash = (Get-FileHash -LiteralPath (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "S3|BUILD|run $env:BUILD_RUN_ID commit_sha $($manifest.commit_sha) $name $hash manifest $($listed.sha256)"
              if ($hash -ne $listed.sha256) { throw "$name does not match its manifest" }
            }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_ACTINGCTL=$(Join-Path $env:RUNNER_TEMP 's3-runtime\actingctl.exe')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_ACTINGD=$(Join-Path $env:RUNNER_TEMP 's3-runtime\actingcommand-actingd.exe')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_ACTINGD_CONFIG=$(Join-Path $env:RUNNER_TEMP 's3-runtime\actingd.config.example.json')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_ACTINGLAB=$(Join-Path $env:RUNNER_TEMP 's3-tools\actinglab.exe')"
      - name: S3 evidence and fix round
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $source = (Get-Content -LiteralPath 'apps/actinglab/tests/runtime_input_proxy.rs' -Raw) + (Get-Content -LiteralPath 'one-off-338s3/lab_s3.rs' -Raw)
          [IO.File]::WriteAllText((Join-Path $PWD 'apps/actinglab/tests/oneoff_338s3.rs'), $source, [Text.UTF8Encoding]::new($false))
          $log = Join-Path $env:RUNNER_TEMP 's3.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actinglab --test oneoff_338s3 oneoff_338s3:: -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S3\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "S3 evidence failed with exit code $code"
          }
      - name: S2 runs regression
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s3/runs_s2.rs' -Destination 'apps/actingctl/tests/oneoff_338s2.rs'
          $env:ONEOFF_LABEL = 'fixed'
          $env:ONEOFF_EXPECT_FREED = '1'
          $log = Join-Path $env:RUNNER_TEMP 's2.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338s2 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2C?\|(RUN_PACK|STOP\|fresh|RESTART|PROVENANCE)|S2C\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "S2 regression failed with exit code $code"
          }
      - name: S1 scripted-client regression
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s3/mcp_client.rs' -Destination 'apps/actingctl/tests/oneoff_338s1.rs'
          $log = Join-Path $env:RUNNER_TEMP 's1.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338s1 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S1\|.*(TIMING|exit |client.action|tools/list)|^test |test result|panicked' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "S1 regression failed with exit code $code"
          }
      - name: S2 host fixture catalog regression
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s3/host_s2.rs' -Destination 'crates/runtime-host/src/tests/oneoff_338s2.rs'
          Add-Content -LiteralPath 'crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_338s2;"
          $log = Join-Path $env:RUNNER_TEMP 'host.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_338s2 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2H\|(CARD|PAUSE\||CLEAR)|^test |test result|panicked' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "host regression failed with exit code $code"
          }
