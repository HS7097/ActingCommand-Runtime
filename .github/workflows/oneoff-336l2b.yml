name: one-off 336 L2b fix round (to be reverted)

# One-off evidence for the Workflow #336 L2b review fix: a capture or recognition failure of the
# layer-0 recheck, after the prerequisite package ran and closed, ends with the gate's FailClosed.
# Scheduled fixture dispatches on the product build and on the reviewed head cb9b31aa; the
# v0.9.0 actingledger reads the product ledgers. Reverted right after its run; the PR's final
# diff contains neither this file nor one-off-336l2b/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l2b-fix:
    name: L2b fix round recheck evidence
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRODUCT_SHA: cd1354a9494b43886937df30efa1f3423740b66b
      REVIEWED_SHA: cb9b31aa24f2ce260c13789838dd6f457795d41f
      OLD_SHA: 885947c90dd6561d6e5c9b7bae3fe736ec36f7c8
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L2B|SCOPE|head $head product $env:PRODUCT_SHA reviewed $env:REVIEWED_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l2b' ':(exclude).github/workflows/oneoff-336l2b.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head diff --stat $env:REVIEWED_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L2B|SCOPE|fix $_" }
          & git -C head diff $env:REVIEWED_SHA $env:PRODUCT_SHA -- crates | ForEach-Object { Write-Host "L2B|SCOPE|fix diff $_" }
      - name: Inputs (v0.9.0 tools, reviewed and product exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L2B|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          function Get-Build([string] $Sha, [string] $Dir, [string[]] $Kinds) {
            $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $Sha --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $Sha" }
            Write-Host "L2B|INPUT|exact-SHA build run $runId for $Sha"
            foreach ($kind in $Kinds) {
              & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$Sha" -D (Join-Path $Dir $kind)
              if ($LASTEXITCODE -ne 0) { throw "$kind artifact download for $Sha failed with exit code $LASTEXITCODE" }
              Test-Manifest (Join-Path $Dir $kind) $Sha
            }
          }
          $root = $env:RUNNER_TEMP
          $dir = Join-Path $root 'old-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name = "actingcommand-tools-$env:OLD_SHA.zip"
          foreach ($file in @($name, 'SHA256SUMS')) {
            Invoke-WebRequest -Uri "https://github.com/HS7097/ActingCommand-Runtime/releases/download/v0.9.0/$file" -OutFile (Join-Path $dir $file)
          }
          $line = @(Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
          $actual = Get-Sha (Join-Path $dir $name)
          if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "v0.9.0 $name does not match SHA256SUMS" }
          Write-Host "L2B|INPUT|v0.9.0 $name sha256 $actual matches SHA256SUMS"
          Expand-Archive -LiteralPath (Join-Path $dir $name) -DestinationPath (Join-Path $root 'old/tools')
          Test-Manifest (Join-Path $root 'old/tools') $env:OLD_SHA
          Get-Build $env:REVIEWED_SHA (Join-Path $root 'reviewed') @('runtime')
          Get-Build $env:PRODUCT_SHA (Join-Path $root 'new') @('runtime', 'tools')
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Prepare packages and frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l2b/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Layer-0 recheck failures on fixture
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-336l2b/evidence.py recheck (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'reviewed/runtime') (Join-Path $root 'old/tools') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "recheck evidence failed with exit code $LASTEXITCODE" }
