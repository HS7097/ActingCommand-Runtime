name: one-off 336 L3 (to be reverted)

# One-off evidence for Workflow #336 L3 (frozen model section 8 L3 items 1-5 and the R16-R20
# amendment "L3 增项" items 1-6). The new binaries are the Windows exact-SHA build artifacts of
# the product commit; the old actinglab is the Runtime v0.9.0 release (885947c9). The Blue
# Archive assets come from the battle_auto_enable pack of the public umbrella v0.9.0 standard
# package (BA@193cfdd; the BA repository itself is private) and are only pasted into synthetic
# frames. Reverted right after its run; the PR's final diff contains neither this file nor
# one-off-336l3/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l3:
    name: L3 recording evidence
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: 439cbc00edfbd93d7ae7ee13ce6c944a267c48a2
      BASE_SHA: 07c92c48b30ece10255f30ca4098c84970fb75bf
      OLD_SHA: 885947c90dd6561d6e5c9b7bae3fe736ec36f7c8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L3|SCOPE|head $head product $env:PRODUCT_SHA base $env:BASE_SHA old $env:OLD_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l3' ':(exclude).github/workflows/oneoff-336l3.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head diff --stat $env:BASE_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L3|SCOPE|product $_" }
      - name: Inputs (v0.9.0 release, umbrella BA standard package, exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Repository, [string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$Repository/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Repository $Tag $name does not match SHA256SUMS" }
              Write-Host "L3|INPUT|$Repository $Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L3|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'HS7097/ActingCommand-Runtime' 'v0.9.0' @("actingcommand-tools-$env:OLD_SHA.zip") (Join-Path $root 'old-release')
          Expand-Archive -LiteralPath (Join-Path $root "old-release/actingcommand-tools-$env:OLD_SHA.zip") -DestinationPath (Join-Path $root 'old/tools')
          Test-Manifest (Join-Path $root 'old/tools') $env:OLD_SHA
          Get-Release 'HS7097/ActingCommand' 'v0.9.0' @('bluearchive-resources-193cfdd.zip') (Join-Path $root 'umbrella')
          $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $env:PRODUCT_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $env:PRODUCT_SHA" }
          Write-Host "L3|INPUT|exact-SHA build run $runId for $env:PRODUCT_SHA"
          & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-runtime-$env:PRODUCT_SHA" -D (Join-Path $root 'new/runtime')
          if ($LASTEXITCODE -ne 0) { throw "runtime artifact download failed with exit code $LASTEXITCODE" }
          & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-tools-$env:PRODUCT_SHA" -D (Join-Path $root 'new/tools')
          if ($LASTEXITCODE -ne 0) { throw "tools artifact download failed with exit code $LASTEXITCODE" }
          Test-Manifest (Join-Path $root 'new/runtime') $env:PRODUCT_SHA
          Test-Manifest (Join-Path $root 'new/tools') $env:PRODUCT_SHA
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Lock holder (one-off program calling RecordingLock::acquire)
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path 'head/crates/lab/examples' | Out-Null
          Copy-Item -LiteralPath 'head/one-off-336l3/lock_holder.rs' -Destination 'head/crates/lab/examples/oneoff_336l3_lock.rs'
          Push-Location head
          & cargo build --locked -p actingcommand-lab --example oneoff_336l3_lock
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "lock holder build failed with exit code $code" }
      - name: Prepare synthetic frames and the carrier package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l3/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work') (Join-Path $env:RUNNER_TEMP 'umbrella/bluearchive-resources-193cfdd.zip')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Evidence (items 1-5, lock 1-6)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          $holder = (Resolve-Path 'head/target/debug/examples/oneoff_336l3_lock.exe').Path
          & python head/one-off-336l3/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'old/tools') $holder $env:BASE_SHA $env:PRODUCT_SHA (Resolve-Path head).Path
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
