name: one-off 338 S2 (to be reverted)

# One-off evidence for Workflow #338 slice S2 (frozen model 5978610792, section six, row S2): the
# actingctl.exe of the product commit's Windows exact-SHA build, driven by a scripted MCP client,
# (a) on the runtime-host fixture catalog with a governance policy refusing its card (R5 tools,
# targets set and cleared, pause / resume revisions and epochs, provenance), and (b) on the
# fixture runtime tests/support/c4_runtime.rs (ac_run_pack to a terminal run, tier refusal,
# provenance in one correlation, ac_stop_run from a fresh process, a Runtime killed mid-run).
# The sources live in one-off-338s2/ and are copied into place only inside this job. Reverted
# right after its run; the PR's final diff contains neither this file nor one-off-338s2/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  s2:
    name: S2 operator tools on the exact-SHA build
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: ec032d3ceac8c955b7b291491752c755bb15d955
      BUILD_RUN_ID: 37219220662
      S1_TIP: a12f76c345a1eacaf4eee875dba2dc779a033558
      RB_TIP: 3e78e1b1e2324728b02a276c3f5d03e03cb189fb
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope (product files equal the product commit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          Write-Host "S2|SCOPE|head $head product $env:PRODUCT_SHA s1 $env:S1_TIP rb $env:RB_TIP"
          $diff = @(& git diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-338s2' ':(exclude).github/workflows/oneoff-338s2.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          foreach ($ancestor in @($env:S1_TIP, $env:RB_TIP)) {
            & git merge-base --is-ancestor $ancestor $env:PRODUCT_SHA
            if ($LASTEXITCODE -ne 0) { throw "$ancestor is not an ancestor of $env:PRODUCT_SHA" }
          }
          $lock = @(& git diff --name-only $env:S1_TIP $env:PRODUCT_SHA -- Cargo.lock '*Cargo.toml' | Where-Object { $_ })
          Write-Host "S2|SCOPE|Cargo.lock / Cargo.toml changed from S1: $($lock -join ', ')"
          $s2 = @(& git diff --name-only "$env:PRODUCT_SHA^{/Merge slice Rb}" $env:PRODUCT_SHA | Where-Object { $_ })
          Write-Host "S2|SCOPE|files changed by S2 after the Rb merge: $($s2 -join ', ')"
      - name: Download the product commit's exact-SHA build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:RUNNER_TEMP 's2-build'
          & gh run download $env:BUILD_RUN_ID -R $env:GITHUB_REPOSITORY -n "actingcommand-runtime-$env:PRODUCT_SHA" -D $dir
          if ($LASTEXITCODE -ne 0) { throw "artifact download failed with exit code $LASTEXITCODE" }
          $manifest = Get-Content -LiteralPath (Join-Path $dir 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json
          Write-Host "S2|BUILD|run $env:BUILD_RUN_ID manifest commit_sha $($manifest.commit_sha)"
          if ($manifest.commit_sha -ne $env:PRODUCT_SHA) { throw "the artifact was built from $($manifest.commit_sha)" }
          $path = Join-Path $dir 'actingctl.exe'
          $listed = $manifest.files | Where-Object { $_.path -eq 'actingctl.exe' }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "S2|BUILD|actingctl.exe sha256 $hash manifest $($listed.sha256)"
          if ($hash -ne $listed.sha256) { throw "actingctl.exe does not match BUILD-MANIFEST.json" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_ACTINGCTL=$path"
      - name: Host fixture catalog - R5 tools, targets, card warning, pause and resume
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s2/host_s2.rs' -Destination 'crates/runtime-host/src/tests/oneoff_338s2.rs'
          Add-Content -LiteralPath 'crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_338s2;"
          $log = Join-Path $env:RUNNER_TEMP 'host.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_338s2 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2H\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "host evidence failed with exit code $code"
          }
      - name: Fixture runtime - runs, stop, restart
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s2/runs_s2.rs' -Destination 'apps/actingctl/tests/oneoff_338s2.rs'
          $log = Join-Path $env:RUNNER_TEMP 'runs.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338s2 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "fixture runtime evidence failed with exit code $code"
          }
