name: one-off 338 S2 review fixes (to be reverted)

# One-off evidence for the Workflow #338 S2 review fix round (F1: job waits stop on
# notifications/cancelled) on the product commit, with the actingctl.exe of its Windows exact-SHA
# build: four cancelled ac_get_run waits on a draining pause job free their workers, so an
# ac_overview sent right after is answered at once (also timed on the build before the fix for
# contrast); then the S2 and S1 scripted-client regressions and the host fixture-catalog run.
# The sources live in one-off-338s2/ and are copied into place only inside this job. Reverted
# right after its run; the PR's final diff contains neither this file nor one-off-338s2/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  s2:
    name: S2 review fixes on the exact-SHA build
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: 7e0c36590ce481ee0a757b778d252e95133cf7c4
      BUILD_RUN_ID: 37240179467
      BEFORE_SHA: 77bc9941e7332dcef6148dbb92227f33a849bfae
      BEFORE_BUILD_RUN_ID: 37222512013
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope (product files equal the product commit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          Write-Host "S2|SCOPE|head $head product $env:PRODUCT_SHA before $env:BEFORE_SHA"
          $diff = @(& git diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-338s2' ':(exclude).github/workflows/oneoff-338s2.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          $changed = @(& git diff --name-only $env:BEFORE_SHA $env:PRODUCT_SHA | Where-Object { $_ })
          Write-Host "S2|SCOPE|files changed by the fix round: $($changed -join ', ')"
      - name: Download the exact-SHA builds (fixed and before)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($build in @(@('fixed', $env:BUILD_RUN_ID, $env:PRODUCT_SHA), @('before', $env:BEFORE_BUILD_RUN_ID, $env:BEFORE_SHA))) {
            $dir = Join-Path $env:RUNNER_TEMP "s2-$($build[0])"
            & gh run download $build[1] -R $env:GITHUB_REPOSITORY -n "actingcommand-runtime-$($build[2])" -D $dir
            if ($LASTEXITCODE -ne 0) { throw "artifact download failed with exit code $LASTEXITCODE" }
            $manifest = Get-Content -LiteralPath (Join-Path $dir 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json
            $path = Join-Path $dir 'actingctl.exe'
            $listed = $manifest.files | Where-Object { $_.path -eq 'actingctl.exe' }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "S2|BUILD|$($build[0]) run $($build[1]) commit_sha $($manifest.commit_sha) actingctl.exe $hash manifest $($listed.sha256)"
            if ($manifest.commit_sha -ne $build[2] -or $hash -ne $listed.sha256) { throw "$($build[0]) build does not match" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_FIXED=$(Join-Path $env:RUNNER_TEMP 's2-fixed\actingctl.exe')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONEOFF_BEFORE=$(Join-Path $env:RUNNER_TEMP 's2-before\actingctl.exe')"
      - name: F1 and the S2 regression on the fixed build
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s2/runs_s2.rs' -Destination 'apps/actingctl/tests/oneoff_338s2.rs'
          $env:ONEOFF_ACTINGCTL = $env:ONEOFF_FIXED
          $env:ONEOFF_LABEL = 'fixed'
          $env:ONEOFF_EXPECT_FREED = '1'
          $log = Join-Path $env:RUNNER_TEMP 'fixed.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338s2 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2C?\|(SCOPE|BUILD|RUN_PACK|STOP\|fresh|RESTART|PROVENANCE)|S2C\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "fixed-build evidence failed with exit code $code"
          }
      - name: F1 contrast on the build before the fix (timing only)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:ONEOFF_ACTINGCTL = $env:ONEOFF_BEFORE
          $env:ONEOFF_LABEL = 'before'
          $log = Join-Path $env:RUNNER_TEMP 'before.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338s2 oneoff_338s2_cancelled_waits_free_workers -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2C\||^test |test result|panicked' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "before-build contrast failed with exit code $code"
          }
      - name: S1 scripted-client regression on the fixed build
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s2/mcp_client.rs' -Destination 'apps/actingctl/tests/oneoff_338s1.rs'
          $env:ONEOFF_ACTINGCTL = $env:ONEOFF_FIXED
          $log = Join-Path $env:RUNNER_TEMP 's1.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338s1 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S1\|.*(TIMING|exit |client.action)|^test |test result|panicked' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "S1 regression failed with exit code $code"
          }
      - name: Host fixture catalog regression on the fixed build
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338s2/host_s2.rs' -Destination 'crates/runtime-host/src/tests/oneoff_338s2.rs'
          Add-Content -LiteralPath 'crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_338s2;"
          $env:ONEOFF_ACTINGCTL = $env:ONEOFF_FIXED
          $log = Join-Path $env:RUNNER_TEMP 'host.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_338s2 -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'S2H\|(CARD|PAUSE\||CLEAR)|^test |test result|panicked' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "host regression failed with exit code $code"
          }
