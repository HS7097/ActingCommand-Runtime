name: one-off 338 Ra (to be reverted)

# One-off evidence for Workflow #338 slice Ra (frozen model 5978610792, section six, row Ra):
# R6 disposition of all 34 RuntimeErrorCode variants and the uncertain cases (runtime-client unit
# test), and R1/R2 on the fixture runtime tests/support/c4_runtime.rs (a manual run that
# succeeds, prepare/submit against run_contained_task, a run cancelled and reset from another
# connection, a run whose Runtime child is killed). The test sources live in one-off-338ra/ and are
# copied into place only inside this job. Reverted right after its run; the PR's final diff
# contains neither this file nor one-off-338ra/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ra:
    name: Ra run status, prepare/submit, cancel+reset and disposition evidence
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PRODUCT_SHA: 33385c80c1e578b30991e138b4788d8145ff20f1
      BASE_SHA: a9a1845dcd12c5f179e7630d1585517ce11c6815
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope (product files equal the product commit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          Write-Host "RA|SCOPE|head $head product $env:PRODUCT_SHA base $env:BASE_SHA"
          $diff = @(& git diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-338ra' ':(exclude).github/workflows/oneoff-338ra.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git merge-base --is-ancestor $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the base $env:BASE_SHA is not an ancestor of $env:PRODUCT_SHA" }
          $changed = @(& git diff --name-only $env:BASE_SHA $env:PRODUCT_SHA | Where-Object { $_ })
          Write-Host "RA|SCOPE|product files changed from base: $($changed -join ', ')"
          $manifests = @($changed | Where-Object { $_ -like '*Cargo.toml' -or $_ -eq 'Cargo.lock' })
          Write-Host "RA|SCOPE|Cargo.lock and Cargo.toml files changed: $($manifests.Count)"
          if ($manifests.Count -ne 0) { throw "manifests changed: $($manifests -join ', ')" }
      - name: R6 disposition (all 34 RuntimeErrorCode variants and the uncertain cases)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338ra/disposition.rs' -Destination 'crates/runtime-client/src/oneoff_338ra.rs'
          Add-Content -LiteralPath 'crates/runtime-client/src/lib.rs' -Value "`n#[cfg(test)]`nmod oneoff_338ra;"
          $log = Join-Path $env:RUNNER_TEMP 'disposition.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-runtime-client --lib oneoff_338ra -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'RA\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "disposition tests failed with exit code $code"
          }
      - name: R1 and R2 on the fixture runtime
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338ra/fixture.rs' -Destination 'apps/actingctl/tests/oneoff_338ra.rs'
          $log = Join-Path $env:RUNNER_TEMP 'fixture.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-actingctl --test oneoff_338ra -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'RA\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 300 | ForEach-Object { Write-Host $_ }
            throw "fixture evidence failed with exit code $code"
          }
