name: one-off 376 red proof (to be reverted)

# Workflow #376: runs only the new process test on 484bdc14 (no fix) with the CI process-test
# profile. Exists only in a one-off commit that is reverted.
on:
  push:
    branches: [claude/0114-r376]

jobs:
  t1:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - name: Rust cache (restore only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-trybuild-clean-v1-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-trybuild-clean-v1-${{ steps.toolchain.outputs.cachekey }}-
      - name: T1 alone
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          git log -1 --format='HEAD %H parent %P'
          cargo --config 'profile.test.opt-level=3' --config 'profile.test.debug-assertions=true' --config 'profile.test.overflow-checks=true' --config 'profile.test.debug=2' test --locked -p actingcommand-actingd --test process actingd_waits_through_an_install_drain_and_exits_cleanly_on_commit -- --exact --test-threads=1 --nocapture
          $code = $LASTEXITCODE
          Write-Host "T1 exit code: $code"
          exit $code
