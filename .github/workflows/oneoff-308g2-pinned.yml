name: one-off 308 G2 Clippy inventory on 1.99.0 (to be reverted)

# One-off evidence for Workflow #308 G2. Main a03ef172 fails the CI Clippy step on rustc 1.99.0
# (2026-09-28), outside this PR. This job lists every Clippy warning of the workspace on the
# current stable toolchain without denying it (the previous run's list was empty because cargo
# colored its output). Reverted right after its run.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clippy-1-99-inventory:
    name: clippy inventory on current stable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain in use
        run: |
          rustc -V
          cargo clippy -V
      - name: Clippy with warnings reported, not denied
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --keep-going --color never --message-format=short -- -W warnings > clippy.txt 2>&1
          code=$?
          echo "clippy exit code (warnings not denied): $code"
          grep -E '^(crates|apps|tools|providers|tests|benchmarks).*: (warning|error)' clippy.txt | sort -u > inventory.txt
          echo "INVENTORY count=$(wc -l < inventory.txt)"
          sed 's/^/INVENTORY /' inventory.txt
          echo "INVENTORY pack-containment source files: $(grep -cE 'pack-containment.src.source.(mod|declarations).rs' inventory.txt)"
          echo "clippy.txt lines=$(wc -l < clippy.txt) warning_or_error_lines=$(grep -cE ': (warning|error)' clippy.txt)"
          tail -n 15 clippy.txt | sed 's/^/TAIL /'
          exit $code
