name: one-off 339 L3c (to be reverted)

# One-off evidence for Workflow #339 L3c (frozen model, board comment 5959674074, section 6.4
# "L3c evidence"). The new binaries are the Windows exact-SHA build artifacts of the product
# commit; the L3b and L3 binaries are the Windows exact-SHA build artifacts of PR #594 at
# 7a45d625 (run 37065056504) and PR #589 at ef00cc8e (run 37048604656). Frames are synthetic
# 1280x720 screens with assets of a pack of the public umbrella v0.9.0 standard package pasted
# in. Reverted right after its run; the PR's final diff contains neither this file nor
# one-off-339l3c/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l3c:
    name: L3c optional step recording evidence
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: f90627db1fe083eea086080de42560d5567d3ad0
      L3B_SHA: 7a45d62519be33c253bb056fbfca2dab1273384d
      L3B_RUN: '37065056504'
      L3_SHA: ef00cc8ea02651ccd74bf5a59f55a3eaa728cda5
      L3_RUN: '37048604656'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L3C|SCOPE|head $head product $env:PRODUCT_SHA l3b $env:L3B_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-339l3c' ':(exclude).github/workflows/oneoff-339l3c.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:L3B_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "product $env:PRODUCT_SHA does not contain the L3b tip $env:L3B_SHA" }
          & git -C head diff --stat $env:L3B_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L3C|SCOPE|product $_" }
      - name: Inputs (umbrella standard package, product, L3b and L3 exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Repository, [string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$Repository/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Repository $Tag $name does not match SHA256SUMS" }
              Write-Host "L3C|INPUT|$Repository $Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L3C|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'HS7097/ActingCommand' 'v0.9.0' @('bluearchive-resources-193cfdd.zip') (Join-Path $root 'umbrella')
          $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $env:PRODUCT_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $env:PRODUCT_SHA" }
          Write-Host "L3C|INPUT|exact-SHA build run $runId for $env:PRODUCT_SHA"
          & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-tools-$env:PRODUCT_SHA" -D (Join-Path $root 'new/tools')
          if ($LASTEXITCODE -ne 0) { throw "product tools artifact download failed with exit code $LASTEXITCODE" }
          Test-Manifest (Join-Path $root 'new/tools') $env:PRODUCT_SHA
          foreach ($pair in @(@('l3b', $env:L3B_RUN, $env:L3B_SHA), @('l3', $env:L3_RUN, $env:L3_SHA))) {
            Write-Host "L3C|INPUT|$($pair[0]) exact-SHA build run $($pair[1]) for $($pair[2])"
            & gh run download $pair[1] -R $env:GITHUB_REPOSITORY -n "actingcommand-tools-$($pair[2])" -D (Join-Path $root "$($pair[0])/tools")
            if ($LASTEXITCODE -ne 0) { throw "$($pair[0]) tools artifact download failed with exit code $LASTEXITCODE" }
            Test-Manifest (Join-Path $root "$($pair[0])/tools") $pair[2]
          }
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Round-trip program (one-off, parses recording.json with this build's LabRecording)
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path 'head/crates/lab/examples' | Out-Null
          Copy-Item -LiteralPath 'head/one-off-339l3c/roundtrip.rs' -Destination 'head/crates/lab/examples/oneoff_339l3c_roundtrip.rs'
          Push-Location head
          & cargo build --locked -p actingcommand-lab --example oneoff_339l3c_roundtrip
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "round-trip program build failed with exit code $code" }
      - name: Prepare synthetic frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-339l3c/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work') (Join-Path $env:RUNNER_TEMP 'umbrella/bluearchive-resources-193cfdd.zip')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Evidence (L3c)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          $roundtrip = (Resolve-Path 'head/target/debug/examples/oneoff_339l3c_roundtrip.exe').Path
          & python head/one-off-339l3c/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/tools') (Join-Path $root 'l3b/tools') (Join-Path $root 'l3/tools') $roundtrip (Resolve-Path head).Path $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
