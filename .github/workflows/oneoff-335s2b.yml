name: one-off 335 S2b (to be reverted)

# One-off evidence for Workflow #335 S2b (model section 8, B1-B8). B1 runs one harness on the
# PR's exact merge-base 81b41d36 (control) and on the PR head in the same job and compares every
# B1 line; B2-B8 run on the PR head. Reverted right after its run; the PR's final diff does not
# contain this file or one-off-335s2b/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  b1:
    name: B1 control 81b41d36 vs head
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the control commit (merge-base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 81b41d363b5faf7244d037e3c5b716bad9ca4e4b
          path: control
          persist-credentials: false
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: B1 on both builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed with exit code $LASTEXITCODE" }
          $env:ONE_OFF_335S2B_DIR = (Resolve-Path -LiteralPath 'head/one-off-335s2b').Path
          foreach ($label in @('control', 'head')) {
            $sha = (& git -C $label rev-parse HEAD).Trim()
            Write-Host "B1 $label at $sha"
            Copy-Item -LiteralPath 'head/one-off-335s2b/b1_v1.rs' -Destination "$label/crates/policy/tests/one_off_335s2b_b1.rs"
            Push-Location $label
            & cargo test --locked -p actingcommand-policy --test one_off_335s2b_b1 -- --nocapture --test-threads=1 | Tee-Object -FilePath "../b1-$label.log"
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { throw "B1 harness on $label failed with exit code $code" }
          }
          $control = @(Get-Content -LiteralPath 'b1-control.log' | Where-Object { $_ -match '^B1' })
          $head = @(Get-Content -LiteralPath 'b1-head.log' | Where-Object { $_ -match '^B1' })
          Write-Host "B1 lines: control=$($control.Count) head=$($head.Count)"
          if ($control.Count -eq 0 -or $control.Count -ne $head.Count) { throw "B1 line counts differ or are empty" }
          $different = 0
          for ($index = 0; $index -lt $control.Count; $index++) {
            if ($control[$index] -ceq $head[$index]) {
              Write-Host "MATCH $($head[$index])"
            } else {
              $different++
              Write-Host "DIFF control: $($control[$index])"
              Write-Host "DIFF head:    $($head[$index])"
            }
          }
          if ($different -ne 0) { throw "$different B1 lines differ between control and head" }
          Write-Host "B1 all $($head.Count) lines equal between control 81b41d36 and head"

  head:
    name: B2-B8 head
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: B2-B7 policy checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed with exit code $LASTEXITCODE" }
          Write-Host "head at $((& git rev-parse HEAD).Trim())"
          $env:ONE_OFF_335S2B_DIR = (Resolve-Path -LiteralPath 'one-off-335s2b').Path
          Copy-Item -LiteralPath 'one-off-335s2b/b_head.rs' -Destination 'crates/policy/tests/one_off_335s2b_head.rs'
          & cargo test --locked -p actingcommand-policy --test one_off_335s2b_head -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "B2-B7 harness failed with exit code $LASTEXITCODE" }
      - name: B8 host path
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'one-off-335s2b/b8_host.rs' -Destination 'crates/runtime-host/src/tests/one_off_335s2b.rs'
          Add-Content -LiteralPath 'crates/runtime-host/src/tests.rs' -Value 'mod one_off_335s2b;'
          & cargo test --locked -p actingcommand-runtime-host --lib tests::one_off_335s2b -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "B8 harness failed with exit code $LASTEXITCODE" }
