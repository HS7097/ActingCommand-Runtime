name: one-off 339 L2f (to be reverted)

# One-off evidence for Workflow #339 L2f (frozen model 5959674074 section 6.4, E1-E14). The new
# binaries are the Windows exact-SHA build artifacts of the product commit; the older ones the
# exact-SHA builds of the L2e tip (run 37064418563) and the L2a tip (run 37041051946), and the
# Runtime v0.9.1 and v0.9.0 release assets. The packages are small hand-written 64x36 packages run
# on the fixture backend. Reverted right after its run; the PR's final diff contains neither this
# file nor one-off-339l2f/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  PRODUCT_SHA: 5028911012198e01af9432492e1213ba5add5611
  PRODUCT_BUILD_RUN: '37071674856'
  L2E_SHA: fe358b6b0062324e763a9b65829a55cb19fd7dfd
  L2E_BUILD_RUN: '37064418563'
  L2A_SHA: 979593096de26073ca0163a50911636648b7b29a
  L2A_BUILD_RUN: '37041051946'
  V091_SHA: 8e0ac191ea1aad4c9c8e61898cae5d139c585ee1
  V090_SHA: 885947c90dd6561d6e5c9b7bae3fe736ec36f7c8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  fixture:
    name: L2f fixture runs and ledgers (E1-E13)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L2F|SCOPE|head $head product $env:PRODUCT_SHA l2e $env:L2E_SHA l2a $env:L2A_SHA v0.9.1 $env:V091_SHA v0.9.0 $env:V090_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-339l2f' ':(exclude).github/workflows/oneoff-339l2f.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:L2E_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the L2e tip $env:L2E_SHA is not an ancestor of $env:PRODUCT_SHA" }
          & git -C head diff --stat $env:L2E_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L2F|SCOPE|product $_" }
      - name: Inputs (v0.9.1 and v0.9.0 releases, L2a, L2e and product exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Tag $name does not match SHA256SUMS" }
              Write-Host "L2F|INPUT|$Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L2F|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          function Get-Build([string] $RunId, [string] $Sha, [string] $Dir, [string[]] $Kinds) {
            $runSha = (& gh run view $RunId -R $env:GITHUB_REPOSITORY --json headSha,conclusion --jq '.headSha + " " + .conclusion')
            if ($LASTEXITCODE -ne 0) { throw "gh run view $RunId failed" }
            Write-Host "L2F|INPUT|exact-SHA build run $RunId : $runSha"
            if ($runSha -ne "$Sha success") { throw "run $RunId is not a successful build of $Sha" }
            foreach ($kind in $Kinds) {
              & gh run download $RunId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$Sha" -D (Join-Path $Dir $kind)
              if ($LASTEXITCODE -ne 0) { throw "$kind artifact download for $Sha failed with exit code $LASTEXITCODE" }
              Test-Manifest (Join-Path $Dir $kind) $Sha
            }
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'v0.9.1' @("actingcommand-runtime-$env:V091_SHA.zip", "actingcommand-tools-$env:V091_SHA.zip") (Join-Path $root 'v091-release')
          Expand-Archive -LiteralPath (Join-Path $root "v091-release/actingcommand-runtime-$env:V091_SHA.zip") -DestinationPath (Join-Path $root 'v091/runtime')
          Expand-Archive -LiteralPath (Join-Path $root "v091-release/actingcommand-tools-$env:V091_SHA.zip") -DestinationPath (Join-Path $root 'v091/tools')
          Test-Manifest (Join-Path $root 'v091/runtime') $env:V091_SHA
          Test-Manifest (Join-Path $root 'v091/tools') $env:V091_SHA
          Get-Release 'v0.9.0' @("actingcommand-tools-$env:V090_SHA.zip") (Join-Path $root 'v090-release')
          Expand-Archive -LiteralPath (Join-Path $root "v090-release/actingcommand-tools-$env:V090_SHA.zip") -DestinationPath (Join-Path $root 'v090/tools')
          Test-Manifest (Join-Path $root 'v090/tools') $env:V090_SHA
          Get-Build $env:L2A_BUILD_RUN $env:L2A_SHA (Join-Path $root 'l2a') @('runtime')
          Get-Build $env:L2E_BUILD_RUN $env:L2E_SHA (Join-Path $root 'l2e') @('runtime')
          Get-Build $env:PRODUCT_BUILD_RUN $env:PRODUCT_SHA (Join-Path $root 'new') @('runtime', 'tools')
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Prepare packages and frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-339l2f/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Fixture runs and ledgers (E1-E13)
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-339l2f/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'l2e/runtime') (Join-Path $root 'l2a/runtime') (Join-Path $root 'v091/runtime') (Join-Path $root 'v091/tools') (Join-Path $root 'v090/tools') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }

  kernel:
    name: L2f static, kernel loader, offline and in-process runs (E6, E8, E10-E12, E14)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Static checks (scope, linear_wait and linear_observe unchanged, settle boundaries)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
          & python head/one-off-339l2f/evidence.py static head $env:L2E_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "static failed with exit code $LASTEXITCODE" }
          & python head/one-off-339l2f/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Kernel harness on the product source
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $work = Join-Path $env:RUNNER_TEMP 'work'
          New-Item -ItemType Directory -Force -Path 'head/crates/execution-kernel/examples' | Out-Null
          Copy-Item -LiteralPath 'head/one-off-339l2f/kernel_l2f.rs' -Destination 'head/crates/execution-kernel/examples/oneoff_339l2f.rs'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'target'
          Push-Location head
          & cargo run --locked -p actingcommand-execution-kernel --example oneoff_339l2f -- (Join-Path $work 'cases.json') (Join-Path $work 'kernel-product.jsonl')
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "product kernel harness failed with exit code $code" }
      - name: Kernel harness on the L2e source, and the older loaders (E11, E12)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $work = Join-Path $env:RUNNER_TEMP 'work'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'target'
          $failed = @()
          foreach ($pair in @(@('L2e', $env:L2E_SHA), @('L2a', $env:L2A_SHA), @('v0.9.1', $env:V091_SHA))) {
            $label, $sha = $pair
            $source = Join-Path $env:RUNNER_TEMP "source-$label"
            & git -C head worktree add --detach $source $sha
            if ($LASTEXITCODE -ne 0) { throw "worktree add $sha failed with exit code $LASTEXITCODE" }
            Write-Host "L2F|SOURCE|$label $((& git -C $source rev-parse HEAD).Trim())"
            New-Item -ItemType Directory -Force -Path (Join-Path $source 'crates/execution-kernel/examples') | Out-Null
            Copy-Item -LiteralPath 'head/one-off-339l2f/kernel_admit.rs' -Destination (Join-Path $source 'crates/execution-kernel/examples/oneoff_339admit.rs')
            Push-Location $source
            & cargo run --locked -p actingcommand-execution-kernel --example oneoff_339admit -- $label (Join-Path $work 'cases-old.json')
            if ($LASTEXITCODE -ne 0) { $failed += "$label admit $LASTEXITCODE" }
            if ($label -eq 'L2e') {
              Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'head/one-off-339l2f/kernel_l2f.rs') -Destination (Join-Path $source 'crates/execution-kernel/examples/oneoff_339l2f.rs')
              & cargo run --locked -p actingcommand-execution-kernel --example oneoff_339l2f -- (Join-Path $work 'cases-l2e.json') (Join-Path $work 'kernel-l2e.jsonl')
              if ($LASTEXITCODE -ne 0) { $failed += "L2e harness $LASTEXITCODE" }
            }
            Pop-Location
          }
          if ($failed.Count -ne 0) { throw "older-source harness failures: $($failed -join ', ')" }
      - name: Compare the product and L2e in-process results (E2, E6-E8, E11)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $work = Join-Path $env:RUNNER_TEMP 'work'
          & python head/one-off-339l2f/evidence.py kernel $work (Join-Path $work 'kernel-product.jsonl') (Join-Path $work 'kernel-l2e.jsonl')
          if ($LASTEXITCODE -ne 0) { throw "kernel comparison failed with exit code $LASTEXITCODE" }
