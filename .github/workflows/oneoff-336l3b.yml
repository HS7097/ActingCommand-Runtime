name: one-off 336 L3b (to be reverted)

# One-off evidence for Workflow #336 L3b (R24 amendment, board comment 5958084341, section "L3b",
# evidence items 1-7). The new binaries are the Windows exact-SHA build artifacts of the product
# commit; the L3 binaries are the Windows exact-SHA build artifacts of PR #589 at ef00cc8e (run
# 37048604656). Frames are synthetic 1280x720 screens with assets of a pack of the public
# umbrella v0.9.0 standard package pasted in. Reverted right after its run; the PR's final diff
# contains neither this file nor one-off-336l3b/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l3b:
    name: L3b application step evidence
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: 2d890630bd346b00bb3d2fd05af5f7a486b83d7b
      L3_SHA: ef00cc8ea02651ccd74bf5a59f55a3eaa728cda5
      L3_RUN: '37048604656'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L3B|SCOPE|head $head product $env:PRODUCT_SHA l3 $env:L3_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l3b' ':(exclude).github/workflows/oneoff-336l3b.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:L3_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "product $env:PRODUCT_SHA does not contain the L3 tip $env:L3_SHA" }
          & git -C head diff --stat $env:L3_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L3B|SCOPE|product $_" }
      - name: Inputs (umbrella standard package, product and L3 exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Repository, [string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$Repository/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Repository $Tag $name does not match SHA256SUMS" }
              Write-Host "L3B|INPUT|$Repository $Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L3B|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'HS7097/ActingCommand' 'v0.9.0' @('bluearchive-resources-193cfdd.zip') (Join-Path $root 'umbrella')
          $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $env:PRODUCT_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $env:PRODUCT_SHA" }
          Write-Host "L3B|INPUT|exact-SHA build run $runId for $env:PRODUCT_SHA"
          foreach ($kind in @('runtime', 'tools')) {
            & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$env:PRODUCT_SHA" -D (Join-Path $root "new/$kind")
            if ($LASTEXITCODE -ne 0) { throw "$kind artifact download failed with exit code $LASTEXITCODE" }
            Test-Manifest (Join-Path $root "new/$kind") $env:PRODUCT_SHA
          }
          Write-Host "L3B|INPUT|L3 exact-SHA build run $env:L3_RUN for $env:L3_SHA"
          & gh run download $env:L3_RUN -R $env:GITHUB_REPOSITORY -n "actingcommand-tools-$env:L3_SHA" -D (Join-Path $root 'l3/tools')
          if ($LASTEXITCODE -ne 0) { throw "L3 tools artifact download failed with exit code $LASTEXITCODE" }
          Test-Manifest (Join-Path $root 'l3/tools') $env:L3_SHA
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Lock holder (one-off program calling RecordingLock::acquire)
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path 'head/crates/lab/examples' | Out-Null
          Copy-Item -LiteralPath 'head/one-off-336l3b/lock_holder.rs' -Destination 'head/crates/lab/examples/oneoff_336l3b_lock.rs'
          Push-Location head
          & cargo build --locked -p actingcommand-lab --example oneoff_336l3b_lock
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "lock holder build failed with exit code $code" }
      - name: Prepare synthetic frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l3b/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work') (Join-Path $env:RUNNER_TEMP 'umbrella/bluearchive-resources-193cfdd.zip')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Evidence (items 1-7)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          $holder = (Resolve-Path 'head/target/debug/examples/oneoff_336l3b_lock.exe').Path
          & python head/one-off-336l3b/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'l3/tools') $holder (Resolve-Path head).Path $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
