name: Windows exact-SHA build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-remote-build-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: pwsh
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          PULL_REQUEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = switch ($env:GITHUB_EVENT_NAME) {
            'workflow_dispatch' { $env:DISPATCH_SOURCE_SHA }
            'pull_request' { $env:PULL_REQUEST_SOURCE_SHA }
            'push' { $env:EVENT_SOURCE_SHA }
            default { throw "unsupported workflow event: $env:GITHUB_EVENT_NAME" }
          }
          if (-not [regex]::IsMatch(
              $sourceSha,
              '\A[0-9a-f]{40}\z',
              [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )) {
            throw 'source SHA must be exactly 40 lowercase hexadecimal characters'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "source_sha=$sourceSha"

      - name: Check out exact source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit and tree
        id: checkout
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git rev-parse HEAD failed with exit code $LASTEXITCODE"
          }
          if (-not [string]::Equals(
              $actualHead,
              $env:EXPECTED_SOURCE_SHA,
              [StringComparison]::Ordinal
          )) {
            throw "checked-out commit mismatch: expected $env:EXPECTED_SOURCE_SHA, actual $actualHead"
          }
          $treeSha = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git tree resolution failed with exit code $LASTEXITCODE"
          }
          if (-not [regex]::IsMatch(
              $treeSha,
              '\A[0-9a-f]{40}\z',
              [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )) {
            throw "resolved tree is not a complete lowercase SHA: $treeSha"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tree_sha=$treeSha"

      - name: Configure stable MSVC Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw "rustup toolchain install failed with exit code $LASTEXITCODE"
          }
          & rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "rustup default failed with exit code $LASTEXITCODE"
          }

      - name: Build five Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo build --locked --release --target x86_64-pc-windows-msvc `
            --bin actingcommand-actingd `
            --bin actingctl `
            --bin actinglab `
            --bin actingcommand-vision-provider-check `
            --bin actingcommand-device-test
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed with exit code $LASTEXITCODE"
          }

      - name: Stage exact-SHA artifacts and manifests
        id: stage
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TREE_SHA: ${{ steps.checkout.outputs.tree_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetTriple = 'x86_64-pc-windows-msvc'
          $profile = 'release'
          $buildDir = Join-Path $PWD "target\$targetTriple\$profile"
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'actingcommand-windows-build-artifacts'
          $runtimeArtifactName = "actingcommand-runtime-$env:SOURCE_SHA"
          $toolsArtifactName = "actingcommand-tools-$env:SOURCE_SHA"
          $runtimeDir = Join-Path $artifactRoot $runtimeArtifactName
          $toolsDir = Join-Path $artifactRoot $toolsArtifactName
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction Stop
          }
          New-Item -ItemType Directory -Path $runtimeDir, $toolsDir | Out-Null

          $runtimeFiles = @('actingcommand-actingd.exe', 'actingctl.exe')
          $toolFiles = @(
            'actinglab.exe',
            'actingcommand-vision-provider-check.exe',
            'actingcommand-device-test.exe'
          )

          function Copy-BuildFiles {
            param(
              [Parameter(Mandatory)] [string[]] $Names,
              [Parameter(Mandatory)] [string] $Destination
            )
            foreach ($name in $Names) {
              $source = Join-Path $buildDir $name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                throw "expected build output is missing or is not a file: $source"
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $Destination $name)
            }
          }

          function New-BuildManifest {
            param(
              [Parameter(Mandatory)] [string] $ArtifactName,
              [Parameter(Mandatory)] [string] $Directory,
              [Parameter(Mandatory)] [string[]] $Names
            )
            $files = foreach ($name in $Names) {
              $path = Join-Path $Directory $name
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              [ordered]@{
                path = $name
                size_bytes = [int64]$item.Length
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
            $cargoLockSha256 = (
              Get-FileHash -LiteralPath (Join-Path $PWD 'Cargo.lock') -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $activeToolchain = ((& rustup show active-toolchain) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "rustup show active-toolchain failed with exit code $LASTEXITCODE"
            }
            $rustcVersion = ((& rustc --version --verbose) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "rustc version query failed with exit code $LASTEXITCODE"
            }
            $rustToolchain = "$activeToolchain`n$rustcVersion"
            $manifest = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit_sha = $env:SOURCE_SHA
              tree_sha = $env:TREE_SHA
              cargo_lock_sha256 = $cargoLockSha256
              rust_toolchain = $rustToolchain
              target = $targetTriple
              configuration = $profile
              workflow_run_id = [uint64]$env:GITHUB_RUN_ID
              workflow_run_attempt = [uint32]$env:GITHUB_RUN_ATTEMPT
              source_artifact_name = $ArtifactName
              files = @($files)
            }
            $manifestPath = Join-Path $Directory 'BUILD-MANIFEST.json'
            $json = $manifest | ConvertTo-Json -Depth 6
            [IO.File]::WriteAllText(
              $manifestPath,
              "$json`n",
              [Text.UTF8Encoding]::new($false)
            )
          }

          Copy-BuildFiles -Names $runtimeFiles -Destination $runtimeDir
          Copy-BuildFiles -Names $toolFiles -Destination $toolsDir
          New-BuildManifest `
            -ArtifactName $runtimeArtifactName `
            -Directory $runtimeDir `
            -Names $runtimeFiles
          New-BuildManifest `
            -ArtifactName $toolsArtifactName `
            -Directory $toolsDir `
            -Names $toolFiles

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_artifact_name=$runtimeArtifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_artifact_dir=$runtimeDir"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tools_artifact_name=$toolsArtifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tools_artifact_dir=$toolsDir"

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.runtime_artifact_name }}
          path: ${{ steps.stage.outputs.runtime_artifact_dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Tools artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.tools_artifact_name }}
          path: ${{ steps.stage.outputs.tools_artifact_dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
