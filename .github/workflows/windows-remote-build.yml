name: Windows exact-SHA build

# Pushes to main do not build: a main commit is built for publication only when
# release.yml calls this workflow (workflow_call), and for acceptance by a manual
# dispatch. Pull-request heads keep their exact-SHA acceptance build.
# No permissions block on purpose: pull requests, stable pushes and dispatches
# run with the repository's default read-only token, and a release run inherits
# the calling job's contents: write, which a block here would downgrade.
on:
  push:
    branches: [stable]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase commit SHA to build
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character lowercase main commit to build and release
        required: true
        type: string
      release_tag:
        description: Release tag to create on source_sha (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
      previous_tag:
        description: Previous release tag the generated pull-request list starts from (empty for the first release)
        required: false
        type: string
        default: ''
      prerelease:
        description: Publish as a pre-release, never marked Latest (a tag with a '-' suffix always is one)
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build, verify and stage the release files without creating the tag or the release
        required: false
        type: boolean
        default: false

concurrency:
  group: windows-remote-build-${{ github.event.pull_request.number || inputs.release_tag || inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: pwsh
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          PULL_REQUEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = switch ($env:GITHUB_EVENT_NAME) {
            'workflow_dispatch' { $env:DISPATCH_SOURCE_SHA }
            'pull_request' { $env:PULL_REQUEST_SOURCE_SHA }
            'push' { $env:EVENT_SOURCE_SHA }
            default { throw "unsupported workflow event: $env:GITHUB_EVENT_NAME" }
          }
          if (-not [regex]::IsMatch(
              $sourceSha,
              '\A[0-9a-f]{40}\z',
              [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )) {
            throw 'source SHA must be exactly 40 lowercase hexadecimal characters'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "source_sha=$sourceSha"

      - name: Check out exact source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit and tree
        id: checkout
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git rev-parse HEAD failed with exit code $LASTEXITCODE"
          }
          if (-not [string]::Equals(
              $actualHead,
              $env:EXPECTED_SOURCE_SHA,
              [StringComparison]::Ordinal
          )) {
            throw "checked-out commit mismatch: expected $env:EXPECTED_SOURCE_SHA, actual $actualHead"
          }
          $treeSha = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git tree resolution failed with exit code $LASTEXITCODE"
          }
          if (-not [regex]::IsMatch(
              $treeSha,
              '\A[0-9a-f]{40}\z',
              [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )) {
            throw "resolved tree is not a complete lowercase SHA: $treeSha"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tree_sha=$treeSha"

      - name: Fetch and verify Android platform-tools
        id: platform_tools
        shell: pwsh
        run: |
          # Workflow #337: the official Google archive at its versioned URL is the only source
          # (no other host, no cache, no fallback). Size and Google's SHA-1, then the sha256
          # pin, then every distributed file are checked against windows-tool-sources.v1.json.
          # Only network errors and non-200 responses are retried; a mismatch never is.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $pin = (Get-Content -LiteralPath 'scripts/windows-tools/windows-tool-sources.v1.json' -Raw |
            ConvertFrom-Json -Depth 100).components.'platform-tools-37.0.1'
          $url = [string]$pin.archive.url
          $size = [long]$pin.archive.size
          $officialSha1 = [string]$pin.archive.official_sha1
          $pinnedSha256 = [string]$pin.archive.sha256
          $files = @($pin.distributed_files)
          if ($files.Count -eq 0) {
            throw 'platform_tools_content_invalid: the pin lists no distributed_files'
          }
          if ($url -cnotmatch '\Ahttps://dl\.google\.com/android/repository/[A-Za-z0-9._-]+\.zip\z') {
            throw "platform_tools_source_unavailable: the pinned URL is not an official https://dl.google.com archive: $url"
          }
          $root = Join-Path $env:RUNNER_TEMP 'actingcommand-platform-tools'
          $outDir = Join-Path $root 'verified'
          New-Item -ItemType Directory -Path $root, $outDir | Out-Null

          # 1. Download: same URL each time, 5 minutes per attempt, at most 3 attempts.
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [Net.Http.HttpClient]::new($handler)
          $client.Timeout = [TimeSpan]::FromMinutes(5)
          $bytes = $null
          try {
            for ($attempt = 1; $attempt -le 3 -and $null -eq $bytes; $attempt++) {
              if ($attempt -gt 1) {
                Start-Sleep -Seconds (10 * ($attempt - 1))
              }
              try {
                $response = $client.GetAsync($url).GetAwaiter().GetResult()
              } catch {
                Write-Host "platform-tools attempt $attempt/3: GET $url failed: $($_.Exception.GetBaseException().Message)"
                continue
              }
              try {
                $status = [int]$response.StatusCode
                $length = $response.Content.Headers.ContentLength
                $lengthText = if ($null -eq $length) { 'absent' } else { "$length" }
                Write-Host "platform-tools attempt $attempt/3: GET $url -> HTTP $status, Content-Length $lengthText"
                if ($status -ne 200) {
                  continue
                }
                if ($null -eq $length -or $length -ne $size) {
                  throw "platform_tools_hash_mismatch: Content-Length expected $size (Google), actual $lengthText"
                }
                $bytes = $response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
              } finally {
                $response.Dispose()
              }
            }
          } finally {
            $client.Dispose()
            $handler.Dispose()
          }
          if ($null -eq $bytes) {
            throw "platform_tools_source_unavailable: no HTTP 200 response from $url in 3 attempts"
          }

          # 2. Size and Google's SHA-1, then the sha256 pin.
          if ($bytes.LongLength -ne $size) {
            throw "platform_tools_hash_mismatch: received $($bytes.LongLength) bytes, expected $size (Google)"
          }
          $sha1 = [Convert]::ToHexString([Security.Cryptography.SHA1]::HashData($bytes)).ToLowerInvariant()
          if ($sha1 -cne $officialSha1) {
            throw "platform_tools_hash_mismatch: archive SHA-1 expected $officialSha1 (Google), actual $sha1"
          }
          $sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($sha256 -cne $pinnedSha256) {
            throw "platform_tools_hash_mismatch: archive SHA-256 expected $pinnedSha256 (pin), actual $sha256"
          }
          Write-Host "platform-tools archive: $($bytes.LongLength) bytes, SHA-1 $sha1 (Google), SHA-256 $sha256 (pin)"
          $archivePath = Join-Path $root ([IO.Path]::GetFileName([string]$pin.archive.relative_path))
          [IO.File]::WriteAllBytes($archivePath, $bytes)

          # 3. Extract only the pinned files: no unsafe or colliding paths, at most 16 MiB.
          $wanted = [Collections.Generic.Dictionary[string, object]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($file in $files) {
            $wanted.Add([string]$file.path, $file)
          }
          $selected = [Collections.Generic.Dictionary[string, object]]::new([StringComparer]::OrdinalIgnoreCase)
          [long]$selectedBytes = 0
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName
              if ($name.Contains('\') -or $name.Contains(':') -or $name.StartsWith('/') -or
                  @($name.Split('/')) -contains '..') {
                throw "platform_tools_content_invalid: archive entry has an unsafe path: $name"
              }
              if (-not $wanted.ContainsKey($name)) {
                continue
              }
              if ($name -cne [string]$wanted[$name].path -or $selected.ContainsKey($name)) {
                throw "platform_tools_content_invalid: archive entry $name duplicates or case-collides with $($wanted[$name].path)"
              }
              $selected.Add($name, $entry)
              $selectedBytes += $entry.Length
            }
            if ($selectedBytes -gt 16MB) {
              throw "platform_tools_content_invalid: the selected entries declare $selectedBytes bytes, above 16 MiB"
            }
            foreach ($file in $files) {
              $path = [string]$file.path
              if (-not $selected.ContainsKey($path)) {
                throw "platform_tools_content_invalid: the archive has no $path"
              }
              $destination = Join-Path $outDir $path
              New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($selected[$path], $destination)
              $actualSize = (Get-Item -LiteralPath $destination).Length
              $actualSha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSize -ne [long]$file.size -or $actualSha256 -cne [string]$file.sha256) {
                throw "platform_tools_content_invalid: $path expected $($file.size) bytes SHA-256 $($file.sha256), actual $actualSize bytes SHA-256 $actualSha256"
              }
              Write-Host "platform-tools file ${path}: $actualSize bytes, SHA-256 $actualSha256"
            }
          } finally {
            $zip.Dispose()
          }

          # 4. The revision and the adb build ('adb version' starts no server).
          $properties = [IO.File]::ReadAllText((Join-Path $outDir 'platform-tools/source.properties'))
          if ($properties -cnotmatch "(?m)^Pkg\.Revision=$([regex]::Escape([string]$pin.version))\r?$") {
            throw "platform_tools_content_invalid: source.properties has no Pkg.Revision=$($pin.version)"
          }
          $adbVersion = [string]$pin.distributed_adb_version
          $versionText = (& (Join-Path $outDir 'platform-tools/adb.exe') version | Out-String)
          $versionExit = $LASTEXITCODE
          Write-Host "platform-tools adb.exe version (exit $versionExit):`n$($versionText.Trim())"
          if ($versionExit -ne 0 -or $versionText -cnotmatch "(?m)^Version $([regex]::Escape($adbVersion))\r?$") {
            throw "platform_tools_content_invalid: adb.exe version exited $versionExit without the line 'Version $adbVersion'"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "platform_tools_dir=$outDir"

      - name: Fetch and verify the scrcpy server
        id: scrcpy_server
        shell: pwsh
        run: |
          # #402 RD-3: the official scrcpy release asset at its versioned URL is the only source
          # (no other host, no cache, no fallback). Its size and SHA-256 are checked against
          # windows-tool-sources.v1.json. The verified file is named in ACTINGCOMMAND_SCRCPY_SERVER
          # for the build, where crates/device/build.rs checks it against the same pin again and
          # embeds it in actingcommand-actingd.exe. Nothing is executed here. Only network errors
          # and non-200 responses are retried; a mismatch never is.
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content -LiteralPath 'scripts/windows-tools/windows-tool-sources.v1.json' -Raw |
            ConvertFrom-Json -Depth 100).components.'scrcpy-server-5.0.1'
          $artifacts = @($pin.artifacts)
          if ($artifacts.Count -ne 1) {
            throw "scrcpy_server_content_invalid: the pin must list exactly one artifact, it lists $($artifacts.Count)"
          }
          $artifact = $artifacts[0]
          $url = [string]$artifact.url
          $size = [long]$artifact.size
          $pinnedSha256 = [string]$artifact.sha256
          $version = [regex]::Escape([string]$pin.version)
          if ($url -cnotmatch "\Ahttps://github\.com/Genymobile/scrcpy/releases/download/v$version/scrcpy-server-v$version\z") {
            throw "scrcpy_server_source_unavailable: the pinned URL is not the official release asset: $url"
          }
          $root = Join-Path $env:RUNNER_TEMP 'actingcommand-scrcpy-server'
          New-Item -ItemType Directory -Path $root | Out-Null

          # 1. Download: same URL each time (GitHub redirects release assets to its asset host),
          #    5 minutes per attempt, at most 3 attempts.
          $handler = [Net.Http.HttpClientHandler]::new()
          $client = [Net.Http.HttpClient]::new($handler)
          $client.Timeout = [TimeSpan]::FromMinutes(5)
          $bytes = $null
          try {
            for ($attempt = 1; $attempt -le 3 -and $null -eq $bytes; $attempt++) {
              if ($attempt -gt 1) {
                Start-Sleep -Seconds (10 * ($attempt - 1))
              }
              try {
                $response = $client.GetAsync($url).GetAwaiter().GetResult()
              } catch {
                Write-Host "scrcpy server attempt $attempt/3: GET $url failed: $($_.Exception.GetBaseException().Message)"
                continue
              }
              try {
                $status = [int]$response.StatusCode
                $final = $response.RequestMessage.RequestUri
                Write-Host "scrcpy server attempt $attempt/3: GET $url -> HTTP $status from $($final.Host)"
                if ($status -ne 200) {
                  continue
                }
                if ($final.Scheme -cne 'https' -or
                    ($final.Host -cne 'github.com' -and
                     -not $final.Host.EndsWith('.githubusercontent.com', [StringComparison]::Ordinal))) {
                  throw "scrcpy_server_source_unavailable: the release asset was served from an unexpected host: $($final.Host)"
                }
                $bytes = $response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
              } finally {
                $response.Dispose()
              }
            }
          } finally {
            $client.Dispose()
            $handler.Dispose()
          }
          if ($null -eq $bytes) {
            throw "scrcpy_server_source_unavailable: no HTTP 200 response from $url in 3 attempts"
          }

          # 2. Size and the official SHA-256 the pin records.
          if ($bytes.LongLength -ne $size) {
            throw "scrcpy_server_digest_mismatch: received $($bytes.LongLength) bytes, the pin says $size"
          }
          $sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($sha256 -cne $pinnedSha256) {
            throw "scrcpy_server_digest_mismatch: SHA-256 expected $pinnedSha256 (pin), actual $sha256"
          }
          $path = Join-Path $root ([IO.Path]::GetFileName([string]$artifact.relative_path))
          [IO.File]::WriteAllBytes($path, $bytes)
          Write-Host "scrcpy server v$($pin.version): $($bytes.LongLength) bytes, SHA-256 $sha256 (pin)"

          # 3. The build embeds exactly this file (crates/device/build.rs).
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ACTINGCOMMAND_SCRCPY_SERVER=$path"

      - name: Configure stable MSVC Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw "rustup toolchain install failed with exit code $LASTEXITCODE"
          }
          & rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "rustup default failed with exit code $LASTEXITCODE"
          }

      - name: Build Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo build --locked --release --target x86_64-pc-windows-msvc `
            --bin actingcommand-actingd `
            --bin actingctl `
            --bin actingwatch `
            --bin actinglab `
            --bin actingledger `
            --bin actingcommand-vision-provider-check
          if ($LASTEXITCODE -ne 0) {
            throw "executable cargo build failed with exit code $LASTEXITCODE"
          }

      - name: Test Windows artifact tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = Join-Path $env:RUNNER_TEMP "actingcommand-windows-tools-$env:GITHUB_RUN_ATTEMPT"
          $testRoot = Join-Path $taskRoot 'tests'
          $processTemp = Join-Path $taskRoot 'process-temp'
          New-Item -ItemType Directory -Path $taskRoot, $processTemp -Force | Out-Null
          $env:TEMP = $processTemp
          $env:TMP = $processTemp
          & ./scripts/windows-tools/Test-WindowsRemoteBuildTools.ps1 `
            -TaskRoot $taskRoot `
            -TestRoot $testRoot
          if (-not $?) {
            throw 'Windows artifact tooling tests failed'
          }

      - name: Boot smoke
        id: boot_smoke
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # BOOT-SMOKE (additions §8.1, REG-0): this build's actingd starts as a plain program on a
          # fresh state root with the example configuration (no instances), prints one ready line
          # within 60 s and shuts down cleanly. A failure before ready is accepted only when a row
          # of ci/known-unbootable.toml (the copy of Workflow #390 REG-0) names a code of its FATAL
          # line; then the Watchdog smoke is skipped. A release run accepts nothing but a boot.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $root = Join-Path $env:RUNNER_TEMP 'boot-smoke'
          $runtime = Join-Path $root 'runtime'
          $state = Join-Path $root 'state'
          $configPath = Join-Path $root 'actingd.config.json'
          $out = Join-Path $root 'actingd.out.log'
          $err = Join-Path $root 'actingd.err.log'
          $ctl = Join-Path $runtime 'actingctl.exe'
          $readyPattern = '^actingd ready pid=\d+ host=127\.0\.0\.1 port=\d+$'
          $release = -not [string]::IsNullOrEmpty($env:RELEASE_TAG)
          $rows = @()
          $outcome = 'failed'
          $boot = $null
          $red = $null
          $shutdown = 'not reached'

          # Returns stdout; a non-zero exit throws with stdout and stderr.
          function Invoke-SmokeChecked([string] $Exe, [string[]] $Arguments) {
            $stderr = Join-Path $root 'actingctl.err.log'
            $text = (& $Exe @Arguments 2> $stderr | Out-String)
            $exit = $LASTEXITCODE
            if ($exit -ne 0) {
              $detail = Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue
              throw "$([IO.Path]::GetFileName($Exe)) $($Arguments -join ' ') exited $exit`n$text$detail"
            }
            return $text
          }
          function Get-SmokeRuntimes {
            @(Get-CimInstance -ClassName Win32_Process -Filter "Name='actingcommand-actingd.exe'" |
              Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith("$root\", [StringComparison]::OrdinalIgnoreCase) })
          }
          function Format-Row($Row) {
            "slice=$($Row.slice) stage=$($Row.stage) expected_code=$($Row.expected_code) restored_by=$($Row.restored_by)"
          }

          try {
            if (Test-Path -LiteralPath $root) {
              throw "boot_smoke_failed: the smoke root $root already exists"
            }
            New-Item -ItemType Directory -Path $runtime, $state | Out-Null

            # The registry, read and checked by ci/gate_check.py with the runner's own Python.
            $version = (& python --version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "boot_smoke_failed: python --version exited ${LASTEXITCODE}: $version"
            }
            Write-Host "boot smoke python: $version"
            $registryErr = Join-Path $root 'registry.err.log'
            $registry = (& python ci/gate_check.py known-unbootable ci/known-unbootable.toml 2> $registryErr | Out-String)
            if ($LASTEXITCODE -ne 0) {
              $detail = Get-Content -LiteralPath $registryErr -Raw -ErrorAction SilentlyContinue
              throw "boot_smoke_failed: ci/known-unbootable.toml is invalid (exit $LASTEXITCODE)`n$detail"
            }
            $rows = @($registry | ConvertFrom-Json)
            Write-Host "boot smoke ci/known-unbootable.toml rows: $($rows.Count)"
            foreach ($row in $rows) {
              Write-Host "boot smoke registered: $(Format-Row $row)"
            }

            # The exact-SHA programs and the example configuration with a fresh root and salt.
            $build = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release'
            foreach ($name in @('actingcommand-actingd.exe', 'actingctl.exe')) {
              Copy-Item -LiteralPath (Join-Path $build $name) -Destination $runtime
            }
            $config = Get-Content -LiteralPath 'distribution/windows/actingd.config.example.json' -Raw | ConvertFrom-Json
            if (@($config.instances).Count -ne 0) {
              throw 'boot_smoke_failed: the example configuration declares instances'
            }
            $config.state_root = $state
            $config.secret_fingerprint_salt = 'boot-smoke-salt-0123456789'
            [IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))

            $process = Start-Process -FilePath (Join-Path $runtime 'actingcommand-actingd.exe') `
              -ArgumentList @('--config', "`"$configPath`"") -NoNewWindow -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $process.Handle
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ($true) {
              $exited = $process.HasExited
              $ready = @(Get-Content -LiteralPath $out -ErrorAction SilentlyContinue | Where-Object { $_ -cmatch $readyPattern })
              if ($ready.Count -ge 1 -or $exited -or [DateTime]::UtcNow -ge $deadline) {
                break
              }
              Start-Sleep -Milliseconds 250
            }

            if ($ready.Count -eq 1) {
              Write-Host "boot smoke ready line: $($ready[0])"
              try {
                $status = Invoke-SmokeChecked $ctl @('status', '--state-root', $state)
                Write-Host "boot smoke actingctl status: exit 0 ($($status.Length) bytes)"
                $shutdown = (Invoke-SmokeChecked $ctl @('request-shutdown', '--state-root', $state, '--wait', '60')).Trim()
                Write-Host "boot smoke request-shutdown: $shutdown"
                if (($shutdown | ConvertFrom-Json).shutdown.state -cne 'completed') {
                  throw 'request-shutdown did not report shutdown.state completed'
                }
                if (-not $process.WaitForExit(30000)) {
                  throw 'actingd did not exit within 30 s after the shutdown'
                }
                if ($process.ExitCode -ne 0) {
                  throw "actingd exited $($process.ExitCode) after the shutdown"
                }
                Write-Host 'boot smoke actingd exited 0'
                $readyAfter = @(Get-Content -LiteralPath $out | Where-Object { $_ -cmatch $readyPattern })
                if ($readyAfter.Count -ne 1) {
                  throw "actingd printed $($readyAfter.Count) ready lines"
                }
                $outcome = 'booted'
              } catch {
                $red = "boot_smoke_failed: after the ready line: $($_.Exception.Message)"
              }
            } elseif ($ready.Count -gt 1) {
              $red = "boot_smoke_failed: actingd printed $($ready.Count) ready lines"
            } elseif ($exited) {
              # actingd prints `FATAL actingd: …` as its last act; a multi-line detail may follow.
              $fatal = @(Get-Content -LiteralPath $err -ErrorAction SilentlyContinue |
                Where-Object { $_.TrimStart().StartsWith('FATAL actingd:', [StringComparison]::Ordinal) })
              if ($fatal.Count -eq 0) {
                $red = "boot_smoke_failed: actingd exited $($process.ExitCode) before a ready line without a FATAL line"
              } else {
                $fatalLine = $fatal[-1].Trim()
                Write-Host "boot smoke FATAL line: $fatalLine"
                $outcome = 'failed_before_ready'
              }
            } else {
              $red = 'boot_smoke_failed: actingd printed no ready line within 60 s and still runs'
            }
            if ($outcome -ceq 'booted') {
              if ($release -or $rows.Count -eq 0) {
                $boot = 'ok'
              } else {
                $stale = @($rows | ForEach-Object { Format-Row $_ }) -join '; '
                $red = "boot_smoke_failed: main boots, so every row of ci/known-unbootable.toml is stale and its restoring slice deletes it: $stale"
              }
            } elseif ($outcome -ceq 'failed_before_ready') {
              if ($release) {
                $red = "boot_smoke_failed: a release run accepts no failure before ready (registry not consulted): $fatalLine"
              } else {
                $matching = @($rows | Where-Object {
                  $fatalLine -cmatch "(?<![A-Za-z0-9_])$([regex]::Escape([string]$_.expected_code))(?![A-Za-z0-9_])"
                })
                if ($matching.Count -eq 0) {
                  $red = "boot_smoke_failed: the failure before ready is not in ci/known-unbootable.toml: $fatalLine"
                } else {
                  foreach ($row in $matching) {
                    Write-Host "::notice title=Boot smoke::known unbootable, $(Format-Row $row); FATAL line: $fatalLine"
                  }
                  foreach ($row in @($rows | Where-Object { $matching -notcontains $_ })) {
                    Write-Host "boot smoke row not reached this run: $(Format-Row $row)"
                  }
                  $boot = 'known_unbootable'
                }
              }
            }
          } catch {
            $message = $_.Exception.Message
            $red = if ($message.StartsWith('boot_smoke_failed:', [StringComparison]::Ordinal)) { $message } else { "boot_smoke_failed: $message" }
          } finally {
            foreach ($smoke in @(Get-SmokeRuntimes)) {
              Write-Host "boot smoke stopping actingd pid $($smoke.ProcessId)"
              Stop-Process -Id $smoke.ProcessId -Force -ErrorAction Continue
            }
          }
          Write-Host "boot smoke outcome: $outcome"
          Write-Host "boot smoke shutdown: $shutdown"
          Write-Host "boot smoke elapsed: $([Math]::Round($watch.Elapsed.TotalSeconds, 1)) s"
          if ($red) {
            foreach ($log in @($out, $err)) {
              Write-Host "---- last 40 lines of $log"
              Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue | Write-Host
            }
            throw $red
          }
          Write-Host "boot smoke verdict: boot=$boot"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "boot=$boot"
          $global:LASTEXITCODE = 0

      - name: Stage exact-SHA artifacts and manifests
        id: stage
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TREE_SHA: ${{ steps.checkout.outputs.tree_sha }}
          PLATFORM_TOOLS_DIR: ${{ steps.platform_tools.outputs.platform_tools_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetTriple = 'x86_64-pc-windows-msvc'
          $profile = 'release'
          $buildDir = Join-Path $PWD "target\$targetTriple\$profile"
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'actingcommand-windows-build-artifacts'
          $runtimeArtifactName = "actingcommand-runtime-$env:SOURCE_SHA"
          $toolsArtifactName = "actingcommand-tools-$env:SOURCE_SHA"
          $runtimeDir = Join-Path $artifactRoot $runtimeArtifactName
          $toolsDir = Join-Path $artifactRoot $toolsArtifactName
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction Stop
          }
          New-Item -ItemType Directory -Path $runtimeDir, $toolsDir | Out-Null

          # Workflow #387 D1b (model v1.2 §5.2): the defaults file ships beside the example
          # configuration.
          $runtimeFiles = @(
            'actingcommand-actingd.exe',
            'actingctl.exe',
            'actingd.config.example.json',
            'actingd.defaults.json',
            'INSTALL.md',
            'RELEASE-NOTES.md'
          )
          $toolFiles = @(
            'actinglab.exe',
            'actingledger.exe',
            'actingcommand-vision-provider-check.exe',
            'actingwatch.exe'
          )
          # Workflow #337: the official platform-tools files the fetch step verified, under platform-tools/.
          $platformToolsFiles = @(
            (Get-Content -LiteralPath 'scripts/windows-tools/windows-tool-sources.v1.json' -Raw |
              ConvertFrom-Json -Depth 100).components.'platform-tools-37.0.1'.distributed_files |
              ForEach-Object { [string]$_.path }
          )
          if ($platformToolsFiles.Count -eq 0 -or -not $env:PLATFORM_TOOLS_DIR) {
            throw 'the verified platform-tools files are missing'
          }

          function Copy-BuildFiles {
            param(
              [Parameter(Mandatory)] [string[]] $Names,
              [Parameter(Mandatory)] [string] $Destination,
              [string] $SourceDirectory = $buildDir
            )
            foreach ($name in $Names) {
              $source = Join-Path $SourceDirectory $name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                throw "expected build output is missing or is not a file: $source"
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $Destination $name)
            }
          }

          # Workflow #364: the interface declaration both manifests carry unchanged
          # (contracts/component-interfaces.md). A file that is not a valid v1
          # declaration stops the build.
          $interfacesPath = Join-Path $PWD 'distribution/windows/component-interfaces.json'
          $interfaces = Get-Content -LiteralPath $interfacesPath -Raw | ConvertFrom-Json -Depth 20
          if ($interfaces.schema_version -cne 'actingcommand.component-interfaces.v1') {
            throw "component-interfaces.json: schema_version is not actingcommand.component-interfaces.v1: $($interfaces.schema_version)"
          }
          foreach ($name in @('actingd-config', 'install-selection', 'install-control', 'ledger', 'runtime-client', 'package')) {
            $range = @($interfaces.speaks.$name)
            if ($range.Count -ne 2 -or @($range | Where-Object { "$_" -cnotmatch '\A[0-9]+\z' }).Count -ne 0 -or
                [int64]"$($range[0])" -gt [int64]"$($range[1])") {
              throw "component-interfaces.json: speaks.$name is not [min, max] with 0 <= min <= max"
            }
          }
          $interfacesJson = $interfaces | ConvertTo-Json -Depth 20 -Compress

          function New-BuildManifest {
            param(
              [Parameter(Mandatory)] [string] $ArtifactName,
              [Parameter(Mandatory)] [string] $Directory,
              [Parameter(Mandatory)] [string[]] $Names,
              [switch] $RuntimeDistribution,
              [switch] $PlatformToolsLayout
            )
            $files = foreach ($name in $Names) {
              $path = Join-Path $Directory $name
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              [ordered]@{
                path = $name
                size_bytes = [int64]$item.Length
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
            $cargoLockSha256 = (
              Get-FileHash -LiteralPath (Join-Path $PWD 'Cargo.lock') -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $activeToolchain = ((& rustup show active-toolchain) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "rustup show active-toolchain failed with exit code $LASTEXITCODE"
            }
            $rustcVersion = ((& rustc --version --verbose) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "rustc version query failed with exit code $LASTEXITCODE"
            }
            $rustToolchain = "$activeToolchain`n$rustcVersion"
            $manifest = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit_sha = $env:SOURCE_SHA
              tree_sha = $env:TREE_SHA
              cargo_lock_sha256 = $cargoLockSha256
              rust_toolchain = $rustToolchain
              target = $targetTriple
              configuration = $profile
              workflow_run_id = [uint64]$env:GITHUB_RUN_ID
              workflow_run_attempt = [uint32]$env:GITHUB_RUN_ATTEMPT
              source_artifact_name = $ArtifactName
              files = @($files)
            }
            if ($RuntimeDistribution) {
              $manifest.runtime_payload_layout = 'distribution-v1'
            }
            if ($PlatformToolsLayout) {
              # Workflow #360: v2 is v1 without the retired vision provider DLL.
              # Workflow #374: v3 is v2 plus the watchdog launcher actingwatch.exe.
              # Runtime v0.11.6: v3 no longer carries the retired actingcommand-device-test.exe;
              # the layout name stays, so installers that know v3 keep accepting the Tools.
              $manifest.tools_payload_layout = 'platform-tools-v3'
            }
            $manifest.interfaces = $interfaces
            $manifestPath = Join-Path $Directory 'BUILD-MANIFEST.json'
            $json = $manifest | ConvertTo-Json -Depth 6
            [IO.File]::WriteAllText(
              $manifestPath,
              "$json`n",
              [Text.UTF8Encoding]::new($false)
            )
          }

          Copy-BuildFiles -Names @('actingcommand-actingd.exe', 'actingctl.exe') -Destination $runtimeDir
          Copy-BuildFiles -Names @(
            'actingd.config.example.json',
            'actingd.defaults.json',
            'INSTALL.md',
            'RELEASE-NOTES.md'
          ) -SourceDirectory (Join-Path $PWD 'distribution/windows') -Destination $runtimeDir
          # Workflow #387 D1b (model v1.2 §5.2): the shipped defaults file is the one the program
          # embeds: its SHA-256 equals check-config's config_selection.defaults_sha256.
          $defaultsRoot = Join-Path $env:RUNNER_TEMP 'defaults-digest-check'
          if (Test-Path -LiteralPath $defaultsRoot) {
            Remove-Item -LiteralPath $defaultsRoot -Recurse -Force -ErrorAction Stop
          }
          New-Item -ItemType Directory -Path $defaultsRoot | Out-Null
          $defaultsConfig = Get-Content -LiteralPath (Join-Path $runtimeDir 'actingd.config.example.json') -Raw | ConvertFrom-Json
          $defaultsConfig.state_root = Join-Path $defaultsRoot 'state'
          $defaultsConfig.secret_fingerprint_salt = 'defaults-digest-salt-0123456789'
          $defaultsConfigPath = Join-Path $defaultsRoot 'actingd.config.json'
          [IO.File]::WriteAllText($defaultsConfigPath, ($defaultsConfig | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          $PSNativeCommandUseErrorActionPreference = $false
          $checkReport = (& (Join-Path $runtimeDir 'actingcommand-actingd.exe') check-config --config $defaultsConfigPath | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "defaults digest check: check-config exited ${LASTEXITCODE}: $checkReport"
          }
          $reportedDefaults = ($checkReport | ConvertFrom-Json).config_selection.defaults_sha256
          $shippedDefaults = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $runtimeDir 'actingd.defaults.json')).Hash.ToLowerInvariant()
          if ($reportedDefaults -cne $shippedDefaults) {
            throw "defaults digest check: the program embeds $reportedDefaults, the artifact ships $shippedDefaults"
          }
          Write-Host "defaults digest check: $shippedDefaults"
          Copy-BuildFiles -Names $toolFiles -Destination $toolsDir
          New-Item -ItemType Directory -Path (Join-Path $toolsDir 'platform-tools') | Out-Null
          Copy-BuildFiles -Names $platformToolsFiles -SourceDirectory $env:PLATFORM_TOOLS_DIR -Destination $toolsDir
          New-BuildManifest `
            -ArtifactName $runtimeArtifactName `
            -Directory $runtimeDir `
            -Names $runtimeFiles `
            -RuntimeDistribution
          New-BuildManifest `
            -ArtifactName $toolsArtifactName `
            -Directory $toolsDir `
            -Names ($toolFiles + $platformToolsFiles) `
            -PlatformToolsLayout
          foreach ($directory in @($runtimeDir, $toolsDir)) {
            $written = (Get-Content -LiteralPath (Join-Path $directory 'BUILD-MANIFEST.json') -Raw |
              ConvertFrom-Json -Depth 20).interfaces | ConvertTo-Json -Depth 20 -Compress
            if ($written -cne $interfacesJson) {
              throw "$(Split-Path -Leaf $directory) BUILD-MANIFEST.json interfaces differ from component-interfaces.json: $written"
            }
            Write-Host "$(Split-Path -Leaf $directory) BUILD-MANIFEST.json interfaces: $written"
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_artifact_name=$runtimeArtifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_artifact_dir=$runtimeDir"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tools_artifact_name=$toolsArtifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tools_artifact_dir=$toolsDir"

      - name: Watchdog smoke
        if: ${{ steps.boot_smoke.outputs.boot == 'ok' }}
        shell: pwsh
        env:
          RUNTIME_ARTIFACT_DIR: ${{ steps.stage.outputs.runtime_artifact_dir }}
          TOOLS_ARTIFACT_DIR: ${{ steps.stage.outputs.tools_artifact_dir }}
        run: |
          # Workflow #374: this build's watchdog on an A/B root laid out from the staged
          # artifacts. The fixed entries are this build's Runtime programs themselves (the
          # forwarding entry is a UI program), without BUILD-MANIFEST.json, so they run as
          # plain programs and actingctl reads install\active.json for the watchdog. No task
          # is registered here, so `status` answers attention 14 (task missing) throughout.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP 'watchdog-smoke'
          $runtime = Join-Path $root 'runtime'
          $tools = Join-Path $root 'tools'
          $state = Join-Path $root 'state'
          $generation = Join-Path $root 'install\generations\1'
          New-Item -ItemType Directory -Path $runtime, $tools, $state, $generation, (Join-Path $root 'A') -Force | Out-Null
          foreach ($name in @('actingcommand-actingd.exe', 'actingctl.exe')) {
            Copy-Item -LiteralPath (Join-Path $env:RUNTIME_ARTIFACT_DIR $name) -Destination $runtime
          }
          Copy-Item -Path (Join-Path $env:TOOLS_ARTIFACT_DIR '*') -Destination $tools -Recurse
          $utf8 = [Text.UTF8Encoding]::new($false)
          $members = $utf8.GetBytes('{"smoke":"watchdog"}')
          [IO.File]::WriteAllBytes((Join-Path $root 'A\MEMBERS.json'), $members)
          $config = Get-Content -LiteralPath (Join-Path $env:RUNTIME_ARTIFACT_DIR 'actingd.config.example.json') -Raw | ConvertFrom-Json
          $config.state_root = $state
          $config.secret_fingerprint_salt = 'watchdog-smoke-salt-0123456789'
          $configPath = Join-Path $generation 'actingd.config.json'
          $configBytes = $utf8.GetBytes(($config | ConvertTo-Json -Depth 10))
          [IO.File]::WriteAllBytes($configPath, $configBytes)
          foreach ($lock in @('slot-A.lock', 'writer.lock')) {
            [IO.File]::WriteAllBytes((Join-Path $root "install\$lock"), [byte[]]::new(0))
          }
          function Get-Sha256Hex([byte[]] $Bytes) {
            [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($Bytes)).ToLowerInvariant()
          }
          $selection = [ordered]@{
            schema_version = 'actingcommand.install-selection.v1'
            slot = 'A'
            generation = 1
            members = [ordered]@{ path = 'A/MEMBERS.json'; sha256 = (Get-Sha256Hex $members) }
            config = [ordered]@{ path = 'install/generations/1/actingd.config.json'; sha256 = (Get-Sha256Hex $configBytes) }
          }
          [IO.File]::WriteAllText((Join-Path $root 'install\active.json'), ($selection | ConvertTo-Json -Depth 4 -Compress), $utf8)
          $ctl = Join-Path $runtime 'actingctl.exe'
          $launcher = Join-Path $tools 'actingwatch.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'watchdog_smoke_failed: the Tools artifact holds no actingwatch.exe'
          }

          function Invoke-Watchdog([string] $Subcommand, [int] $Expected) {
            $text = (& $ctl watchdog $Subcommand --root $root | Out-String)
            $exit = $LASTEXITCODE
            Write-Host "watchdog $Subcommand exit ${exit}: $($text.Trim())"
            if ($exit -ne $Expected) {
              throw "watchdog_smoke_failed: watchdog $Subcommand exited $exit, expected $Expected"
            }
            return ($text | ConvertFrom-Json)
          }
          # The task's own action: the launcher, waited for itself only.
          function Invoke-Launcher {
            $process = Start-Process -FilePath $launcher -WorkingDirectory $root -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(300000)) {
              throw 'watchdog_smoke_failed: actingwatch.exe did not finish within 5 minutes'
            }
            Write-Host "actingwatch.exe exit $($process.ExitCode)"
            if ($process.ExitCode -ne 0) {
              throw "watchdog_smoke_failed: actingwatch.exe exited $($process.ExitCode)"
            }
          }
          function Get-SmokeRuntimes {
            @(Get-CimInstance -ClassName Win32_Process -Filter "Name='actingcommand-actingd.exe'" |
              Where-Object { -not $_.ExecutablePath -or $_.ExecutablePath.StartsWith("$root\", [StringComparison]::OrdinalIgnoreCase) })
          }

          try {
            # 1. A formal start with a log.
            $formal = Start-Process -FilePath (Join-Path $runtime 'actingcommand-actingd.exe') `
              -ArgumentList @('--config', "`"$configPath`"") -WorkingDirectory $root -NoNewWindow -PassThru `
              -RedirectStandardOutput (Join-Path $root 'actingd-formal.out.log') `
              -RedirectStandardError (Join-Path $root 'actingd-formal.err.log')
            $null = $formal.Handle
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            do {
              Start-Sleep -Milliseconds 500
              $text = (& $ctl watchdog status --root $root | Out-String)
              $alive = (($text | ConvertFrom-Json).decision -ceq 'alive')
            } until ($alive -or $formal.HasExited -or [DateTime]::UtcNow -gt $deadline)
            if (-not $alive) {
              throw "watchdog_smoke_failed: the formal start did not come up (exited=$($formal.HasExited)): $text"
            }
            # 2. A first tick by hand creates <root>\watchdog and observes the formal start.
            $null = Invoke-Watchdog 'run-once' 0
            # 3. An unexpected end.
            Stop-Process -Id $formal.Id -Force
            $formal.WaitForExit()
            # 4. One launcher tick starts the Runtime again.
            Invoke-Launcher
            $status = Invoke-Watchdog 'status' 14
            if ($status.decision -cne 'alive' -or $status.detail.started_by_watchdog -ne $true) {
              throw 'watchdog_smoke_failed: the Runtime is not alive as the watchdog started it'
            }
            $log = Get-Content -LiteralPath (Join-Path $root 'watchdog\watchdog.log') -Raw
            Write-Host "watchdog.log:`n$log"
            $started = @($log -split "`n" | Where-Object { $_ -cmatch ' WARN watchdog_started_runtime .* method=(breakaway|wmi) ' })
            if ($started.Count -ne 1) {
              throw 'watchdog_smoke_failed: no single watchdog_started_runtime line naming its method'
            }
            # 5. A formal close.
            $shutdown = (& $ctl request-shutdown --state-root $state --wait 60 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              throw "watchdog_smoke_failed: request-shutdown exited ${LASTEXITCODE}: $shutdown"
            }
            Write-Host "request-shutdown: $($shutdown.Trim())"
            # 6. The next launcher tick leaves it down.
            Invoke-Launcher
            $status = Invoke-Watchdog 'status' 14
            if ($status.decision -cne 'formal_close') {
              throw "watchdog_smoke_failed: expected formal_close, got $($status.decision)"
            }
            $left = @(Get-SmokeRuntimes)
            if ($left.Count -ne 0) {
              throw "watchdog_smoke_failed: actingd runs after the formal close: $($left.ProcessId -join ',')"
            }
            $starts = @(Get-ChildItem -LiteralPath (Join-Path $root 'watchdog') -Filter 'actingd-*.log')
            if ($starts.Count -ne 1) {
              throw "watchdog_smoke_failed: expected one start log, found $($starts.Count)"
            }
            Write-Host 'watchdog smoke passed'
          } finally {
            # 7. Stop any smoke Runtime still running.
            foreach ($process in @(Get-SmokeRuntimes)) {
              Write-Host "watchdog smoke stopping actingd pid $($process.ProcessId)"
              Stop-Process -Id $process.ProcessId -Force -ErrorAction Continue
            }
          }
          # The runner ends the step with the last native exit code, here the expected 14.
          $global:LASTEXITCODE = 0

      # Actions artifacts are acceptance builds only; a release run publishes the Release instead.
      - name: Upload Runtime artifact
        if: ${{ !inputs.release_tag }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.runtime_artifact_name }}
          path: ${{ steps.stage.outputs.runtime_artifact_dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Tools artifact
        if: ${{ !inputs.release_tag }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.tools_artifact_name }}
          path: ${{ steps.stage.outputs.tools_artifact_dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Publish the release
        if: ${{ inputs.release_tag }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TREE_SHA: ${{ steps.checkout.outputs.tree_sha }}
          RUNTIME_ARTIFACT_NAME: ${{ steps.stage.outputs.runtime_artifact_name }}
          RUNTIME_ARTIFACT_DIR: ${{ steps.stage.outputs.runtime_artifact_dir }}
          TOOLS_ARTIFACT_NAME: ${{ steps.stage.outputs.tools_artifact_name }}
          TOOLS_ARTIFACT_DIR: ${{ steps.stage.outputs.tools_artifact_dir }}
        run: |
          # Zips each staged artifact directory (files at the zip root, as the Actions
          # artifact), reads every zip back against its BUILD-MANIFEST.json, writes
          # SHA256SUMS and creates the Release with its tag on the exact source commit.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?\z') {
            throw "release_input_invalid: release tag is not vX.Y.Z or vX.Y.Z-rc.N: $tag"
          }
          if ($env:PREVIOUS_TAG -and $env:PREVIOUS_TAG -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw "release_input_invalid: previous release tag is not vX.Y.Z: $env:PREVIOUS_TAG"
          }
          if ($env:DRY_RUN -cne 'true' -and $env:DRY_RUN -cne 'false') {
            throw "release_input_invalid: dry_run is neither true nor false: $env:DRY_RUN"
          }
          if ($env:PRERELEASE -cne 'true' -and $env:PRERELEASE -cne 'false') {
            throw "release_input_invalid: prerelease is neither true nor false: $env:PRERELEASE"
          }
          # A pre-release is never marked Latest (GitHub does not allow it); nothing passes --latest.
          $prerelease = $env:PRERELEASE -ceq 'true' -or $tag.Contains('-')
          $dryRun = $env:DRY_RUN -ceq 'true'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'actingcommand-release'
          $readbackRoot = Join-Path $env:RUNNER_TEMP 'actingcommand-release-readback'
          New-Item -ItemType Directory -Path $releaseRoot, $readbackRoot | Out-Null

          $zips = [Collections.Generic.List[string]]::new()
          foreach ($artifact in @(
              @{ Name = $env:RUNTIME_ARTIFACT_NAME; Dir = $env:RUNTIME_ARTIFACT_DIR },
              @{ Name = $env:TOOLS_ARTIFACT_NAME; Dir = $env:TOOLS_ARTIFACT_DIR }
          )) {
            $zip = Join-Path $releaseRoot "$($artifact.Name).zip"
            Compress-Archive -Path (Join-Path $artifact.Dir '*') -DestinationPath $zip -CompressionLevel Optimal
            $check = Join-Path $readbackRoot $artifact.Name
            Expand-Archive -LiteralPath $zip -DestinationPath $check
            $manifest = Get-Content -LiteralPath (Join-Path $check 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json
            if ($manifest.repository -cne $env:GITHUB_REPOSITORY -or $manifest.commit_sha -cne $env:SOURCE_SHA -or
                $manifest.tree_sha -cne $env:TREE_SHA -or $manifest.source_artifact_name -cne $artifact.Name) {
              throw "release_zip_unverified: $($artifact.Name).zip BUILD-MANIFEST.json names $($manifest.source_artifact_name) from $($manifest.repository)@$($manifest.commit_sha)"
            }
            $expected = @(@($manifest.files | ForEach-Object { [string]$_.path }) + 'BUILD-MANIFEST.json' | Sort-Object)
            $actual = @(Get-ChildItem -LiteralPath $check -Recurse -File -Force |
              ForEach-Object { [IO.Path]::GetRelativePath($check, $_.FullName).Replace('\', '/') } | Sort-Object)
            if (($expected -join '|') -cne ($actual -join '|')) {
              throw "release_zip_unverified: $($artifact.Name).zip holds [$($actual -join ', ')], expected [$($expected -join ', ')]"
            }
            foreach ($file in $manifest.files) {
              $path = Join-Path $check ([string]$file.path)
              if ((Get-Item -LiteralPath $path).Length -ne [int64]$file.size_bytes -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$file.sha256) {
                throw "release_zip_unverified: $($artifact.Name).zip $($file.path) does not match BUILD-MANIFEST.json"
              }
            }
            Write-Host "release zip $($artifact.Name).zip: $((Get-Item -LiteralPath $zip).Length) bytes, BUILD-MANIFEST.json and $($expected.Count - 1) files read back"
            $zips.Add($zip)
          }

          $sumsPath = Join-Path $releaseRoot 'SHA256SUMS'
          $sums = @(foreach ($zip in $zips) {
            "$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($zip))"
          })
          [IO.File]::WriteAllText($sumsPath, (($sums -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = @(
            "Built from commit ``$env:SOURCE_SHA`` (tree ``$env:TREE_SHA``) by [run $env:GITHUB_RUN_ID, attempt $env:GITHUB_RUN_ATTEMPT]($runUrl).",
            '',
            'Assets (SHA-256, as in `SHA256SUMS`):'
          )
          foreach ($line in $sums) {
            $hash, $name = $line -split '  ', 2
            $notes += "- ``$name``: ``$hash``"
          }
          $notes += ''
          $notes += 'The version exists only in this tag; the executables and the BUILD-MANIFEST.json in each zip bind the commit above.'
          if (-not $env:PREVIOUS_TAG) {
            $notes += ''
            $notes += 'First release: there is no earlier release to list pull requests from.'
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'actingcommand-release-notes.md'
          [IO.File]::WriteAllText($notesPath, (($notes -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))

          $arguments = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:SOURCE_SHA, '--title', $tag, '--notes-file', $notesPath)
          if ($env:PREVIOUS_TAG) {
            $arguments += @('--generate-notes', '--notes-start-tag', $env:PREVIOUS_TAG)
          }
          if ($prerelease) {
            $arguments += '--prerelease'
          }
          $arguments += @($zips) + $sumsPath
          Get-ChildItem -LiteralPath $releaseRoot | ForEach-Object { Write-Host "staged $($_.Name) $($_.Length) bytes" }
          Write-Host "SHA256SUMS:`n$($sums -join "`n")"
          Write-Host "release notes:`n$($notes -join "`n")"
          Write-Host "release command: gh $($arguments -join ' ')"
          if ($dryRun) {
            Write-Host "dry run: not published ($tag at $env:SOURCE_SHA, prerelease=$prerelease)"
          } else {
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "release_create_failed: gh release create exited $LASTEXITCODE"
            }
            $tagCommit = (& gh api "repos/$env:GITHUB_REPOSITORY/commits/tags/$tag" --jq .sha | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:SOURCE_SHA) {
              throw "release_readback_failed: tag $tag resolves to '$tagCommit', expected $env:SOURCE_SHA"
            }
            $published = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | Out-String | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $published.draft) {
              throw "release_readback_failed: release $tag is missing or still a draft"
            }
            if ([bool]$published.prerelease -ne $prerelease) {
              throw "release_readback_failed: release $tag prerelease=$($published.prerelease), expected $prerelease"
            }
            $expectedAssets = @(@($zips) + $sumsPath | ForEach-Object {
              "$([IO.Path]::GetFileName($_)) $((Get-Item -LiteralPath $_).Length)"
            } | Sort-Object)
            $actualAssets = @($published.assets | ForEach-Object { "$($_.name) $($_.size)" } | Sort-Object)
            if (($expectedAssets -join '|') -cne ($actualAssets -join '|')) {
              throw "release_readback_failed: release $tag assets [$($actualAssets -join ', ')], expected [$($expectedAssets -join ', ')]"
            }
            Write-Host "published $($published.html_url): tag $tag -> $tagCommit, prerelease=$($published.prerelease), assets $($actualAssets -join ', ')"
          }
