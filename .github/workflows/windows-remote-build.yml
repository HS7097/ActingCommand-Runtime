name: Windows exact-SHA build

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-remote-build-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: pwsh
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          PULL_REQUEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = switch ($env:GITHUB_EVENT_NAME) {
            'workflow_dispatch' { $env:DISPATCH_SOURCE_SHA }
            'pull_request' { $env:PULL_REQUEST_SOURCE_SHA }
            'push' { $env:EVENT_SOURCE_SHA }
            default { throw "unsupported workflow event: $env:GITHUB_EVENT_NAME" }
          }
          if (-not [regex]::IsMatch(
              $sourceSha,
              '\A[0-9a-f]{40}\z',
              [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )) {
            throw 'source SHA must be exactly 40 lowercase hexadecimal characters'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "source_sha=$sourceSha"

      - name: Check out exact source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit and tree
        id: checkout
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git rev-parse HEAD failed with exit code $LASTEXITCODE"
          }
          if (-not [string]::Equals(
              $actualHead,
              $env:EXPECTED_SOURCE_SHA,
              [StringComparison]::Ordinal
          )) {
            throw "checked-out commit mismatch: expected $env:EXPECTED_SOURCE_SHA, actual $actualHead"
          }
          $treeSha = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git tree resolution failed with exit code $LASTEXITCODE"
          }
          if (-not [regex]::IsMatch(
              $treeSha,
              '\A[0-9a-f]{40}\z',
              [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )) {
            throw "resolved tree is not a complete lowercase SHA: $treeSha"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tree_sha=$treeSha"

      - name: Configure stable MSVC Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw "rustup toolchain install failed with exit code $LASTEXITCODE"
          }
          & rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "rustup default failed with exit code $LASTEXITCODE"
          }

      - name: Build Windows executables and PP-OCR provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo build --locked --release --target x86_64-pc-windows-msvc `
            --bin actingcommand-actingd `
            --bin actingctl `
            --bin actinglab `
            --bin actingledger `
            --bin actingcommand-vision-provider-check `
            --bin actingcommand-device-test
          if ($LASTEXITCODE -ne 0) {
            throw "executable cargo build failed with exit code $LASTEXITCODE"
          }
          & cargo build --locked --release --target x86_64-pc-windows-msvc `
            --package actingcommand-ppocr-onnx-json-provider
          if ($LASTEXITCODE -ne 0) {
            throw "PP-OCR provider cargo build failed with exit code $LASTEXITCODE"
          }

      - name: Test Windows artifact tooling without provider execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = Join-Path $env:RUNNER_TEMP "actingcommand-windows-tools-$env:GITHUB_RUN_ATTEMPT"
          $testRoot = Join-Path $taskRoot 'tests'
          $processTemp = Join-Path $taskRoot 'process-temp'
          New-Item -ItemType Directory -Path $taskRoot, $processTemp -Force | Out-Null
          $env:TEMP = $processTemp
          $env:TMP = $processTemp
          & ./scripts/windows-tools/Test-WindowsRemoteBuildTools.ps1 `
            -TaskRoot $taskRoot `
            -TestRoot $testRoot `
            -VisionProviderCheckExecutable (
              Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\actingcommand-vision-provider-check.exe'
            )
          if (-not $?) {
            throw 'Windows artifact tooling tests failed'
          }

      - name: Open the previous published build's state root
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          # H3: the newest umbrella build-* pre-release whose Runtime commit is a strict
          # ancestor of this source writes a fresh state root (empty instances); this
          # build's actingd must open it, shut down cleanly, and actingledger must read it.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $umbrella = 'HS7097/ActingCommand'
          $h3Root = Join-Path $env:RUNNER_TEMP 'h3'
          $stateRoot = Join-Path $h3Root 'state'
          $configPath = Join-Path $h3Root 'actingd.config.json'
          $newDir = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release'
          New-Item -ItemType Directory -Path $h3Root -Force | Out-Null
          $daemons = [Collections.Generic.List[object]]::new()

          function Start-H3Daemon([string] $Label, [string] $Directory, [string] $Code) {
            $out = Join-Path $h3Root "$Label.out.log"
            $err = Join-Path $h3Root "$Label.err.log"
            $process = Start-Process -FilePath (Join-Path $Directory 'actingcommand-actingd.exe') `
              -ArgumentList @('--config', "`"$configPath`"") -NoNewWindow -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $process.Handle
            $daemons.Add([pscustomobject]@{ Label = $Label; Process = $process; Out = $out; Err = $err })
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline) {
              $ready = @(Get-Content -LiteralPath $out -ErrorAction SilentlyContinue |
                Where-Object { $_ -cmatch '^actingd ready pid=\d+ host=127\.0\.0\.1 port=\d+$' })
              if ($ready.Count -eq 1) {
                Write-Host "h3 $Label ready line: $($ready[0])"
                return $process
              }
              if ($process.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }
            throw "${Code}: $Label actingd printed no ready line within 60 s (exited=$($process.HasExited))"
          }

          # Returns stdout; a non-zero exit throws the code with stdout and stderr.
          function Invoke-H3Checked([string] $Code, [string] $Exe, [string[]] $Arguments) {
            $stderr = Join-Path $h3Root 'command.err.log'
            $text = (& $Exe @Arguments 2> $stderr | Out-String)
            $exit = $LASTEXITCODE
            if ($exit -ne 0) {
              $detail = Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue
              throw "${Code}: $([IO.Path]::GetFileName($Exe)) $($Arguments -join ' ') exited $exit`n$text$detail"
            }
            return $text
          }

          # status, request-shutdown --wait 60 (completed), then exit 0 within 30 s.
          function Stop-H3Daemon($Process, [string] $Label, [string] $Directory, [string] $StatusCode, [string] $ShutdownCode) {
            $ctl = Join-Path $Directory 'actingctl.exe'
            $status = Invoke-H3Checked $StatusCode $ctl @('status', '--state-root', $stateRoot)
            Write-Host "h3 $Label actingctl status: exit 0 ($($status.Length) bytes)"
            $text = Invoke-H3Checked $ShutdownCode $ctl @('request-shutdown', '--state-root', $stateRoot, '--wait', '60')
            Write-Host "h3 $Label request-shutdown: $($text.Trim())"
            if (($text | ConvertFrom-Json).shutdown.state -cne 'completed') {
              throw "${ShutdownCode}: $Label request-shutdown did not report completed"
            }
            if (-not $Process.WaitForExit(30000)) {
              throw "${ShutdownCode}: $Label actingd did not exit within 30 s after shutdown"
            }
            if ($Process.ExitCode -ne 0) {
              throw "${ShutdownCode}: $Label actingd exited $($Process.ExitCode)"
            }
            Write-Host "h3 $Label actingd exited 0"
          }

          try {
            # 1. The newest build-* pre-release whose runtime_sha is a strict ancestor of this source.
            $listing = & gh release list --repo $umbrella --exclude-drafts --limit 30 --json tagName,createdAt,publishedAt
            if ($LASTEXITCODE -ne 0) {
              throw "h3_previous_release_missing: gh release list exited $LASTEXITCODE"
            }
            $releases = @(($listing | Out-String | ConvertFrom-Json) |
              Where-Object { $_.tagName -cmatch '\Abuild-r[0-9a-f]{7}-u[0-9a-f]{7}\z' } |
              Sort-Object -Property publishedAt, createdAt -Descending)
            $selected = $null
            foreach ($release in $releases) {
              $dir = Join-Path $h3Root $release.tagName
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
              & gh release download $release.tagName --repo $umbrella --pattern 'MEMBERS.json' --dir $dir --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "h3_previous_release_missing: MEMBERS.json of $($release.tagName) not downloaded (exit $LASTEXITCODE)"
              }
              $runtimeSha = [string](Get-Content -LiteralPath (Join-Path $dir 'MEMBERS.json') -Raw |
                ConvertFrom-Json).runtime_sha
              if ($runtimeSha -cnotmatch '\A[0-9a-f]{40}\z') {
                throw "h3_previous_release_unverified: $($release.tagName) MEMBERS.json runtime_sha is not a full SHA"
              }
              $compare = (& gh api "repos/$env:GITHUB_REPOSITORY/compare/$runtimeSha...$env:SOURCE_SHA" --jq .status | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) {
                throw "h3_previous_release_missing: compare $runtimeSha...$env:SOURCE_SHA exited $LASTEXITCODE"
              }
              Write-Host "h3 candidate $($release.tagName) runtime_sha=$runtimeSha compare=$compare"
              if ($compare -ceq 'ahead') {
                $selected = [pscustomobject]@{ Tag = $release.tagName; RuntimeSha = $runtimeSha; Dir = $dir }
                break
              }
            }
            if ($null -eq $selected) {
              throw "h3_previous_release_missing: no build-* release has a runtime_sha that is a strict ancestor of $env:SOURCE_SHA"
            }
            Write-Host "h3 selected $($selected.Tag) runtime_sha=$($selected.RuntimeSha) compare=ahead"

            # 2. The Runtime zip against SHA256SUMS, then every file against its BUILD-MANIFEST.json.
            $zipName = "actingcommand-runtime-$($selected.RuntimeSha).zip"
            & gh release download $selected.Tag --repo $umbrella --pattern $zipName --pattern 'SHA256SUMS' --dir $selected.Dir --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "h3_previous_release_unverified: $zipName or SHA256SUMS not downloaded (exit $LASTEXITCODE)"
            }
            $sums = @(Get-Content -LiteralPath (Join-Path $selected.Dir 'SHA256SUMS') |
              Where-Object { $_ -cmatch "\A[0-9a-f]{64} [ *]$([regex]::Escape($zipName))\z" })
            $zipPath = Join-Path $selected.Dir $zipName
            if ($sums.Count -ne 1 -or
                $sums[0].Substring(0, 64) -cne (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
              throw "h3_previous_release_unverified: $zipName does not match exactly one SHA256SUMS line"
            }
            $oldDir = Join-Path $h3Root 'previous'
            Expand-Archive -LiteralPath $zipPath -DestinationPath $oldDir
            $manifest = Get-Content -LiteralPath (Join-Path $oldDir 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json
            if ($manifest.repository -cne $env:GITHUB_REPOSITORY -or $manifest.commit_sha -cne $selected.RuntimeSha) {
              throw "h3_previous_release_unverified: BUILD-MANIFEST.json names $($manifest.repository)@$($manifest.commit_sha)"
            }
            $listed = @($manifest.files | ForEach-Object { [string]$_.path })
            foreach ($required in @('actingcommand-actingd.exe', 'actingctl.exe', 'actingd.config.example.json')) {
              if ($listed -cnotcontains $required) {
                throw "h3_previous_release_unverified: BUILD-MANIFEST.json does not list $required"
              }
            }
            foreach ($file in $manifest.files) {
              $path = Join-Path $oldDir ([string]$file.path)
              if ([string]$file.path -cnotmatch '\A[A-Za-z0-9._-]+\z' -or
                  -not (Test-Path -LiteralPath $path -PathType Leaf) -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$file.sha256) {
                throw "h3_previous_release_unverified: $($file.path) does not match BUILD-MANIFEST.json"
              }
            }
            Write-Host "h3 verified $zipName (SHA256SUMS, BUILD-MANIFEST.json, $($listed.Count) files)"

            # 3. The release's example configuration with a fresh state root and salt; no instances.
            $config = Get-Content -LiteralPath (Join-Path $oldDir 'actingd.config.example.json') -Raw | ConvertFrom-Json
            if (@($config.instances).Count -ne 0) {
              throw "h3_previous_release_unverified: the example configuration declares instances"
            }
            $salt = [byte[]]::new(32)
            [Security.Cryptography.RandomNumberGenerator]::Fill($salt)
            $config.state_root = $stateRoot
            $config.secret_fingerprint_salt = [Convert]::ToHexString($salt).ToLowerInvariant()
            [IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))

            # 4. The previous build writes the root.
            $previous = Start-H3Daemon 'previous' $oldDir 'h3_previous_daemon_not_ready'
            Stop-H3Daemon $previous 'previous' $oldDir 'h3_previous_daemon_not_ready' 'h3_previous_shutdown_failed'

            # 5. This build opens it; then this build's actingledger reads it.
            $current = Start-H3Daemon 'new' $newDir 'h3_new_daemon_open_failed'
            Stop-H3Daemon $current 'new' $newDir 'h3_new_daemon_open_failed' 'h3_new_shutdown_failed'
            $ledger = Join-Path $newDir 'actingledger.exe'
            $events = Invoke-H3Checked 'h3_new_ledger_read_failed' $ledger @('--state-root', $stateRoot, 'events', '--limit', '10')
            $report = $events | ConvertFrom-Json
            $through = $report.data.through_sequence
            if ($report.command -cne 'events' -or -not ($through -is [long] -or $through -is [int]) -or $through -lt 1) {
              throw "h3_new_ledger_read_failed: events reported no positive through_sequence"
            }
            Write-Host "h3 actingledger events --limit 10: exit 0, through_sequence=$through`n$($events.Trim())"
            $facts = Invoke-H3Checked 'h3_new_ledger_read_failed' $ledger @('--state-root', $stateRoot, 'facts', '--at', "$through")
            Write-Host "h3 actingledger facts --at ${through}: exit 0`n$($facts.Trim())"
          } catch {
            foreach ($daemon in $daemons) {
              foreach ($log in @($daemon.Out, $daemon.Err)) {
                Write-Host "---- tail of $log"
                Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue | Write-Host
              }
            }
            throw
          } finally {
            foreach ($daemon in $daemons) {
              if (-not $daemon.Process.HasExited) {
                Write-Host "h3 stopping $($daemon.Label) actingd pid $($daemon.Process.Id) after failure"
                Stop-Process -Id $daemon.Process.Id -Force -ErrorAction Continue
              }
            }
          }

      - name: Stage exact-SHA artifacts and manifests
        id: stage
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TREE_SHA: ${{ steps.checkout.outputs.tree_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetTriple = 'x86_64-pc-windows-msvc'
          $profile = 'release'
          $buildDir = Join-Path $PWD "target\$targetTriple\$profile"
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'actingcommand-windows-build-artifacts'
          $runtimeArtifactName = "actingcommand-runtime-$env:SOURCE_SHA"
          $toolsArtifactName = "actingcommand-tools-$env:SOURCE_SHA"
          $runtimeDir = Join-Path $artifactRoot $runtimeArtifactName
          $toolsDir = Join-Path $artifactRoot $toolsArtifactName
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction Stop
          }
          New-Item -ItemType Directory -Path $runtimeDir, $toolsDir | Out-Null

          $runtimeFiles = @(
            'actingcommand-actingd.exe',
            'actingctl.exe',
            'actingd.config.example.json',
            'INSTALL.md',
            'RELEASE-NOTES.md'
          )
          $toolFiles = @(
            'actinglab.exe',
            'actingledger.exe',
            'actingcommand-vision-provider-check.exe',
            'actingcommand-device-test.exe',
            'ac_fastdeploy_ppocr.dll'
          )

          function Copy-BuildFiles {
            param(
              [Parameter(Mandatory)] [string[]] $Names,
              [Parameter(Mandatory)] [string] $Destination,
              [string] $SourceDirectory = $buildDir
            )
            foreach ($name in $Names) {
              $source = Join-Path $SourceDirectory $name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                throw "expected build output is missing or is not a file: $source"
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $Destination $name)
            }
          }

          function New-BuildManifest {
            param(
              [Parameter(Mandatory)] [string] $ArtifactName,
              [Parameter(Mandatory)] [string] $Directory,
              [Parameter(Mandatory)] [string[]] $Names,
              [switch] $RuntimeDistribution
            )
            $files = foreach ($name in $Names) {
              $path = Join-Path $Directory $name
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              [ordered]@{
                path = $name
                size_bytes = [int64]$item.Length
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
            $cargoLockSha256 = (
              Get-FileHash -LiteralPath (Join-Path $PWD 'Cargo.lock') -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $activeToolchain = ((& rustup show active-toolchain) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "rustup show active-toolchain failed with exit code $LASTEXITCODE"
            }
            $rustcVersion = ((& rustc --version --verbose) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "rustc version query failed with exit code $LASTEXITCODE"
            }
            $rustToolchain = "$activeToolchain`n$rustcVersion"
            $manifest = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit_sha = $env:SOURCE_SHA
              tree_sha = $env:TREE_SHA
              cargo_lock_sha256 = $cargoLockSha256
              rust_toolchain = $rustToolchain
              target = $targetTriple
              configuration = $profile
              workflow_run_id = [uint64]$env:GITHUB_RUN_ID
              workflow_run_attempt = [uint32]$env:GITHUB_RUN_ATTEMPT
              source_artifact_name = $ArtifactName
              files = @($files)
            }
            if ($RuntimeDistribution) {
              $manifest.runtime_payload_layout = 'distribution-v1'
            }
            $manifestPath = Join-Path $Directory 'BUILD-MANIFEST.json'
            $json = $manifest | ConvertTo-Json -Depth 6
            [IO.File]::WriteAllText(
              $manifestPath,
              "$json`n",
              [Text.UTF8Encoding]::new($false)
            )
          }

          Copy-BuildFiles -Names @('actingcommand-actingd.exe', 'actingctl.exe') -Destination $runtimeDir
          Copy-BuildFiles -Names @(
            'actingd.config.example.json',
            'INSTALL.md',
            'RELEASE-NOTES.md'
          ) -SourceDirectory (Join-Path $PWD 'distribution/windows') -Destination $runtimeDir
          Copy-BuildFiles -Names @(
            'actinglab.exe',
            'actingledger.exe',
            'actingcommand-vision-provider-check.exe',
            'actingcommand-device-test.exe'
          ) -Destination $toolsDir
          $providerSource = Join-Path $buildDir 'actingcommand_ppocr_onnx_json_provider.dll'
          if (-not (Test-Path -LiteralPath $providerSource -PathType Leaf)) {
            throw "expected PP-OCR provider output is missing: $providerSource"
          }
          if ((Get-Item -LiteralPath $providerSource -ErrorAction Stop).Length -le 0) {
            throw "expected PP-OCR provider output is empty: $providerSource"
          }
          Copy-Item -LiteralPath $providerSource -Destination (
            Join-Path $toolsDir 'ac_fastdeploy_ppocr.dll'
          )
          New-BuildManifest `
            -ArtifactName $runtimeArtifactName `
            -Directory $runtimeDir `
            -Names $runtimeFiles `
            -RuntimeDistribution
          New-BuildManifest `
            -ArtifactName $toolsArtifactName `
            -Directory $toolsDir `
            -Names $toolFiles

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_artifact_name=$runtimeArtifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_artifact_dir=$runtimeDir"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tools_artifact_name=$toolsArtifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tools_artifact_dir=$toolsDir"

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.runtime_artifact_name }}
          path: ${{ steps.stage.outputs.runtime_artifact_dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Tools artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.tools_artifact_name }}
          path: ${{ steps.stage.outputs.tools_artifact_dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
