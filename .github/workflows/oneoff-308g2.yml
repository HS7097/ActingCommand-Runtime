name: one-off 308 G2 (to be reverted)

# One-off evidence for Workflow #308 G2 (model section 6, GC2). The control group is the PR's
# exact merge-base a03ef172, built and run in the same job as the PR head with the same one-off
# file. Reverted right after its run; the PR's final diff contains neither this file nor
# one-off-308g2/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gc2:
    name: GC2 control a03ef172 and head
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CONTROL_SHA: a03ef172751250cef02866f95d10cdf953526050
    steps:
      - name: Check out the control commit (merge-base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: a03ef172751250cef02866f95d10cdf953526050
          path: control
          persist-credentials: false
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Product diff against the merge-base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "head $((& git -C head rev-parse HEAD).Trim()) merge-base $((& git -C head merge-base $env:CONTROL_SHA HEAD).Trim())"
          & git -C head diff --stat $env:CONTROL_SHA HEAD -- . ':(exclude)one-off-308g2' ':(exclude).github/workflows/oneoff-308g2.yml' | ForEach-Object { Write-Host "PRODUCT $_" }
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
      - name: Head run
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'head/one-off-308g2/one_off_308g2.rs' -Destination 'head/crates/execution-kernel/tests/one_off_308g2.rs'
          Push-Location head
          & cargo test --locked -p actingcommand-execution-kernel --test one_off_308g2 -- --nocapture --test-threads=1 | Tee-Object -FilePath ../head.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "head one-off failed with exit code $code" }
      - name: Control run
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "control at $((& git -C control rev-parse HEAD).Trim())"
          Copy-Item -LiteralPath 'head/one-off-308g2/one_off_308g2.rs' -Destination 'control/crates/execution-kernel/tests/one_off_308g2.rs'
          Push-Location control
          & cargo test --locked -p actingcommand-execution-kernel --test one_off_308g2 -- --nocapture --test-threads=1 | Tee-Object -FilePath ../control.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "control one-off failed with exit code $code" }
      - name: Compare control and head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($label in @('control', 'head')) {
            Get-Content -LiteralPath "$label.log" | Where-Object { $_.StartsWith('G2|') } | ForEach-Object { Write-Host "$($label.ToUpper()) $_" }
          }
          $control = @(Get-Content -LiteralPath 'control.log' | Where-Object { $_.StartsWith('G2|C2 ') -or $_.StartsWith('G2|bundle=') })
          $head = @(Get-Content -LiteralPath 'head.log' | Where-Object { $_.StartsWith('G2|C2 ') -or $_.StartsWith('G2|bundle=') })
          Write-Host "COMPARE C2 control=$($control.Count) head=$($head.Count)"
          $different = 0
          $count = [Math]::Max($control.Count, $head.Count)
          for ($index = 0; $index -lt $count; $index++) {
            $left = if ($index -lt $control.Count) { $control[$index] } else { '<none>' }
            $right = if ($index -lt $head.Count) { $head[$index] } else { '<none>' }
            if ($left -ceq $right) { Write-Host "MATCH $right" } else { $different++; Write-Host "DIFF control: $left"; Write-Host "DIFF head:    $right" }
          }
          Write-Host "COMPARE C2 different=$different"
