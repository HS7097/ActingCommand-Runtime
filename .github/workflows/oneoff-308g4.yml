name: one-off 308 G4 host select record refusal (to be reverted)

# One-off evidence for the Workflow #308 G4 host fix: a fatal confirmation capture of a select
# step through the runtime host, on a manual task run and on a scheduled policy run, with and
# without the select record refused by an expired deadline. Runs on the PR head only; reverted
# right after its run, so the PR's final diff contains neither this file nor one-off-308g4/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host-select-record:
    name: G4 host select record on head
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Head run
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "head $((& git -C head rev-parse HEAD).Trim())"
          Copy-Item -LiteralPath 'head/one-off-308g4/one_off_308g4_host.rs' -Destination 'head/crates/runtime-host/src/tests/one_off_308g4.rs'
          Add-Content -LiteralPath 'head/crates/runtime-host/src/tests.rs' -Value 'mod one_off_308g4;'
          Push-Location head
          & cargo test --locked -p actingcommand-runtime-host --lib one_off_308g4 -- --nocapture --test-threads=1 | Tee-Object -FilePath ../head.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "one-off failed with exit code $code" }
          $lines = @(Get-Content -LiteralPath 'head.log' | Where-Object { $_.Contains('G4H|') })
          Write-Host "G4H lines=$($lines.Count)"
          if ($lines.Count -eq 0) { throw "the one-off printed no G4H line" }
