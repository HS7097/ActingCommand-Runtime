name: one-off 308 G4 (to be reverted)

# One-off evidence for Workflow #308 G4 (model section 6, GC4). The control group is the PR's
# exact merge-base 7d24d53e, built and run in the same job as the PR head with the same control
# file; the GC4 file runs on the head only. Reverted right after its run; the PR's final diff
# contains neither this file nor one-off-308g4/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gc4:
    name: GC4 control 7d24d53e and head
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CONTROL_SHA: 7d24d53e2d8e0412cf5d9953f07f6449be260971
    steps:
      - name: Check out the control commit (merge-base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 7d24d53e2d8e0412cf5d9953f07f6449be260971
          path: control
          persist-credentials: false
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Product diff against the merge-base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "head $((& git -C head rev-parse HEAD).Trim()) merge-base $((& git -C head merge-base $env:CONTROL_SHA HEAD).Trim())"
          & git -C head diff --stat $env:CONTROL_SHA HEAD -- . ':(exclude)one-off-308g4' ':(exclude).github/workflows/oneoff-308g4.yml' | ForEach-Object { Write-Host "PRODUCT $_" }
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
      - name: Head GC4 run
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'head/one-off-308g4/one_off_308g4.rs' -Destination 'head/crates/lab/tests/one_off_308g4.rs'
          Copy-Item -LiteralPath 'head/one-off-308g4/one_off_308g4_control.rs' -Destination 'head/crates/lab/tests/one_off_308g4_control.rs'
          Push-Location head
          & cargo test --locked -p actingcommand-lab --test one_off_308g4 -- --nocapture --test-threads=1 | Tee-Object -FilePath ../head-gc4.log
          $code = $LASTEXITCODE
          & cargo test --locked -p actingcommand-lab --test one_off_308g4_control -- --nocapture --test-threads=1 | Tee-Object -FilePath ../head-control.log
          $control = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "head GC4 one-off failed with exit code $code" }
          if ($control -ne 0) { throw "head control one-off failed with exit code $control" }
      - name: Control run
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "control at $((& git -C control rev-parse HEAD).Trim())"
          Copy-Item -LiteralPath 'head/one-off-308g4/one_off_308g4_control.rs' -Destination 'control/crates/lab/tests/one_off_308g4_control.rs'
          Push-Location control
          & cargo test --locked -p actingcommand-lab --test one_off_308g4_control -- --nocapture --test-threads=1 | Tee-Object -FilePath ../control.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "control one-off failed with exit code $code" }
      - name: Compare control and head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $control = @(Get-Content -LiteralPath 'control.log' | Where-Object { $_.StartsWith('G4C|') })
          $head = @(Get-Content -LiteralPath 'head-control.log' | Where-Object { $_.StartsWith('G4C|') })
          Write-Host "COMPARE control=$($control.Count) head=$($head.Count)"
          $different = 0
          $count = [Math]::Max($control.Count, $head.Count)
          for ($index = 0; $index -lt $count; $index++) {
            $left = if ($index -lt $control.Count) { $control[$index] } else { '<none>' }
            $right = if ($index -lt $head.Count) { $head[$index] } else { '<none>' }
            if ($left -ceq $right) { Write-Host "MATCH $right" } else { $different++; Write-Host "DIFF control: $left"; Write-Host "DIFF head:    $right" }
          }
          Write-Host "COMPARE different=$different"
