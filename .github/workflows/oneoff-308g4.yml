name: one-off 308 G4 fatal confirmation capture (to be reverted)

# One-off evidence for the Workflow #308 G4 review fix: a fatal failure of the runtime's
# confirmation capture still records the decision. Runs on the PR head only; reverted right
# after its run, so the PR's final diff contains neither this file nor one-off-308g4/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fatal-capture:
    name: G4 fatal confirmation capture on head
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Head run
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "head $((& git -C head rev-parse HEAD).Trim())"
          Copy-Item -LiteralPath 'head/one-off-308g4/one_off_308g4.rs' -Destination 'head/crates/lab/tests/one_off_308g4.rs'
          Push-Location head
          & cargo test --locked -p actingcommand-lab --test one_off_308g4 -- --nocapture --test-threads=1 | Tee-Object -FilePath ../head.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "one-off failed with exit code $code" }
          $lines = @(Get-Content -LiteralPath 'head.log' | Where-Object { $_.Contains('G4F|') })
          Write-Host "G4F lines=$($lines.Count)"
          if ($lines.Count -eq 0) { throw "the one-off printed no G4F line" }
