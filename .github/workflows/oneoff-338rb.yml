name: one-off 338 Rb (to be reverted)

# One-off evidence for Workflow #338 slice Rb (frozen model 5978610792, section six, row Rb):
# the host's conditional resume (match, revision mismatch, epoch mismatch), the read-only
# ResourceTargetView on the fixture catalog contracts/scheduling/examples/catalog-a with the
# ledger position around the views, and the client paths, where the older daemon is EMULATED by a
# proxy applying the a9a1845d decoder's rule (its ResumeScheduling has only `scope`, its
# RuntimeOperation denies unknown fields, it has no ResourceTargetView). The test sources live in
# one-off-338rb/ and are copied into place only inside this job. Reverted right after its run; the
# PR's final diff contains neither this file nor one-off-338rb/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rb:
    name: Rb conditional resume, ResourceTargetView and old-daemon evidence
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PRODUCT_SHA: c11f68f3fab637d2b3269a8b8e45086d7aae24d0
      BASE_SHA: 9619265b1014e638de521561075cddb191b37bef
      OLD_SHA: a9a1845dcd12c5f179e7630d1585517ce11c6815
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope and the baseline decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          Write-Host "RB|SCOPE|head $head product $env:PRODUCT_SHA base $env:BASE_SHA"
          $diff = @(& git diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-338rb' ':(exclude).github/workflows/oneoff-338rb.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git merge-base --is-ancestor $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the base $env:BASE_SHA is not an ancestor of $env:PRODUCT_SHA" }
          $changed = @(& git diff --name-only $env:BASE_SHA $env:PRODUCT_SHA | Where-Object { $_ })
          Write-Host "RB|SCOPE|product files changed from base: $($changed -join ', ')"
          $manifests = @($changed | Where-Object { $_ -like '*Cargo.toml' -or $_ -eq 'Cargo.lock' })
          Write-Host "RB|SCOPE|Cargo.lock and Cargo.toml files changed: $($manifests.Count)"
          if ($manifests.Count -ne 0) { throw "manifests changed: $($manifests -join ', ')" }
          $ledger = @(& git grep -n -E 'RuntimeOperation|RuntimeResult' $env:PRODUCT_SHA -- crates/ledger | Where-Object { $_ })
          Write-Host "RB|SCOPE|ledger crate references to RuntimeOperation/RuntimeResult: $($ledger.Count)"
          $old = & git show "${env:OLD_SHA}:crates/actingcommand-contract/src/runtime.rs"
          $enumLine = [array]::IndexOf($old, ($old | Where-Object { $_ -match '^pub enum RuntimeOperation' } | Select-Object -First 1))
          Write-Host "RB|BASELINE|a9a1845d RuntimeOperation attributes: $($old[$enumLine - 1].Trim())"
          $resume = [array]::IndexOf($old, ($old | Where-Object { $_ -match '^\s+ResumeScheduling \{' } | Select-Object -First 1))
          Write-Host "RB|BASELINE|a9a1845d ResumeScheduling: $(($old[$resume..($resume + 2)] | ForEach-Object { $_.Trim() }) -join ' ')"
          Write-Host "RB|BASELINE|a9a1845d ResourceTargetView mentions: $(@($old | Where-Object { $_ -match 'ResourceTargetView' }).Count)"
      - name: Host - ResourceTargetView and conditional resume
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'one-off-338rb/host_rb.rs' -Destination 'crates/runtime-host/src/tests/oneoff_338rb.rs'
          Add-Content -LiteralPath 'crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_338rb;"
          $log = Join-Path $env:RUNNER_TEMP 'host.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_338rb -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'RB\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "host evidence failed with exit code $code"
          }
      - name: Client - conditional resume and the emulated baseline daemon
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path 'crates/runtime-client/src/tests' | Out-Null
          Copy-Item -LiteralPath 'one-off-338rb/client_rb.rs' -Destination 'crates/runtime-client/src/tests/oneoff_338rb.rs'
          Add-Content -LiteralPath 'crates/runtime-client/src/tests.rs' -Value "`nmod oneoff_338rb;"
          $log = Join-Path $env:RUNNER_TEMP 'client.log'
          $ErrorActionPreference = 'Continue'
          & cargo test --locked -p actingcommand-runtime-client --lib oneoff_338rb -- --nocapture --test-threads=1 *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log | Where-Object { $_ -match 'RB\||^test |test result|panicked|error(\[|:)' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content -LiteralPath $log -Tail 200 | ForEach-Object { Write-Host $_ }
            throw "client evidence failed with exit code $code"
          }
