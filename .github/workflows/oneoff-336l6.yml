name: one-off 336 L6 (to be reverted)

# One-off evidence for Workflow #336 L6 (R16-R20 amendment 5955585460 "L6" items 1-10, rulings
# R21-R22, the R24 L6 additions, R25). The new binaries are the Windows exact-SHA build artifacts
# of the product commit, the old ones the Runtime v0.9.0 release assets (885947c9). Fixture runs
# use small hand-written 64x36 directory packages (scheduled dispatches); compare_failure_frames
# runs as a kernel test on synthesized 1280x720 frames; the settlement of application and adb
# failures runs in process on the runtime-host fake physical provider. Reverted right after its
# run; the PR's final diff contains neither this file nor one-off-336l6/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l6:
    name: L6 failure identity and suspension evidence
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      PRODUCT_SHA: 31c18b59585333c47be16f70a98767e7fc29ec22
      BASE_SHA: e2b8363de3cb15129b57dfec71e33796c86d56b7
      OLD_SHA: 885947c90dd6561d6e5c9b7bae3fe736ec36f7c8
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L6|SCOPE|head $head product $env:PRODUCT_SHA base $env:BASE_SHA old $env:OLD_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l6' ':(exclude).github/workflows/oneoff-336l6.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the base $env:BASE_SHA is not an ancestor of $env:PRODUCT_SHA" }
      - name: Inputs (v0.9.0 release and product exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Repository, [string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$Repository/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Repository $Tag $name does not match SHA256SUMS" }
              Write-Host "L6|INPUT|$Repository $Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L6|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          function Get-Build([string] $Sha, [string] $Dir, [string[]] $Kinds) {
            $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $Sha --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $Sha" }
            Write-Host "L6|INPUT|exact-SHA build run $runId for $Sha"
            foreach ($kind in $Kinds) {
              & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$Sha" -D (Join-Path $Dir $kind)
              if ($LASTEXITCODE -ne 0) { throw "$kind artifact download for $Sha failed with exit code $LASTEXITCODE" }
              Test-Manifest (Join-Path $Dir $kind) $Sha
            }
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'HS7097/ActingCommand-Runtime' 'v0.9.0' @("actingcommand-runtime-$env:OLD_SHA.zip", "actingcommand-tools-$env:OLD_SHA.zip") (Join-Path $root 'old-release')
          Expand-Archive -LiteralPath (Join-Path $root "old-release/actingcommand-runtime-$env:OLD_SHA.zip") -DestinationPath (Join-Path $root 'old/runtime')
          Expand-Archive -LiteralPath (Join-Path $root "old-release/actingcommand-tools-$env:OLD_SHA.zip") -DestinationPath (Join-Path $root 'old/tools')
          Test-Manifest (Join-Path $root 'old/runtime') $env:OLD_SHA
          Test-Manifest (Join-Path $root 'old/tools') $env:OLD_SHA
          Get-Build $env:PRODUCT_SHA (Join-Path $root 'new') @('runtime', 'tools')
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Static (zero change outside the slice)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l6/evidence.py static head $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "static failed with exit code $LASTEXITCODE" }
      - name: compare_failure_frames on synthesized 1280x720 frames (item 2)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $frames = Join-Path $env:RUNNER_TEMP 'frames'
          & python head/one-off-336l6/evidence.py frames $frames
          if ($LASTEXITCODE -ne 0) { throw "frames failed with exit code $LASTEXITCODE" }
          Copy-Item -LiteralPath 'head/one-off-336l6/kernel_frames.rs' -Destination 'head/crates/execution-kernel/tests/oneoff_336l6_frames.rs' -Force
          $env:ONEOFF_L6_FRAMES = $frames
          Push-Location head
          & cargo test --locked -p actingcommand-execution-kernel --test oneoff_336l6_frames -- --nocapture > (Join-Path $env:RUNNER_TEMP 'frames.log')
          $code = $LASTEXITCODE
          Pop-Location
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'frames.log') | Where-Object { $_ -match 'FRAMES\||^test |test result|panicked' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "kernel frames test failed with exit code $code" }
          & python head/one-off-336l6/evidence.py frames-check $frames (Join-Path $env:RUNNER_TEMP 'frames.log')
          if ($LASTEXITCODE -ne 0) { throw "frames check failed with exit code $LASTEXITCODE" }
      - name: Scheduled settlement of application and adb failures on the fake physical provider (R25)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'head/one-off-336l6/host_l6.rs' -Destination 'head/crates/runtime-host/src/tests/oneoff_336l6.rs'
          Add-Content -LiteralPath 'head/crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_336l6;"
          Push-Location head
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_336l6 -- --nocapture --test-threads=1 > (Join-Path $env:RUNNER_TEMP 'host.log')
          $code = $LASTEXITCODE
          Pop-Location
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'host.log') | ForEach-Object {
            $line = $_
            if ($line.Length -gt 2500) { $line = $line.Substring(0, 2500) + '...' }
            if ($line -match 'HOST\|' -or $line -match '^test |test result|panicked|error\[') { Write-Host $line }
          }
          if ($code -ne 0) { throw "fake physical provider runs failed with exit code $code" }
      - name: Prepare packages and frames
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l6/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Fixture runs, actingd suspended and ledgers (items 1-10)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-336l6/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'old/runtime') (Join-Path $root 'old/tools') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
