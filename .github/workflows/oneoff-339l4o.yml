name: one-off 339 L4o (to be reverted)

# One-off evidence for Workflow #339 L4o (frozen model 5959674074 section 6.4 "L4 evidence" with
# sections 2.5 and 4.7): record stop generates optional steps and runs their self-checks. The
# binaries are the Windows exact-SHA build artifacts of the product commit and of the L4 base
# a4cf27ef (build run 37104213098). Frames are synthetic, built from the assets of the BA
# notice_home and battle_auto_enable packs of the public umbrella v0.9.0 standard package.
# Reverted right after its run; the PR's final diff contains neither this file nor
# one-off-339l4o/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l4o:
    name: L4o optional step generation evidence
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRODUCT_SHA: cf65ef8ccfdd2e377c09283ba0f834bf2d2d97cf
      L4_SHA: a4cf27ef38667216a15c949c23ac643cff723e71
      L4_BUILD_RUN: '37104213098'
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L4O|SCOPE|head $head product $env:PRODUCT_SHA base (L4) $env:L4_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-339l4o' ':(exclude).github/workflows/oneoff-339l4o.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:L4_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the L4 base $env:L4_SHA is not an ancestor of $env:PRODUCT_SHA" }
          & git -C head diff --stat $env:L4_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L4O|SCOPE|product $_" }
      - name: Inputs (umbrella standard package, product and L4 exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Release([string] $Repository, [string] $Tag, [string[]] $Names, [string] $Dir) {
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            foreach ($name in @($Names) + 'SHA256SUMS') {
              Invoke-WebRequest -Uri "https://github.com/$Repository/releases/download/$Tag/$name" -OutFile (Join-Path $Dir $name)
            }
            $sums = Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS')
            foreach ($name in $Names) {
              $line = @($sums | Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($name))$" })
              $actual = Get-Sha (Join-Path $Dir $name)
              if ($line.Count -ne 1 -or -not $line[0].StartsWith($actual)) { throw "$Repository $Tag $name does not match SHA256SUMS" }
              Write-Host "L4O|INPUT|$Repository $Tag $name sha256 $actual matches SHA256SUMS"
            }
          }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L4O|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          $root = $env:RUNNER_TEMP
          Get-Release 'HS7097/ActingCommand' 'v0.9.0' @('bluearchive-resources-193cfdd.zip') (Join-Path $root 'umbrella')
          $runId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $env:PRODUCT_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw "no successful exact-SHA build run for $env:PRODUCT_SHA" }
          Write-Host "L4O|INPUT|exact-SHA build run $runId for $env:PRODUCT_SHA"
          foreach ($kind in @('runtime', 'tools')) {
            & gh run download $runId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$env:PRODUCT_SHA" -D (Join-Path $root "new/$kind")
            if ($LASTEXITCODE -ne 0) { throw "$kind artifact download failed with exit code $LASTEXITCODE" }
            Test-Manifest (Join-Path $root "new/$kind") $env:PRODUCT_SHA
          }
          & gh run download $env:L4_BUILD_RUN -R $env:GITHUB_REPOSITORY -n "actingcommand-tools-$env:L4_SHA" -D (Join-Path $root 'l4/tools')
          if ($LASTEXITCODE -ne 0) { throw "L4 tools artifact download failed with exit code $LASTEXITCODE" }
          Test-Manifest (Join-Path $root 'l4/tools') $env:L4_SHA
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Prepare synthetic frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-339l4o/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work') (Join-Path $env:RUNNER_TEMP 'umbrella/bluearchive-resources-193cfdd.zip')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Evidence (L4o)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-339l4o/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/tools') (Join-Path $root 'new/runtime') (Join-Path $root 'l4/tools') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
