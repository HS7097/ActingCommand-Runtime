name: CI

# Test plan v2.2 §1 (Batch 0a): one lint job, seven module test jobs and the ubuntu summary job
# `gate`, whose check name stays `rust`. Each module job compiles its selection once
# (`--no-run`), then runs it with the same selection and features.
#
# One-line forms (`gate_ci_jobs_cover_every_member` in
# tools/actinglab-architecture/tests/gate_map.rs reads them without a YAML parser):
# - `CI_PACKAGES: -p <package> ...`: the job's test selection; every workspace member is in
#   exactly one module job.
# - `CI_SKIP: <libtest path> ...`: the registered flaky tests of ci/flaky-tests.toml (board
#   issue #71) that the job's packages hold; `''` when it holds none.
# - `needs: [...]` of `gate`: every job except `gate` and the non-gating `flaky`.
# - `FLAKY_TESTS: <package>::<target>::<libtest path>[@<features>] ...` of `flaky`.
#
# A push to main runs only the five jobs that save a dependency cache (lint, light, exec-core,
# exec-tooling, apps); pull requests and pushes to stable run every job.

on:
  push:
    branches: [main, stable]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Test plan §1.2: faster links and smaller PDBs; backtraces keep their files and lines.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: lint
          save: 'true'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build locked workspace
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

  light:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI_PACKAGES: -p actingcommand-outcome-guard -p actingcommand-actinglab-architecture -p actingcommand-contract -p actingcommand-scheduler -p actingcommand-policy -p actingcommand-selection-policy
      CI_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: light
          save: 'true'
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build failed with exit code $LASTEXITCODE"
          }
      - name: Test
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          cargo test --locked --no-fail-fast @selection -- @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results "$env:GITHUB_JOB.log")
          if ($LASTEXITCODE -ne 0) {
            throw "$env:GITHUB_JOB tests failed with exit code $LASTEXITCODE"
          }
      # Workflow #378: regenerate the merged outcome catalog whenever the Test step ran, pass or
      # fail (G9 fails on the first push of a fragment change by design), and upload it for the
      # pushed head; the implementer commits that artifact unchanged. It runs after every test
      # step, so no test rebuilds against the regenerated file.
      - name: Outcome catalog merge
        id: outcome_merge
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo run --locked -p actingcommand-outcome-guard --bin outcome-guard -- merge
          if ($LASTEXITCODE -ne 0) {
            throw "outcome-guard merge failed with exit code $LASTEXITCODE"
          }
      - name: Upload merged outcome catalog
        if: ${{ !cancelled() && steps.outcome_merge.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-codes-${{ github.event.pull_request.head.sha || github.sha }}
          path: contracts/outcome-codes.json
          if-no-files-found: error
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  exec-core:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI_PACKAGES: -p actingcommand-recognition -p actingcommand-recognition-pack -p actingcommand-page-detector -p actingcommand-vision-ffi -p actingcommand-onnx-provider-support -p actingcommand-ppocr-onnx-json-provider -p actingcommand-device -p actingcommand-execution-kernel -p actingcommand-pack-containment
      CI_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      # Its own family (test plan §1.2): `mid`, saved by exec-tooling, lacks ort, trybuild and
      # this selection's feature set, so a warm exec-core run on `mid` still compiled 58
      # third-party crates (run 37932458391).
      - uses: ./.github/actions/rust-setup
        with:
          family: exec-core
          save: 'true'
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build failed with exit code $LASTEXITCODE"
          }
      - name: Test
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          cargo test --locked --no-fail-fast @selection -- @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results "$env:GITHUB_JOB.log")
          if ($LASTEXITCODE -ne 0) {
            throw "$env:GITHUB_JOB tests failed with exit code $LASTEXITCODE"
          }
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
      # pack-containment's trybuild stays here until E-1 replaces it with compile_fail doctests
      # (test plan §4 #4); this step leaves with it.
      - name: Remove trybuild cache artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath target/tests) {
            Remove-Item -LiteralPath target/tests -Recurse -Force -ErrorAction Stop
          }

  exec-tooling:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI_PACKAGES: -p actingcommand-resource-tooling -p actingcommand-lab
      CI_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: mid
          save: 'true'
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build failed with exit code $LASTEXITCODE"
          }
      - name: Test
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          cargo test --locked --no-fail-fast @selection -- @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results "$env:GITHUB_JOB.log")
          if ($LASTEXITCODE -ne 0) {
            throw "$env:GITHUB_JOB tests failed with exit code $LASTEXITCODE"
          }
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  ledger:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI_PACKAGES: -p actingcommand-ledger -p actingcommand-runtime-state -p actingcommand-runtime-database -p actingcommand-artifact-store -p actingcommand-ledger-forensics -p actingledger
      CI_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: heavy
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build failed with exit code $LASTEXITCODE"
          }
      - name: Test
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          # The ledger's forensics tests run the actingledger that the test build placed; this
          # handoff leaves with LED-R6 (test plan §4 #19).
          $env:CARGO_BIN_EXE_actingledger = (Resolve-Path -LiteralPath 'target/debug/actingledger.exe' -ErrorAction Stop).Path
          cargo test --locked --no-fail-fast @selection -- @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results "$env:GITHUB_JOB.log")
          if ($LASTEXITCODE -ne 0) {
            throw "$env:GITHUB_JOB tests failed with exit code $LASTEXITCODE"
          }
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  host-lab:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI_PACKAGES: -p actingcommand-runtime-host -p actingcommand-host-metrics -p actingcommand-actinglab
      # actinglab's dev-dependency turns it on anyway; written out so the selection says it.
      CI_FEATURES: --features actingcommand-runtime-host/fixture-backends
      CI_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: heavy
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES $env:CI_FEATURES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build failed with exit code $LASTEXITCODE"
          }
      - name: Test
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES $env:CI_FEATURES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          cargo test --locked --no-fail-fast @selection -- @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results "$env:GITHUB_JOB.log")
          if ($LASTEXITCODE -ne 0) {
            throw "$env:GITHUB_JOB tests failed with exit code $LASTEXITCODE"
          }
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  runtime-client:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI_PACKAGES: -p actingcommand-runtime-client
      CI_SKIP: tests::typed_client_discovers_runtime_and_routes_queries_and_input tests::runtime_input_proxy_renews_before_short_lease_expiry
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: heavy
      # Two configurations (test plan §4 #1), so two builds: the default features the UI ships
      # with, and `test-observation`, which adds trace code to runtime-client and runtime-host.
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build (default features) failed with exit code $LASTEXITCODE"
          }
          cargo test --locked --no-run @selection --features test-observation --lib
          if ($LASTEXITCODE -ne 0) {
            throw "test build (test-observation) failed with exit code $LASTEXITCODE"
          }
      - name: Test
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')

          # Call 1: the delivered configuration, every test, single-threaded until C-4.
          cargo test --locked --no-fail-fast @selection -- --test-threads=1 @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results 'runtime-client.log')
          $defaultExitCode = $LASTEXITCODE
          Write-Host "runtime-client (default features) exit code: $defaultExitCode"

          # Call 2: the recorder tests that exist only under the feature and the tests with
          # feature-only trace assertions. A test that gains such an assertion joins this filter
          # in the same PR.
          cargo test --locked --no-fail-fast @selection --features test-observation --lib -- test_observation:: runtime_input_proxy_renews_before_short_lease_expiry long_input_extends_only_its_response_wait --test-threads=1 @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results 'runtime-client-test-observation.log')
          $observationExitCode = $LASTEXITCODE
          Write-Host "runtime-client (test-observation) exit code: $observationExitCode"

          if ($defaultExitCode -ne 0 -or $observationExitCode -ne 0) {
            exit 1
          }
          exit 0
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  apps:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI_PACKAGES: -p actingcommand-actingd -p actingcommand-actingctl -p actingcommand-device-test -p actingcommand-vision-provider-check
      CI_SKIP: process_replay_cannot_duplicate_or_conflict_a_contained_task_terminal
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: heavy
          save: 'true'
      # Test plan §4 #3: actinglab with its production features, built once here and handed to
      # actingd's process test instead of a cargo build inside the test.
      - name: Build actinglab
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked -p actingcommand-actinglab --bin actinglab
          if ($LASTEXITCODE -ne 0) {
            throw "actinglab build failed with exit code $LASTEXITCODE"
          }
      - name: Build tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo test --locked --no-run @selection
          if ($LASTEXITCODE -ne 0) {
            throw "test build failed with exit code $LASTEXITCODE"
          }
      # The dev test profile (test plan §4 #2 retired opt-level=3). Call 1 runs the binaries' unit
      # tests in parallel; call 2 runs every integration test (process, c4_process,
      # watchdog_process, and any added later) single-threaded, each output line timestamped so
      # the gap between two lines is one test's time against its deadlines.
      - name: Test
        id: test
        shell: pwsh
        env:
          # Workflow #374: the watchdog's install test registers a real scheduled task here only.
          ACTINGCOMMAND_TEST_REGISTER_TASK: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selection = "$env:CI_PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $skip = @("$env:CI_SKIP".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--skip'; $_ })
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          $env:ACTINGCOMMAND_TEST_ACTINGLAB_EXE = (Resolve-Path -LiteralPath 'target/debug/actinglab.exe' -ErrorAction Stop).Path

          cargo test --locked --no-fail-fast @selection --bins -- @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results 'apps-bins.log')
          $binsExitCode = $LASTEXITCODE
          Write-Host "apps unit tests (--bins) exit code: $binsExitCode"

          cargo test --locked --no-fail-fast @selection --test '*' -- --test-threads=1 @skip 2>&1 |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
            Tee-Object -FilePath (Join-Path $results 'apps-integration.log')
          $integrationExitCode = $LASTEXITCODE
          Write-Host "apps integration tests (--test '*') exit code: $integrationExitCode"

          if ($binsExitCode -ne 0 -or $integrationExitCode -ne 0) {
            exit 1
          }
          exit 0
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  # D5 (Alice 10-09): runs only the registered flaky tests of ci/flaky-tests.toml, each once, and
  # uploads the results as evidence. It is not in gate.needs, so it never holds a merge.
  flaky:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      FLAKY_TESTS: actingcommand-runtime-client::lib::tests::typed_client_discovers_runtime_and_routes_queries_and_input actingcommand-runtime-client::lib::tests::runtime_input_proxy_renews_before_short_lease_expiry@test-observation actingcommand-actingctl::c4_process::process_replay_cannot_duplicate_or_conflict_a_contained_task_terminal
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          family: heavy
      - name: Flaky tests
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $results = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'test-results')
          $failed = @()
          foreach ($entry in "$env:FLAKY_TESTS".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            $selector, $features = $entry -split '@', 2
            $package, $target, $path = $selector -split '::', 3
            if (-not $path) {
              throw "FLAKY_TESTS entry '$entry' is not <package>::<target>::<libtest path>[@<features>]"
            }
            # @(...) keeps a one-element result an array: splatting a bare string passes its
            # characters one by one.
            $targetArguments = @(if ($target -eq 'lib') { '--lib' } else { '--test'; $target })
            $featureArguments = @(if ($features) { '--features'; $features })
            $log = Join-Path $results ($selector.Replace('::', '.') + '.log')
            Write-Host "=== $entry"
            cargo test --locked -p $package @targetArguments @featureArguments -- --exact $path 2>&1 |
              ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f (Get-Date), $_ } |
              Tee-Object -FilePath $log
            $exitCode = $LASTEXITCODE
            $ran = @(Select-String -LiteralPath $log -SimpleMatch -Pattern "test $path ... ").Count
            if ($exitCode -ne 0) {
              $failed += "$entry (exit code $exitCode)"
            } elseif ($ran -ne 1) {
              $failed += "$entry (ran $ran times, expected once)"
            }
          }
          if ($failed.Count -ne 0) {
            throw ("flaky tests did not pass: " + ($failed -join '; '))
          }
      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.job }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error

  # The summary check. Its check name stays `rust`, the required check of `runtime-main-quality`.
  gate:
    name: rust
    needs: [lint, light, exec-core, exec-tooling, ledger, host-lab, runtime-client, apps]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Every job is green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '[to_entries[]|select(.value.result!="success")|.key]|if length==0 then true else ("not green: "+join(", ")|halt_error(1)) end'
