name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-trybuild-clean-v1-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-trybuild-clean-v1-${{ steps.toolchain.outputs.cachekey }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build locked workspace
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: Test
        id: test
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked -p actingledger --bin actingledger
          if ($LASTEXITCODE -ne 0) {
            throw "actingledger build failed with exit code $LASTEXITCODE"
          }
          $env:CARGO_BIN_EXE_actingledger = (Resolve-Path -LiteralPath 'target/debug/actingledger.exe' -ErrorAction Stop).Path

          cargo test --workspace --exclude actingcommand-actingd --exclude actingcommand-runtime-client --no-fail-fast
          $workspaceExitCode = $LASTEXITCODE
          Write-Host "Workspace excluding actingd and runtime-client exit code: $workspaceExitCode"

          cargo test -p actingcommand-runtime-client --no-fail-fast -- --test-threads=1
          $runtimeClientExitCode = $LASTEXITCODE
          Write-Host "runtime-client package tests exit code: $runtimeClientExitCode"

          cargo test --workspace --bin actingcommand-actingd --no-fail-fast
          $actingdExitCode = $LASTEXITCODE
          Write-Host "actingd binary tests exit code: $actingdExitCode"

          cargo --config 'profile.test.opt-level=3' --config 'profile.test.debug-assertions=true' --config 'profile.test.overflow-checks=true' --config 'profile.test.debug=2' test --workspace --test process --no-fail-fast -- --test-threads=1
          $processExitCode = $LASTEXITCODE
          Write-Host "process integration tests exit code: $processExitCode"

          if ($workspaceExitCode -ne 0 -or $runtimeClientExitCode -ne 0 -or $actingdExitCode -ne 0 -or $processExitCode -ne 0) {
            exit 1
          }
          exit 0
      - name: Test observation
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked -p actingcommand-runtime-client --features test-observation --lib tests::runtime_input_proxy_renews_before_short_lease_expiry -- --exact --test-threads=1
          $heartbeatObservationExitCode = $LASTEXITCODE
          Write-Host "Heartbeat proxy observation test exit code: $heartbeatObservationExitCode"

          cargo test --locked -p actingcommand-runtime-client --features test-observation --lib tests::long_input_extends_only_its_response_wait -- --exact --test-threads=1
          $longInputObservationExitCode = $LASTEXITCODE
          Write-Host "Long input observation test exit code: $longInputObservationExitCode"

          if ($heartbeatObservationExitCode -ne 0 -or $longInputObservationExitCode -ne 0) {
            exit 1
          }
          exit 0
      - name: Remove trybuild cache artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath target/tests) {
            Remove-Item -LiteralPath target/tests -Recurse -Force -ErrorAction Stop
          }

  # One-off (to be reverted), Workflow #308 G3 evidence (model GC3).
  gc3_one_off:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: GC3 record round trip, golden hash and merge-base ledger read comparison
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          BASE_SHA: 21fa4d0bf5481aac56acfa4d2c6f69052f563578
          FEATURE_SHA: 7d1d4ed0bda490ad3db8d987cd309a82bbee6b17
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Invoke-Checked([string] $Code, [string] $Exe, [string[]] $Arguments) {
            & $Exe @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "${Code}: $Exe $($Arguments -join ' ') exited $LASTEXITCODE"
            }
          }
          function Invoke-Raw([string] $Exe, [string[]] $Arguments) {
            $info = [System.Diagnostics.ProcessStartInfo]::new($Exe)
            foreach ($argument in $Arguments) { $info.ArgumentList.Add($argument) }
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $process = [System.Diagnostics.Process]::Start($info)
            $stderr = $process.StandardError.ReadToEndAsync()
            $buffer = [System.IO.MemoryStream]::new()
            $process.StandardOutput.BaseStream.CopyTo($buffer)
            $process.WaitForExit()
            [pscustomobject]@{
              Exit = $process.ExitCode
              Stdout = $buffer.ToArray()
              Stderr = $stderr.GetAwaiter().GetResult()
            }
          }
          function Get-BytesSha256([byte[]] $Bytes) {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try { return [System.Convert]::ToHexString($sha.ComputeHash($Bytes)).ToLowerInvariant() }
            finally { $sha.Dispose() }
          }

          Write-Host "gc3 base $env:BASE_SHA feature $env:FEATURE_SHA head $env:HEAD_SHA"

          # 1. The record round trip and the golden hash, on this head.
          Invoke-Checked 'gc3_round_trip_failed' 'cargo' @('test', '--locked', '-p', 'actingcommand-ledger', '--lib', 'global::tests::gc3_one_off', '--', '--nocapture', '--test-threads=1')

          # 2. This head's actingledger.
          Invoke-Checked 'gc3_head_build_failed' 'cargo' @('build', '--locked', '-p', 'actingledger', '--bin', 'actingledger')
          $headLedger = (Resolve-Path -LiteralPath 'target/debug/actingledger.exe').Path

          # 3. The merge-base end-to-end flow keeps its state root; the merge-base actingledger.
          $base = Join-Path $env:RUNNER_TEMP 'gc3-base'
          $patch = Join-Path $env:RUNNER_TEMP 'gc3-keep-root.patch'
          $baseTarget = Join-Path $env:RUNNER_TEMP 'gc3-base-target'
          $stateRoot = Join-Path $env:RUNNER_TEMP 'gc3-state-root'
          Invoke-Checked 'gc3_base_worktree_failed' 'git' @('worktree', 'add', '--detach', $base, $env:BASE_SHA)
          Invoke-Checked 'gc3_keep_patch_failed' 'git' @('diff', "--output=$patch", $env:FEATURE_SHA, $env:HEAD_SHA, '--', 'apps/actingctl/tests/c4_process.rs')
          Invoke-Checked 'gc3_keep_patch_failed' 'git' @('-C', $base, 'apply', '--verbose', $patch)
          Push-Location -LiteralPath $base
          try {
            $env:CARGO_TARGET_DIR = $baseTarget
            $env:GC3_KEEP_STATE_ROOT = $stateRoot
            Invoke-Checked 'gc3_base_flow_failed' 'cargo' @('test', '--locked', '-p', 'actingcommand-actingctl', '--test', 'c4_process', 'actingctl_runs_neutral_contained_task_without_lab_and_runtime_survives_client_exit', '--', '--exact', '--nocapture', '--test-threads=1')
            Remove-Item -LiteralPath Env:GC3_KEEP_STATE_ROOT
            Invoke-Checked 'gc3_base_build_failed' 'cargo' @('build', '--locked', '-p', 'actingledger', '--bin', 'actingledger')
          } finally {
            Remove-Item -LiteralPath Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath Env:GC3_KEEP_STATE_ROOT -ErrorAction SilentlyContinue
            Pop-Location
          }
          $baseLedger = (Resolve-Path -LiteralPath (Join-Path $baseTarget 'debug/actingledger.exe')).Path
          Get-ChildItem -LiteralPath $stateRoot -Recurse -File | ForEach-Object {
            Write-Host "gc3 state root file $($_.FullName.Substring($stateRoot.Length)) $($_.Length) bytes"
          }

          # 4. Both actingledger builds read the same root; stdout must be byte-identical.
          $commands = [System.Collections.Generic.List[object]]::new()
          $commands.Add(@('open', @('open')))
          $commands.Add(@('events', @('events')))
          foreach ($view in @('events', 'observation', 'changes', 'errors', 'health', 'lab')) {
            $commands.Add(@("views-$view", @('views', '--query', ('{"view":"' + $view + '"}'))))
          }
          $commands.Add(@('views-events-forensic', @('views', '--query', '{"view":"events"}', '--profile', 'forensic')))
          $commands.Add(@('export', @('export')))
          $failures = 0
          $compared = 0
          $requestId = $null
          $index = 0
          while ($index -lt $commands.Count) {
            $name = $commands[$index][0]
            $arguments = @('--state-root', $stateRoot) + $commands[$index][1]
            $index += 1
            $old = Invoke-Raw $baseLedger $arguments
            $new = Invoke-Raw $headLedger $arguments
            $oldHash = Get-BytesSha256 $old.Stdout
            $newHash = Get-BytesSha256 $new.Stdout
            $same = ($oldHash -ceq $newHash) -and ($old.Exit -eq $new.Exit) -and ($old.Stderr -ceq $new.Stderr)
            Write-Host "gc3 compare ${name}: merge-base exit $($old.Exit) $($old.Stdout.Length) bytes sha256 $oldHash; head exit $($new.Exit) $($new.Stdout.Length) bytes sha256 $newHash; identical=$same"
            $text = [System.Text.Encoding]::UTF8.GetString($old.Stdout)
            Write-Host "gc3 ${name} merge-base output head: $($text.Substring(0, [Math]::Min(600, $text.Length)))"
            if ($old.Stderr.Length -gt 0 -or $new.Stderr.Length -gt 0) {
              Write-Host "gc3 ${name} stderr merge-base: $($old.Stderr.Trim()) | head: $($new.Stderr.Trim())"
            }
            $compared += 1
            if (-not $same -or $old.Exit -ne 0) { $failures += 1 }
            if ($name -ceq 'events') {
              $match = [regex]::Match($text, '"request_id"\s*:\s*"(request_[0-9a-f]{32})"')
              if (-not $match.Success) { throw 'gc3_request_id_missing: the events output names no request id' }
              $requestId = $match.Groups[1].Value
              $commands.Add(@('chain', @('chain', '--req', $requestId)))
            }
          }
          Write-Host "gc3 summary: $compared commands compared, $failures differing or failing, chain request $requestId"
          if ($failures -ne 0) { throw "gc3_outputs_differ: $failures of $compared commands" }
