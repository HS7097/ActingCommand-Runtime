name: commit-identity-guard

on:
  pull_request:
  push:
    branches:
      - main
      - stable

permissions:
  contents: read

# One group per pull request, so a new push to a pull request cancels that branch's older run;
# every push to main or stable gets its own group (the run id) and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-author-identity:
    name: verify commit author identity
    # Red-proof drafts (#411 CI-RED): a draft pull request whose head branch contains `-red-`
    # carries the main pull request's commits plus one mutation and is never merged, so the
    # check is skipped there. Every other pull request and every push run it as before.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && contains(github.event.pull_request.head.ref, '-red-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit author/committer email is a family identity
        shell: bash
        run: |
          set -euo pipefail

          # Exact allowlist: the three HS7097 family accounts (numeric and legacy
          # noreply forms) and GitHub's web committer. No personal mailbox belongs
          # here: a commit GitHub makes on its servers for an account without e-mail
          # privacy (Update branch, a web merge, a web edit) carries the account's
          # primary mailbox as its author, and this guard must refuse it.
          ALLOW='^(103177863\+HS7097@users\.noreply\.github\.com|HS7097@users\.noreply\.github\.com|310586811\+HS7097ViW@users\.noreply\.github\.com|HS7097ViW@users\.noreply\.github\.com|306820463\+HS7097Agt@users\.noreply\.github\.com|HS7097Agt@users\.noreply\.github\.com|noreply@github\.com)$'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              RANGE="${{ github.sha }} -1"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi

          echo "checking range: $RANGE"
          # Fail loud: the log is read into a variable first, so that a `git log` that fails
          # ends the step (`set -e` does not see the failure of a process substitution, and the
          # loop below would then read nothing and the step would pass). A range without a
          # commit is refused too: a pull request and a push each bring at least one.
          log="$(git log --format=$'%H\t%ae\t%ce' $RANGE)"
          if [ -z "$log" ]; then
            echo "::error::commit identity guard read no commit in the range $RANGE"
            exit 1
          fi
          bad=0
          count=0
          while IFS=$'\t' read -r sha ae ce; do
            count=$((count + 1))
            for mail in "$ae" "$ce"; do
              if ! [[ "$mail" =~ $ALLOW ]]; then
                echo "::error::commit $sha carries non-family identity: $mail"
                bad=1
              fi
            done
          done <<< "$log"

          if [ "$bad" -ne 0 ]; then
            echo "::error::commit identity guard failed: only HS7097-family no-reply identities may author or commit. Fix git user.email and amend before merge. A commit GitHub made for the account (Update branch, a web merge or edit) is redone as a local merge with the no-reply identity."
            exit 1
          fi
          echo "all $count commit identities are family identities"
