name: one-off 336 L2d (to be reverted)

# One-off evidence for Workflow #336 L2d (R16-R20 amendment 5955585460 "L2d", ruling R23, R24
# amendment 5958084341 "L2d additions"). The new binaries are the Windows exact-SHA build artifacts
# of the product commit, the base ones those of the L2c tip it is stacked on (89e57ae3, PR #600,
# build run 37101051204). Fixture runs use small hand-written 64x36 packages on the fixture backend
# (scheduled dispatches, no request binding); the request-bound home entry runs in process on the
# runtime-host fake physical provider on both trees. Reverted right after its run; the PR's final
# diff contains neither this file nor one-off-336l2d/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  l2d:
    name: L2d ladder and page-graph home entry evidence
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PRODUCT_SHA: 48cbcf06909fcbdf442265822cc2f2e9a98bcf31
      BASE_SHA: 89e57ae39770e348547f5f75fa6500da7d173014
      BASE_BUILD_RUN: '37101051204'
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git -C head rev-parse HEAD).Trim()
          Write-Host "L2D|SCOPE|head $head product $env:PRODUCT_SHA base $env:BASE_SHA"
          $diff = @(& git -C head diff --name-only $env:PRODUCT_SHA HEAD -- . ':(exclude)one-off-336l2d' ':(exclude).github/workflows/oneoff-336l2d.yml' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
          if ($diff.Count -ne 0) { throw "product files differ from ${env:PRODUCT_SHA}: $($diff -join ', ')" }
          & git -C head merge-base --is-ancestor $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "the base $env:BASE_SHA is not an ancestor of $env:PRODUCT_SHA" }
          & git -C head diff --stat $env:BASE_SHA $env:PRODUCT_SHA | ForEach-Object { Write-Host "L2D|SCOPE|product $_" }
      - name: Inputs (base and product exact-SHA artifacts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Get-Sha([string] $Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Test-Manifest([string] $Dir, [string] $Commit) {
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $Dir 'BUILD-MANIFEST.json') | ConvertFrom-Json
            if ($manifest.commit_sha -ne $Commit) { throw "$Dir BUILD-MANIFEST commit $($manifest.commit_sha) is not $Commit" }
            foreach ($file in $manifest.files) {
              if ((Get-Sha (Join-Path $Dir $file.path)) -ne $file.sha256) { throw "$Dir $($file.path) does not match BUILD-MANIFEST.json" }
            }
            Write-Host "L2D|INPUT|$Dir $($manifest.source_artifact_name) commit $($manifest.commit_sha) run $($manifest.workflow_run_id) files $(@($manifest.files).Count) verified"
          }
          function Get-Build([string] $Sha, [string] $RunId, [string] $Dir, [string[]] $Kinds) {
            if (-not $RunId) {
              $RunId = (& gh run list -R $env:GITHUB_REPOSITORY --workflow windows-remote-build.yml --commit $Sha --status success --limit 1 --json databaseId --jq '.[0].databaseId')
              if ($LASTEXITCODE -ne 0 -or -not $RunId) { throw "no successful exact-SHA build run for $Sha" }
            }
            Write-Host "L2D|INPUT|exact-SHA build run $RunId for $Sha"
            foreach ($kind in $Kinds) {
              & gh run download $RunId -R $env:GITHUB_REPOSITORY -n "actingcommand-$kind-$Sha" -D (Join-Path $Dir $kind)
              if ($LASTEXITCODE -ne 0) { throw "$kind artifact download for $Sha failed with exit code $LASTEXITCODE" }
              Test-Manifest (Join-Path $Dir $kind) $Sha
            }
          }
          $root = $env:RUNNER_TEMP
          Get-Build $env:BASE_SHA $env:BASE_BUILD_RUN (Join-Path $root 'base') @('runtime')
          Get-Build $env:PRODUCT_SHA '' (Join-Path $root 'new') @('runtime', 'tools')
          & python -m pip install --quiet --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed with exit code $LASTEXITCODE" }
      - name: Static (zero change outside the slice; change 1 / 1' diff)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l2d/evidence.py static head $env:BASE_SHA $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "static failed with exit code $LASTEXITCODE" }
      - name: Prepare packages and frames
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python head/one-off-336l2d/evidence.py prepare (Join-Path $env:RUNNER_TEMP 'work')
          if ($LASTEXITCODE -ne 0) { throw "prepare failed with exit code $LASTEXITCODE" }
      - name: Fixture runs (change 2 / 2', scheduled path)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:RUNNER_TEMP
          & python head/one-off-336l2d/evidence.py run (Join-Path $root 'work') (Join-Path $root 'new/runtime') (Join-Path $root 'new/tools') (Join-Path $root 'base/runtime') (Resolve-Path head/contracts/scheduling/examples/catalog-a).Path
          if ($LASTEXITCODE -ne 0) { throw "evidence run failed with exit code $LASTEXITCODE" }
      - name: Request-bound home entry in process (product)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath 'head/one-off-336l2d/host_same.rs' -Destination 'head/crates/runtime-host/src/tests/oneoff_336l2d_same.rs'
          Add-Content -LiteralPath 'head/crates/runtime-host/src/tests.rs' -Value "`nmod oneoff_336l2d_same;"
          Push-Location head
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_336l2d_same -- --nocapture --test-threads=1 > (Join-Path $env:RUNNER_TEMP 'host-product.log')
          $code = $LASTEXITCODE
          Pop-Location
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'host-product.log') | Where-Object { $_ -match '^test |test result|panicked|\|counts\|' } | ForEach-Object { Write-Host $_.Substring(0, [Math]::Min($_.Length, 600)) }
          if ($code -ne 0) { throw "product in-process runs failed with exit code $code" }
      - name: Request-bound home entry in process (89e57ae3) and comparison
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $source = Join-Path $env:RUNNER_TEMP 'base-source'
          & git -C head worktree add --detach $source $env:BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "worktree add failed with exit code $LASTEXITCODE" }
          Write-Host "L2D|BASE|source $((& git -C $source rev-parse HEAD).Trim())"
          Copy-Item -LiteralPath 'head/one-off-336l2d/host_same.rs' -Destination (Join-Path $source 'crates/runtime-host/src/tests/oneoff_336l2d_same.rs')
          Add-Content -LiteralPath (Join-Path $source 'crates/runtime-host/src/tests.rs') -Value "`nmod oneoff_336l2d_same;"
          $env:CARGO_TARGET_DIR = (Join-Path (Resolve-Path head).Path 'target')
          Push-Location $source
          & cargo test --locked -p actingcommand-runtime-host --lib oneoff_336l2d_same -- --nocapture --test-threads=1 > (Join-Path $env:RUNNER_TEMP 'host-base.log')
          $code = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'host-base.log') | Where-Object { $_ -match '^test |test result|panicked|\|counts\|' } | ForEach-Object { Write-Host $_.Substring(0, [Math]::Min($_.Length, 600)) }
          Pop-Location
          if ($code -ne 0) { throw "89e57ae3 in-process runs failed with exit code $code" }
          & python head/one-off-336l2d/evidence.py same (Join-Path $env:RUNNER_TEMP 'host-product.log') (Join-Path $env:RUNNER_TEMP 'host-base.log')
          if ($LASTEXITCODE -ne 0) { throw "same-facts comparison failed with exit code $LASTEXITCODE" }
