# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "actingcommand-runtime-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Fixture simulation backends (`provider/fixtures.rs`): device-free instances for actingd's
# `fixture_backend` configuration and Lab simulation; absent from every other consumer.
fixture-backends = []
test-observation = []
# Workflow #381 A (HOST-I3, LED-I3): the held-start preparation checkpoints and the ledger's
# writer stall gate, for tests in other crates.
test-hooks = ["actingcommand-ledger/test-hooks"]

[dependencies]
actingcommand-artifact-store = { workspace = true }
actingcommand-contract = { workspace = true }
actingcommand-device = { workspace = true }
actingcommand-execution-kernel = { workspace = true }
actingcommand-host-metrics = { workspace = true }
actingcommand-ledger = { workspace = true }
actingcommand-pack-containment = { workspace = true }
actingcommand-page-detector = { workspace = true }
actingcommand-policy = { workspace = true }
actingcommand-recognition-pack = { workspace = true }
actingcommand-runtime-state = { workspace = true }
actingcommand-runtime-database = { workspace = true }
actingcommand-scheduler = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Workflow #369 E3 (#670 safety net): the ledger's settlement refusal hook in host tests.
actingcommand-ledger = { workspace = true, features = ["test-hooks"] }
actingcommand-runtime-client = { workspace = true }
tempfile = "3"
zip = { workspace = true }
