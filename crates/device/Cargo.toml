# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "actingcommand-device"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# #402 step 1 (C1, plan v2.1 §3.2 item 1): the device layer's timing points for the experiment
# carrier tools/capture-bench. Off by default; without it every point is a no-op. No release
# binary enables it (tools/actinglab-architecture/tests/workspace_guards.rs).
bench-timing = []

[dependencies]
actingcommand-contract = { path = "../actingcommand-contract" }
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
# #402 RD-3: H.264 decoding for the scrcpy stream. The default `source` feature builds Cisco's
# OpenH264 from the source the crate bundles (BSD-2-Clause); no prebuilt binary is loaded.
openh264 = "0.9.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
# #402 RD-3: build.rs reads the scrcpy server pin and checks the file it embeds.
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Security", "Win32_System_RestartManager"] }
