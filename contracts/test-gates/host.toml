t the entry, and its lease end admits its block's climb from the application restart (a block set with nothing let in since the previous one ended); on away the next run's return-home package brings it to menu, its main package starts and fails on shop: no failure at the entry (no condition), and its lease end admits its ladder at once, as configured. M7 (the coordinator's addition to rulings 2 and 3; the settlement hook, two tasks, threshold 1): TASK fails at its entry, OTHER gets in after its block's end, TASK's second failure sets it aside until its window's end (instance_entry_task_set_aside after that block's end); a catalogue (version 2) in which TASK runs another package is activated: the pair is gone at once, and a second later, before the window's end, TASK is dispatched with neither instance_entry_task_set_aside nor instance_entry_task_waiting. Removed with fix round 4's ruling 1 (never on main): ENTRY-A2 (c), (d), K1 (a) to (d), K2 (a), (b). Every bounded wait in the gate file takes GATE_WAIT; no clock read in the gate file
