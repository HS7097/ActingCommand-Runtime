# RR-1 (register §1.221; production v0.12.30 on 10-30 08:4x, coordinator work order rd-1029/brief-retry-livelock.md; contracts/policy-suspension.md, "Immediate rerun (R22)"; since 0.12.31): the evaluation offers an immediate rerun only by the admission's own predicate, on the profile and expected duration its intent carries: a failed task whose round is open and whose expected duration E changed (a new run sample, or its package becoming known) is not proposed at once and the instance's other eligible candidate runs, with nothing refused; an immediate rerun the admission refuses with policy_retry_round_ended (the window ended between evaluation and admission) is withdrawn at once and refused only once, the next round runs another candidate, a later legal normal trigger opens a new round and the task runs, success still clears the round, and a restart does not resurrect the withdrawn rerun (the loaded and the replayed decision memory agree)
