# Gate map, apps fragment (test plan v2.2 §2.1; contracts/README.md, "test-gates/").
# Keys are the ids of rd-1009/tests/inventory-apps.md. One `[[gate]]` row per key with exactly
# `key`, `coverage` ("Y", or "P" = tested only on the cfg(test) Segment backend), `tests`
# (`<package>::<target>::<libtest path>`) and `incident` (a list, `[]` when none). Rows are only
# appended to; a row leaves only when its feature retires.

# Invalid configuration fails before any side effect
