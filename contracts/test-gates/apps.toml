key = "1"
coverage = "Y"
tests = [
    "actingcommand-actingd::bin:actingcommand-actingd::config::tests::unknown_config_field_is_rejected",
    "actingcommand-actingd::bin:actingcommand-actingd::config::tests::missing_application_identity_is_rejected_before_runtime_start",
    "actingcommand-actingd::bin:actingcommand-actingd::config::tests::automatic_touch_fallback_is_rejected_at_the_process_boundary",
    "actingcommand-actingd::bin:actingcommand-actingd::config::tests::automatic_capture_fallback_is_rejected_at_the_process_boundary",
    "actingcommand-actingd::bin:actingcommand-actingd::config::tests::fixture_backend_rejects_device_fields",
    "actingcommand-actingd::process::invalid_startup_returns_nonzero",
    "actingcommand-actingd::process::policy_configuration_is_refused_before_any_catalog_record",
    "actingcommand-actingd::process::actingd_rejects_explicit_fixture_simulation_on_a_physical_registry",
    "actingcommand-actingd::process::actingd_requires_package_path_for_each_explicit_scheduled_mode",
    "actingcommand-actingd::process::actingd_rejects_unknown_scheduled_execution_mode",
