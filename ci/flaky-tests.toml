# Flaky-test table, CI mirror (test plan v2.2 §2.2, Alice 10-09 D5).
#
# The register is board issue HS7097/ActingCommand-Workflow #71: FLK-01..06 in comment 6073813916,
# FLK-01/02 corrected in 6074097808, FLK-05 removed as fixed in 6073946990, FLK-07 in 6159396773.
# Only the coordinator registers an entry there; this file only mirrors it, and a change lands on
# #71 first, then here. FLK-03 (`watchdog_restarts_a_killed_runtime_through_the_fixed_entry`) and
# FLK-06 (the 500 ms process-test clients) are not mirrored: Batch 0a retired that test (§4 #8) and
# moved those clients to the production 5 s budget (§4 #11). FLK-01
# (`typed_client_discovers_runtime_and_routes_queries_and_input`) left after H-6 set its test lease
# TTL to 5 s (#71 comment 6101156993). FLK-02
# (`runtime_input_proxy_renews_before_short_lease_expiry`, its real 5.3 s wait) left when C-4
# retired it for the manual-timer heartbeat tests `tests::gate_c4` (test plan v2.2 section 4
# item 5; coordinator ruling on the seam rows, 2026-10-15).
#
# Every module job of `.github/workflows/ci.yml` passes `--skip <libtest path>` for its entries
# (its `CI_SKIP` line), and the non-gating `flaky` job runs exactly these tests, once per
# configuration (its `FLAKY_TESTS` line). `gate_ci_jobs_cover_every_member` in
# `tools/actinglab-architecture/tests/gate_map.rs` checks:
# - both lines against this file;
# - that each `name` resolves to a real `#[test]` function;
# - that each skip path matches exactly one test of its job (`--skip` matches substrings);
# - that `features` lists every configuration the module job runs the test in.
#
# Keys of each entry:
# - `id`: the register number on #71.
# - `name`: `<package>::<target>::<libtest path>`; the target is `lib`, `bin:<name>` or an
#   integration test.
# - `crate`: the package, as in `name`.
# - `job`: the module job whose selection holds the package.
# - `features`: every configuration its module job runs it in, as `--features` values ("" for
#   the job's default features); the `flaky` job runs it once in each.
# - `register`: the #71 comment that holds the entry's current state.
# - `status`: where the entry stands on #71.

[[test]]
id = "FLK-04"
name = "actingcommand-actingctl::c4_process::process_replay_cannot_duplicate_or_conflict_a_contained_task_terminal"
crate = "actingcommand-actingctl"
job = "apps"
features = [""]
register = "https://github.com/HS7097/ActingCommand-Workflow/issues/71#issuecomment-6073813916"
status = "cause not located on #71 (ConnectionReset); skipped until it is"

[[test]]
id = "FLK-07"
name = "actingcommand-runtime-host::lib::tests::capture_failure::readonly_failures_are_visible_and_terminal_without_fake_success"
crate = "actingcommand-runtime-host"
job = "host-lab"
features = ["actingcommand-runtime-host/fixture-backends"]
register = "https://github.com/HS7097/ActingCommand-Workflow/issues/71#issuecomment-6159396773"
status = "cause not located (local IPC receipt read_error under load); skipped until it is"
