# Flaky-test table, CI mirror (test plan v2.2 §2.2, Alice 10-09 D5).
#
# The register is board issue HS7097/ActingCommand-Workflow #71: FLK-01..06 in comment 6073813916,
# FLK-01/02 corrected in 6074097808, FLK-05 removed as fixed in 6073946990, FLK-07 in 6159396773.
# Only the coordinator registers an entry there; this file only mirrors it, and a change lands on
# #71 first, then here. FLK-03 (`watchdog_restarts_a_killed_runtime_through_the_fixed_entry`) and
# FLK-06 (the 500 ms process-test clients) are not mirrored: Batch 0a retired that test (§4 #8) and
# moved those clients to the production 5 s budget (§4 #11). FLK-01
# (`typed_client_discovers_runtime_and_routes_queries_and_input`) left after H-6 set its test lease
# TTL to 5 s (#71 comment 6101156993). FLK-02
# (`runtime_input_proxy_renews_before_short_lease_expiry`, its real 5.3 s wait) left when C-4
# retired it for the manual-timer heartbeat tests `tests::gate_c4` (test plan v2.2 section 4
# item 5; coordinator ruling on the seam rows, 2026-10-15). FLK-04
# (`process_replay_cannot_duplicate_or_conflict_a_contained_task_terminal`) left in TEST-FU
# (wave-17 ruling 13): its deterministic failure was PKG-S2's replay matching by package_id,
# fixed in c366b48f; from then (2026-10-14 08:02Z) to 2026-10-15 17:12Z the flaky job ran it in
# 187 CI runs and it passed 183 times, with no ConnectionReset; the other 4 were a branch-wide
# recovery_ladder_config_invalid at Runtime start (RD-2's branch and train 14 before its fix),
# which failed every Runtime test of those runs. FLK-07
# (`readonly_failures_are_visible_and_terminal_without_fake_success`) left in 6333301365: A52
# (PR #1250) made a refused close lease fail only that observe instead of latching a fatal, PR
# #1276 made the test assert the diagnostic count of the captures that reached the device, and
# draft #1277 ran it 20 times in the flaky job with 20 passes.
#
# FLK-08 (`fact_snapshot_catches_up_with_critical_ledger_events`, host-lab) entered after one red
# on PR #1537 (run 42410223015, 2026-11-08 JST): the lease request's receipt did not arrive within
# the test client's 2 s read timeout (`support/runtime.rs`, `frame_read=Idle`, no latched error).
# PR #1537's change does not cause it; in 649 CI runs over 14 days it failed only this once (about
# 297 passes), and its cause is not located.
#
# FLK-10 (`protocol_goldens_match_current_cli`, actinglab's integration test `golden_protocol`,
# host-lab) entered after one red on the v0.12.50 release PR #1562 (run 42793213181, 2026-11-10
# JST), in its case `detect_success`: "owner identity unavailable: PowerShell process inspector for
# PID ... timed out after 30000ms". `inspect_system_process`
# (`crates/lab/src/env_detection/lock.rs`) starts `powershell.exe` to read a process's start time
# with a 30 s limit, and the runner was slow. PR #1562 changes no code, and the same code passed
# this test in run 42786729275 (the head of PR #1560). Its cause is located; it stays here until
# the inspector asks the system directly. FLK-09 is not used here: the register keeps that number
# for a test of 11-02 that has not failed again, so it has no mirror entry.
#
# FLK-08 and FLK-10 are the two entries. With an empty table every module job's `CI_SKIP` is `''`
# and the `flaky` job's `FLAKY_TESTS` is `''`: that job runs nothing and passes.
#
# Every module job of `.github/workflows/ci.yml` passes `--skip <libtest path>` for its entries
# (its `CI_SKIP` line), and the non-gating `flaky` job runs exactly these tests, once per
# configuration (its `FLAKY_TESTS` line). `gate_ci_jobs_cover_every_member` in
# `tools/actinglab-architecture/tests/gate_map.rs` checks:
# - both lines against this file;
# - that each `name` resolves to a real `#[test]` function;
# - that each skip path matches exactly one test of its job (`--skip` matches substrings);
# - that `features` lists every configuration the module job runs the test in.
#
# Keys of each entry:
# - `id`: the register number on #71.
# - `name`: `<package>::<target>::<libtest path>`; the target is `lib`, `bin:<name>` or an
#   integration test.
# - `crate`: the package, as in `name`.
# - `job`: the module job whose selection holds the package.
# - `features`: every configuration its module job runs it in, as `--features` values ("" for
#   the job's default features); the `flaky` job runs it once in each.
# - `register`: the #71 comment that holds the entry's current state.
# - `status`: where the entry stands on #71.

[[test]]
id = "FLK-08"
name = "actingcommand-runtime-host::lib::tests::facts::fact_snapshot_catches_up_with_critical_ledger_events"
crate = "actingcommand-runtime-host"
job = "host-lab"
features = ["actingcommand-runtime-host/fixture-backends"]
register = "https://github.com/HS7097/ActingCommand-Workflow/issues/71#issuecomment-6713157793"
status = "cause not located (receipt read timeout under load): first failed in run 42410223015 (PR #1537, host-lab, 2026-11-08 JST), once in 649 CI runs over 14 days; skipped until it is"

[[test]]
id = "FLK-10"
name = "actingcommand-actinglab::golden_protocol::protocol_goldens_match_current_cli"
crate = "actingcommand-actinglab"
job = "host-lab"
features = ["actingcommand-runtime-host/fixture-backends"]
register = "https://github.com/HS7097/ActingCommand-Workflow/issues/71#issuecomment-6764779352"
status = "cause located (the PowerShell process inspector's 30 s limit on a slow runner): first failed in run 42793213181 (PR #1562, host-lab, 2026-11-10 JST), the same code passed in run 42786729275; skipped until the inspector asks the system directly"
