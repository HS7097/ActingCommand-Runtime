# The retirement table of the gate map contracts/test-gates/ (Alice 10-09: a retirement needs its
# mapping table).
#
# On a pull request `ci/gate_check.py check` (check name `rust`) compares the head with its merge
# base: a test name no head row holds any more, or a row `key` its fragment no longer holds, is red
# unless an entry here lists it. A name that moves to another row or fragment does not leave.
#
# One `[[retired]]` entry per name or key that leaves:
# - `fragment`: the fragment it left (`contract`, `ledger`, `host`, `policy`, `exec` or `apps`);
# - exactly one of `test` (the full `<package>::<target>::<libtest path>`) and `key` (a row's old
#   key, when the whole row leaves; its tests are listed too);
# - `ruling`: the ruling that retires it; `reason`: why it goes; `covered_by`: what covers its risk
#   now, or "none" and why.
# Entries stay after their pull request merges: this file is the table of what left the gate map.

# Workflow #420 S5 (PR #1322): the source-text architecture guards. Every guard the slice removed
# is listed with its boundary in the PR body; these are the ones the gate map held.

