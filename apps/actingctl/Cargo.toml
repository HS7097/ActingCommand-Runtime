# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "actingcommand-actingctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "actingctl"
path = "src/main.rs"

# Workflow #434 LAB-4: the watchdog's launcher actingwatch (Workflow #374) is `apps/actingwatch`,
# and it runs the tick itself.

[features]
default = ["mcp"]
# Workflow #338: `actingctl mcp-serve` / `mcp-config`. Without it the CLI is unchanged.
mcp = []

[dependencies]
actingcommand-contract = { workspace = true }
# Workflow #434 LAB-1: actingctl's read and write modules and the helpers they share (the result
# line, the codes, the instance selector, the material export, the child runner) live there.
actingcommand-lab-ops = { workspace = true }
# Workflow #434 LAB-3: `install` (with `mcp-entry`), `start`, `restart` and `agent-channel` live
# in the Lab's rescue module, which actingctl answers them from until LAB-7.
actingcommand-lab-rescue = { workspace = true }
# #422 LN-7c Q: `evidence confirm-read` counts the evidence frames a confirmation covers with the
# frame cleaner's statements, read-only (`evidence_covers`).
actingcommand-ledger = { workspace = true }
# ROUT-L RL-1c (#411): `actingctl packs` lists a composer-mode configuration's procedures from the
# standard packs' `schedule.json` through the composer actingd's scheduler workbench uses.
actingcommand-policy = { workspace = true }
actingcommand-runtime-client = { workspace = true }
# The key table of actingd's configuration, which the MCP gates read.
actingcommand-runtime-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Workflow #434 LAB-4: `watchdog …` runs the watchdog from its crate.
actingcommand-watchdog = { workspace = true }
# The evidence and package archives the integration gates write.
zip = { workspace = true }

[dev-dependencies]
actingcommand-artifact-store = { workspace = true }
# Workflow #434 LAB-1: the #422 QR-2b gate builds a diagnosis whose report never started.
actingcommand-lab-ops = { workspace = true, features = ["test-hooks"] }
actingcommand-device = { workspace = true }
actingcommand-pack-containment = { workspace = true }
# Workflow #381 A: the held-start preparation checkpoints and the writer stall gate.
actingcommand-runtime-host = { workspace = true, features = ["test-hooks"] }
# Workflow #434 LAB-5G1b: the gate `lab5g1b_front_mcp` holds the operation layer's MCP front to
# what `actingctl mcp-serve` sends, on the runtime client's scripted Runtime.
actingcommand-runtime-client = { workspace = true, features = ["test-support"] }
# #422 LN-7c C: the gate reads the closed root's frame index rows.
actingcommand-runtime-database = { workspace = true }
actingcommand-scheduler = { workspace = true }
tempfile = "3"
