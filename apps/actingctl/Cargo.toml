# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "actingcommand-actingctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "actingctl"
path = "src/main.rs"

# Workflow #374: the GUI-subsystem launcher the watchdog's scheduled task runs; std only.
[[bin]]
name = "actingwatch"
path = "src/watch_launcher.rs"

[features]
default = ["mcp"]
# Workflow #338: `actingctl mcp-serve` / `mcp-config`. Without it the CLI is unchanged.
mcp = []

[dependencies]
actingcommand-contract = { workspace = true }
# #422 LN-7c Q: `evidence confirm-read` counts the evidence frames a confirmation covers with the
# frame cleaner's statements, read-only (`evidence_covers`).
actingcommand-ledger = { workspace = true }
actingcommand-runtime-client = { workspace = true }
# #411 A66: the watchdog and `actingctl start` read `watchdog.start_window_ms` from actingd's
# configuration through the key table and the defaults file. Workflow #421 INST-1: `actingctl
# install` reads the `install` section and the key table from the same file.
actingcommand-runtime-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Workflow #421 INST-1: `install release verify` and `stage` extract the release zips.
zip = { workspace = true }

[dev-dependencies]
actingcommand-artifact-store = { workspace = true }
actingcommand-device = { workspace = true }
actingcommand-pack-containment = { workspace = true }
# Workflow #381 A: the held-start preparation checkpoints and the writer stall gate.
actingcommand-runtime-host = { workspace = true, features = ["test-hooks"] }
# #422 LN-7c C: the gate reads the closed root's frame index rows.
actingcommand-runtime-database = { workspace = true }
actingcommand-scheduler = { workspace = true }
tempfile = "3"
