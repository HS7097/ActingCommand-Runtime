# SPDX-License-Identifier: AGPL-3.0-only

# Workflow #434 LAB-5G2a (register §1.287, "Slice LAB-5G2a"; contracts/lab-two-entries.md §8.1 and
# §9.3): `actinglab-mcp`, the Lab's MCP server, whose tools are the operation table's offered rows.
# LAB-5G2a is its shell: the protocol and the loop copied from `actingctl mcp-serve` and the tool
# list generated from the table. LAB-5G2b ("Slice LAB-5G2b") serves in its own process the calls of
# the rows `lab_ops::core_ops` serves and, its second part, on Windows the rescue rows the rescue
# module serves but `deploy` and `rollback`, which are refused with `mcp_operation_unsupported`.
# LAB-5G4b ("Slice LAB-5G4b") serves every other offered row through `actinglab.exe serve --stdio
# --front mcp` children. It ships in the Tools archive since slice LAB-5G6 (0.12.57); nothing
# starts it until a client is registered with the MCP entry's second generation.

[package]
name = "actingcommand-actinglab-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "actinglab-mcp"
path = "src/main.rs"

# Workflow #434 LAB-5G4b: test helper of `tests/serve_calls.rs` (`mcp_serve_children_pool`), a
# made-up `actinglab` the test copies beside a copy of the server, which starts it as a `serve`
# child. Never shipped (the Tools archive names `actinglab-mcp` alone). It keeps the default
# `test = true`: `cargo test --bins` runs its (empty) harness anyway, and CI's test build table
# must list it.
[[bin]]
name = "actinglab-mcp-test-child"
path = "src/test_child.rs"

[dependencies]
actingcommand-contract = { workspace = true }
# The operation table, the authoring option's place, the CLI line and the MCP codes of actingctl's
# registry, which this server answers with as today's does.
actingcommand-lab-ops = { workspace = true }
# The rescue rows the rescue module serves, on Windows, where it runs: the rescue rows actinglab
# offers, and so this server.
actingcommand-lab-rescue = { workspace = true }
# Workflow #434 LAB-5G2b: the kept Runtime connection and each write's own, with today's
# provenance.
actingcommand-runtime-client = { workspace = true }
# Workflow #434 LAB-5G2b: the overview's `watchdog` block of `status`, read through
# `crates/watchdog` as actinglab reads it; on Windows only, where the watchdog runs.
actingcommand-watchdog = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Workflow #434 LAB-5G2b: the scripted Runtime of the tests over pipes.
actingcommand-runtime-client = { workspace = true, features = ["test-support"] }
# Workflow #434 LAB-5G2b, second part: the made-up root whose Tools manifest lists the server's
# copy with its SHA-256.
sha2 = { workspace = true }
# The made-up installation roots of the authoring option's test.
tempfile = "3"
