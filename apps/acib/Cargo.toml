# Workflow #479 ACIB-0: `acib`, the ActingCommand iOS Bridge (in Chinese 「iOS 调试桥」), a program of
# its own that the Runtime will speak to as a separate process, as it speaks to adb. This first
# version only reads: the devices usbmuxd lists, a device's lockdown values, the remote services
# of the iOS 17.4 tunnel, what the image mounter answers about mounted images, and whether a
# user application whose bundle identifier holds a given text is installed. Nothing of the
# workspace depends on it, and it depends on no crate of the workspace.

[package]
name = "actingcommand-ios-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "acib"
path = "src/main.rs"

[dependencies]
# The MIT-licensed iOS library the owner allowed (board #479), pinned to one exact version, with
# the fewest features this slice reads with: usbmuxd, the lockdown client (always built), the
# CoreDeviceProxy tunnel with the library's own TCP stack (no network adapter), the RSD
# handshake, the image mounter's queries and the installation proxy's application lookup; TLS
# on rustls with the ring provider.
idevice = { version = "=0.1.68", default-features = false, features = [
    "core_device_proxy",
    "installation_proxy",
    "mobile_image_mounter",
    "ring",
    "rsd",
    "tunnel_tcp_stack",
    "usbmuxd",
] }
serde = { workspace = true }
serde_json = { workspace = true }
# The async runtime lives in this crate only: one current-thread runtime per command.
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
