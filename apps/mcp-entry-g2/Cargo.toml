# SPDX-License-Identifier: AGPL-3.0-only

# Workflow #434 LAB-5G5a: the MCP entry's second generation, a program of its own beside the
# first (`apps/mcp-entry`, generation 1, unchanged), copied from it and changed only where
# generation 2 differs. It pipes JSON-RPC to one current `actinglab-mcp.exe` child and switches
# it, between calls, to the install's current build (contracts/install-cli.md, "The MCP entry").
# A client runs it from `<root>\mcp-entry\g2\` only. Shipped in the Tools half since slice LAB-5G6
# (0.12.57); placing it in `g2\` is a manual step.

[package]
name = "actingcommand-mcp-entry-g2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "actingcommand-mcp-entry-g2"
path = "src/main.rs"

# Test helper of the process test (tests/entry_process.rs): a fake that serves a minimal MCP as
# `actinglab-mcp.exe` and answers `--json mcp plan` as `actinglab.exe`. Never shipped. It keeps
# the default `test = true`: `cargo test --bins` runs its (empty) harness anyway, and CI's test
# build table must list it.
[[bin]]
name = "actingcommand-mcp-entry-g2-fake-child"
path = "src/fake_child.rs"

[dependencies]
actingcommand-contract = { workspace = true }
# #411 P49 (MCP-ENTRY review L4): the entry's own process creation time, read once at its start
# with the probe the owner release uses, goes into its status file.
actingcommand-host-metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
